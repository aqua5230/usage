[project]
name = "usage-cli"
version = "0.30.6"
description = "usage — 在 macOS menu bar 與 Windows 系統匣顯示 Claude Code、Codex、Antigravity 用量的小工具（也提供終端機 TUI）"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=11.0; sys_platform == 'darwin'",
    "rich>=15.0.0,<16.0.0",
]

[project.optional-dependencies]
windows = [
    "pystray>=0.19.5; sys_platform == 'win32'",
    "pillow>=11.0.0; sys_platform == 'win32'",
    "pywebview>=5.4; sys_platform == 'win32'",
    "windows-toasts>=1.3.1; sys_platform == 'win32'",
]

[project.scripts]
usage = "usage_cli:main"
usage-cli = "usage_cli:main"

[tool.uv]
# Lock for every platform we ship on, not just whichever one runs `uv lock`.
# Without this, uv resolves against the running interpreter's environment and
# rewrites the platform markers it can prove false there — a re-lock on Windows
# turns every `sys_platform == 'darwin'` dependency into `python_version < '0'`,
# silently dropping PyObjC from the lock and breaking the macOS build.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main",
    "usage_notifications",
    "pricing",
    "usage_statusline",
    "usage_statusline_agy",
    "usage_statusline_grok",
    "usage_client",
    "i18n",
    "usage_cli",
    "usage_statusline_forwarder",
    "usage_session_resume",
    "usage_terse_mode",
    "project_resolver",
    "doctor",
    "fsevents_watch",
    "prefs",
    "service_status",
    "setup_app",
    "talent_market_bridge",
    "usage_diagnosis_snapshot",
    "usage_terse_reminder",
]

[tool.setuptools.packages.find]
include = ["adapters*", "analyzer*", "discussion*", "installer*", "loaders*", "menubar*", "panels*", "quota*", "tui*", "ui*", "updates*", "usage_common*", "wintray*"]

# Top-level modules cannot collect adjacent data files via package-data.
[tool.setuptools.data-files]
"share/usage" = ["i18n.json"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
build = [
    "py2app>=0.28; sys_platform == 'darwin'",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["release-win"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# usage_statusline.py 設計成可以用系統 python3 跑（macOS 內建是 3.9），
# 必須避開 3.11+ 才有的 datetime.UTC，用 timezone.utc 取代。
"usage_statusline.py" = ["UP017"]
# usage_session_resume.py 同樣裝進 ~/.claude/ 給系統 python3 (3.9) 跑，同一條限制。
"usage_session_resume.py" = ["UP017"]
# Imported analytics source is kept with minimal path fixes; keep formatting
# stable for this integration commit.
"adapters/**/*.py" = ["E501", "I001", "SIM108", "UP015", "UP017"]
"analyzer/**/*.py" = ["E501", "I001", "UP015", "UP017"]
"ui/**/*.py" = ["E501", "I001", "UP017", "UP035"]
"usage_cli.py" = ["E501", "I001", "UP017"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
pretty = true
exclude = "^(build|dist|release-win)/"

[[tool.mypy.overrides]]
module = ["rich.*", "PIL.*", "pystray.*", "webview.*", "windows_toasts.*"]
ignore_missing_imports = true

# PyObjC C-extension frameworks ship without type stubs / py.typed marker.
# `ignore_missing_imports` is the standard idiom for stubless modules — this
# is NOT suppressing a real bug, just declaring the frameworks are untyped.
[[tool.mypy.overrides]]
module = ["AppKit", "Foundation", "objc", "Quartz", "UserNotifications", "WebKit"]
ignore_missing_imports = true

# usage_cli's key readers pair a POSIX branch (termios/tty) with a Windows
# branch (msvcrt); each side's `type: ignore` comments are only "used" when
# mypy runs on the other platform, so unused-ignore warnings must stay off
# for this module to keep `mypy .` green on both macOS and Windows CI.
[[tool.mypy.overrides]]
module = "usage_cli"
warn_unused_ignores = false

# discussion_cli's process-group termination pairs a POSIX branch
# (os.getpgid/killpg) with a Windows branch (Popen.terminate/kill); same
# reasoning as usage_cli above. tests/test_discussion_cli.py asserts against
# signal.SIGKILL, which is POSIX-only too.
[[tool.mypy.overrides]]
module = ["discussion.cli", "tests.test_discussion_cli"]
warn_unused_ignores = false

# tests/test_usage_statusline.py forks a child to contend the POSIX file lock;
# os.fork does not exist on Windows, so its `type: ignore` is only "used" when
# mypy runs there. Same reasoning as usage_cli above.
[[tool.mypy.overrides]]
module = "tests.test_usage_statusline"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

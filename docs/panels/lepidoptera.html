<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0b2841;
      --paper: rgba(16, 49, 78, 0.62);
      --paper-soft: rgba(14, 44, 71, 0.92);
      --paper-edge: rgba(150, 201, 236, 0.42);
      --line: rgba(150, 201, 236, 0.3);
      --text: #e7f1fb;
      --muted: #95bcd8;
      --gold: rgba(150, 201, 236, 0.4);
      --claude: #74bdff;
      --codex: #5fcfdc;
      --agy: #6b9aff;
      --grok: #e7eef5;
      --projects: #aed4ef;
      --warn: #e6ad3e;
      --danger: #f06a47;
      --mono: "SFMono-Regular", "JetBrains Mono", "Menlo", "Consolas", monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", "Noto Serif TC", "Songti TC", "Songti SC", "STSong", serif;
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: 0.01em;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding: 10px;
      position: relative;
      background:
        radial-gradient(circle at 18% 10%, rgba(64, 132, 190, 0.22), transparent 32%),
        radial-gradient(circle at 84% 88%, rgba(34, 86, 132, 0.26), transparent 36%),
        linear-gradient(180deg, #123f63 0%, #0b2841 46%, #081f33 100%);
      background-color: #0b2841;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: 0.6;
      background:
        repeating-linear-gradient(0deg, rgba(159, 205, 240, 0.16) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(90deg, rgba(159, 205, 240, 0.16) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(0deg, rgba(159, 205, 240, 0.07) 0 1px, transparent 1px 14.4px),
        repeating-linear-gradient(90deg, rgba(159, 205, 240, 0.07) 0 1px, transparent 1px 14.4px);
    }

    body::after {
      opacity: 0.5;
      background:
        radial-gradient(circle at 50% 0%, rgba(120, 180, 230, 0.12), transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(6, 22, 38, 0.55), transparent 55%);
    }

    .specimen-drift,
    .specimen-drift * {
      pointer-events: none;
    }

    .specimen-drift {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 5;
    }

    .dust {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(180, 220, 250, 0.16) 0%, rgba(180, 220, 250, 0.05) 42%, transparent 72%);
      filter: blur(2px);
      opacity: 0.4;
      animation: dustFloat 18s ease-in-out infinite;
      transform: translate3d(0, 0, 0);
    }

    .dust-a { top: 18px; right: 24px; animation-delay: -4s; }
    .dust-b { bottom: 56px; left: 8px; width: 110px; height: 110px; animation-duration: 22s; }
    .dust-c { top: 142px; left: 118px; width: 90px; height: 90px; animation-duration: 20s; animation-delay: -8s; }

    .butterfly {
      position: absolute;
      opacity: 0.7;
      transform: translate3d(0, 0, 0);
      animation: butterflyDriftA 18s linear infinite;
      will-change: transform, opacity;
    }

    .butterfly svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0 0 4px rgba(120, 190, 240, 0.28));
    }

    .butterfly .wing-left,
    .butterfly .wing-right {
      transform-box: fill-box;
      transform-origin: left center;
      animation: wingBeat 1.9s ease-in-out infinite;
    }

    .butterfly-a {
      top: 34px;
      left: 24px;
      width: 104px;
      height: 84px;
    }

    .butterfly-b {
      right: 12px;
      bottom: 132px;
      width: 90px;
      height: 74px;
      opacity: 0.58;
      animation-name: butterflyDriftB;
      animation-duration: 21s;
      animation-delay: -9s;
    }

    .butterfly-b .wing-left,
    .butterfly-b .wing-right {
      animation-duration: 2.05s;
    }

    .butterfly-c {
      top: 196px;
      left: 188px;
      width: 82px;
      height: 66px;
      opacity: 0.5;
      animation-name: butterflyDriftC;
      animation-duration: 24s;
      animation-delay: -5s;
    }

    .butterfly-c .wing-left,
    .butterfly-c .wing-right {
      animation-duration: 2.3s;
    }

    .bf-num {
      position: absolute;
      left: -16px;
      bottom: -5px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: rgba(174, 212, 239, 0.78);
      letter-spacing: 0.04em;
      text-transform: none;
    }

    .bf-num::before {
      content: "FIG.";
      margin-right: 2px;
      opacity: 0.7;
    }

    .wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .wrap::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(150, 201, 236, 0.22);
      pointer-events: none;
    }

    .wrap::after {
      content: "+";
      position: absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(168, 208, 238, 0.7);
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1;
      pointer-events: none;
    }

    .card,
    .footer {
      position: relative;
      flex: none;
      background:
        linear-gradient(180deg, rgba(20, 56, 88, 0.72), rgba(11, 38, 62, 0.78)),
        var(--paper);
      border: 1px solid var(--paper-edge);
      box-shadow:
        inset 0 0 0 1px rgba(150, 201, 236, 0.12),
        0 6px 16px rgba(4, 16, 28, 0.34);
      border-radius: 8px;
      overflow: hidden;
    }

    .card::before,
    .footer::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px dashed rgba(150, 201, 236, 0.26);
      border-radius: 5px;
      pointer-events: none;
    }

    .card::after,
    .footer::after {
      content: none;
    }

    .card {
      padding: 7px 13px 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-height: 32px;
      gap: 8px;
      margin: 0 0 7px;
      padding: 4px 0 6px;
      background: none;
      color: var(--text);
      font-weight: 700;
      border: 0;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .brand::after {
      content: "+";
      position: absolute;
      right: 0;
      top: -2px;
      color: rgba(150, 201, 236, 0.5);
      font-family: var(--mono);
      font-size: 13px;
    }

    .brand img {
      width: 24px;
      height: 24px;
      object-fit: cover;
      flex: none;
      border-radius: 5px;
      filter: saturate(1.05) contrast(1.02);
      box-shadow:
        0 0 0 1px rgba(150, 201, 236, 0.55),
        0 0 7px rgba(120, 190, 240, 0.35);
      opacity: 1;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      color: var(--text);
      line-height: 1;
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .brand h1 {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-variant: small-caps;
    }

    .card[data-card="claude"] .brand h1 { color: #9fd2ff; }
    .card[data-card="codex"] .brand h1 { color: #84e0ea; }
    .card[data-card="agy"] .brand h1 { color: #a9c2ff; }
    .card[data-card="projects"] .brand h1 { color: #c6e2f5; }

    .card[data-card="projects"] {
      flex: 1;
    }

    .card[data-card="projects"] .brand {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      height: auto;
      min-height: 0;
      column-gap: 8px;
      row-gap: 10px;
      margin-bottom: 10px;
    }

    .card[data-card="projects"] .brand-icon {
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
    }

    .card[data-card="projects"] h1 {
      grid-column: 2;
      grid-row: 1;
      flex: none;
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .card[data-card="projects"] .switch {
      grid-column: 1 / 3;
      grid-row: 2;
      width: calc((100% - 16px) / 3);
    }

    .card[data-card="projects"] .switch:nth-of-type(1) { justify-self: start; }
    .card[data-card="projects"] .switch:nth-of-type(2) { justify-self: center; }
    .card[data-card="projects"] .switch:nth-of-type(3) { justify-self: end; }

    .switch,
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 3px 9px;
      background: rgba(10, 34, 56, 0.5);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.1;
      font-weight: 700;
      border: 1px solid rgba(150, 201, 236, 0.5);
      box-shadow: inset 0 0 0 1px rgba(150, 201, 236, 0.08);
      border-radius: 5px;
      white-space: nowrap;
      transition: transform 120ms ease-out, background-color 120ms ease-out, border-color 120ms ease-out;
    }

    .switch:hover,
    .action:hover {
      background: rgba(22, 60, 92, 0.7);
      border-color: rgba(174, 212, 239, 0.78);
    }

    .action:active,
    .switch:active {
      transform: translateY(1px);
      background: rgba(8, 28, 46, 0.8);
    }

    .switch[data-active="true"] {
      background: linear-gradient(180deg, rgba(120, 190, 240, 0.95), var(--accent));
      color: #082033;
      border-color: rgba(174, 212, 239, 0.9);
      text-shadow: none;
    }

    .row,
    [data-project-list] {
      padding: 0 2px 4px;
      position: relative;
    }

    .row + .row {
      border-top: 1px dashed var(--line);
      margin-top: 8px;
      padding-top: 8px;
    }

    .card[data-card="claude"] .row:last-child,
    .card[data-card="codex"] .row:last-child,
    .card[data-card="agy"] .row:last-child {
      padding-bottom: 10px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .row-title {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--text);
    }

    .percent {
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .track {
      position: relative;
      height: 12px;
      overflow: hidden;
      background: rgba(6, 22, 38, 0.66);
      border: 1px solid rgba(150, 201, 236, 0.4);
      box-shadow: inset 0 1px 3px rgba(3, 12, 22, 0.5);
      border-radius: 4px;
      padding: 2px;
    }

    .track::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(150, 201, 236, 0.12) 0 1px,
          transparent 1px 10px
        );
      opacity: 0.6;
      pointer-events: none;
      z-index: 2;
    }

    .fill {
      width: 0%;
      height: 100%;
      min-width: 0;
      position: relative;
      z-index: 1;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(150, 201, 236, 0.5), var(--accent) 34%, var(--accent) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(190, 224, 248, 0.22),
        0 0 8px rgba(120, 190, 240, 0.34);
      transition: width 140ms ease-out, background-color 140ms ease-out;
    }

    .fill::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.26), transparent 70%);
      opacity: 0.7;
    }

    .reset {
      margin-top: 4px;
      padding-right: 2px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.3;
      font-weight: 400;
      text-align: right;
      white-space: nowrap;
    }

    .reset[data-warning="true"] {
      color: var(--danger);
      font-weight: 700;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: var(--muted);
    }

    .row[data-available="false"] .fill {
      width: 0%;
    }

    .proj-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      padding: 6px 2px;
      font-size: 14px;
      line-height: 1.3;
    }

    .proj-rank {
      width: 18px;
      color: var(--muted);
      font-family: var(--mono);
      font-weight: 700;
      flex: none;
    }

    .proj-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-tokens {
      color: var(--accent);
      font-family: var(--mono);
      font-weight: 700;
      white-space: nowrap;
    }

    .proj-cost {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      white-space: nowrap;
    }

    .proj-bar {
      flex: 0 0 100%;
      width: 100%;
      height: 4px;
      margin-top: 6px;
      align-self: end;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(6, 22, 38, 0.6);
      box-shadow: inset 0 0 0 1px rgba(150, 201, 236, 0.16);
    }

    .proj-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(150, 201, 236, 0.5), var(--projects));
      opacity: 0.92;
    }

    .proj-row:first-child .proj-bar {
      height: 4.5px;
    }

    .proj-row:first-child .proj-bar-fill {
      opacity: 1;
    }

    .proj-row:last-child .proj-bar {
      margin-bottom: 2px;
    }

    .footer {
      min-height: 128px;
      padding: 11px 12px;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(240, 106, 71, 0.16);
      border: 1px solid rgba(240, 106, 71, 0.48);
      color: #ffad92;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.3;
      font-weight: 400;
    }

    .today {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--line);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action {
      min-height: 32px;
      font-size: 13px;
      line-height: 1;
      padding: 4px 10px;
      flex: 1;
    }

    .action.primary {
      color: #082033;
      background: linear-gradient(180deg, #8fc8ff, #5aa9ee);
      border-color: rgba(174, 212, 239, 0.9);
      text-shadow: none;
    }

    .action.primary:hover {
      background: linear-gradient(180deg, #a3d3ff, #6fb5f2);
      color: #061a2b;
    }

    .action[data-action="install"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }

    .attribution {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      margin-top: 6px;
    }

    .attribution a {
      color: inherit;
      text-decoration: none;
    }

    @keyframes wingBeat {
      0%, 100% { transform: rotateY(8deg); }
      50% { transform: rotateY(52deg); }
    }

    @keyframes butterflyDriftA {
      0% { transform: translate3d(-6px, 0, 0) rotate(-5deg); opacity: 0.18; }
      12% { opacity: 0.85; }
      24% { transform: translate3d(58px, 20px, 0) rotate(3deg); }
      48% { transform: translate3d(166px, -10px, 0) rotate(-6deg); }
      72% { transform: translate3d(228px, 38px, 0) rotate(4deg); }
      88% { opacity: 0.85; }
      100% { transform: translate3d(302px, 14px, 0) rotate(-4deg); opacity: 0.12; }
    }

    @keyframes butterflyDriftB {
      0% { transform: translate3d(0, 0, 0) rotate(7deg); opacity: 0.1; }
      16% { opacity: 0.74; }
      38% { transform: translate3d(-72px, -18px, 0) rotate(-2deg); }
      64% { transform: translate3d(-154px, 22px, 0) rotate(6deg); }
      84% { opacity: 0.74; }
      100% { transform: translate3d(-224px, -8px, 0) rotate(-5deg); opacity: 0.05; }
    }

    @keyframes butterflyDriftC {
      0% { transform: translate3d(0, 0, 0) rotate(4deg); opacity: 0.06; }
      14% { opacity: 0.72; }
      36% { transform: translate3d(-44px, 54px, 0) rotate(-6deg); }
      60% { transform: translate3d(30px, 122px, 0) rotate(5deg); }
      84% { opacity: 0.68; }
      100% { transform: translate3d(-18px, 208px, 0) rotate(-3deg); opacity: 0.04; }
    }

    @keyframes dustFloat {
      0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.2; }
      50% { transform: translate3d(12px, -8px, 0); opacity: 0.38; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    .blueprint-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .bp-corner {
      position: absolute;
      width: 13px;
      height: 13px;
    }

    .bp-corner.tl { top: 5px; left: 5px; border-top: 1.5px solid rgba(168, 208, 238, 0.62); border-left: 1.5px solid rgba(168, 208, 238, 0.62); }
    .bp-corner.tr { top: 5px; right: 5px; border-top: 1.5px solid rgba(168, 208, 238, 0.62); border-right: 1.5px solid rgba(168, 208, 238, 0.62); }
    .bp-corner.bl { bottom: 5px; left: 5px; border-bottom: 1.5px solid rgba(168, 208, 238, 0.62); border-left: 1.5px solid rgba(168, 208, 238, 0.62); }
    .bp-corner.br { bottom: 5px; right: 5px; border-bottom: 1.5px solid rgba(168, 208, 238, 0.62); border-right: 1.5px solid rgba(168, 208, 238, 0.62); }

    .bp-title {
      position: absolute;
      left: 1px;
      top: 50%;
      transform-origin: left center;
      transform: rotate(-90deg) translate(-50%, 0);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.32em;
      color: rgba(160, 202, 234, 0.5);
      white-space: nowrap;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 13px;
      height: 13px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 6px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 240px;
      padding: 7px 9px;
      border-radius: 5px;
      background: rgba(8, 26, 44, 0.97);
      color: var(--text);
      border: 1px solid var(--paper-edge);
      box-shadow: 0 8px 20px rgba(3, 12, 22, 0.5);
      font-size: 11px;
      line-height: 1.4;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging {
      cursor: grabbing;
      opacity: 0.82;
      box-shadow:
        inset 0 0 0 1px rgba(150, 201, 236, 0.3),
        0 10px 24px rgba(4, 16, 28, 0.5),
        0 0 12px rgba(150, 201, 236, 0.2);
      transform: translateY(-2px);

  <script>
    const defaultPanelHooks = {
      accentFallback(cardEl, computedAccent) {
        return computedAccent;
      },
      applyFillVisual(fillEl, { available, percent, color }) {
        fillEl.style.width = available ? `${Math.max(0, Math.min(100, percent))}%` : "0%";
        fillEl.style.setProperty("--fill-color", color);
      },
      projectRankLabels: ["1", "2", "3"],
      renderProjectRow(p, index, ranks) {
        const row = document.createElement("div");
        row.className = "proj-row";
        const rank = document.createElement("span");
        rank.className = "proj-rank";
        rank.textContent = ranks[index];
        const name = document.createElement("span");
        name.className = "proj-name";
        name.textContent = p.name || "";
        const tok = document.createElement("span");
        tok.className = "proj-tokens";
        tok.textContent = p.tokensText || "";
        const cost = document.createElement("span");
        cost.className = "proj-cost";
        cost.textContent = p.costText || "";
        const bar = document.createElement("div");
        bar.className = "proj-bar";
        const fill = document.createElement("div");
        fill.className = "proj-bar-fill";
        fill.style.width = `${p.sharePercent}%`;
        bar.append(fill);
        row.append(rank, name, tok, cost, bar);
        return row;
      },
      switchButtonStrategy(state) {
        // The switch button lives in the Claude card header; when that card is
        // hidden, move it to the next visible home so the menu stays reachable.
        const button = document.querySelector('[data-action="switch"]');
        if (!button) return;
        let host = document.querySelector('[data-card="claude"] .brand');
        let className = "switch";
        if (state.hideClaude && !state.hideCodex) {
          host = document.querySelector('[data-card="codex"] .brand');
        } else if (state.hideClaude && state.hideCodex && !state.hideAgy) {
          host = document.querySelector('[data-card="agy"] .brand');
        } else if (state.hideClaude && state.hideCodex && state.hideAgy && !state.hideGrok) {
          host = document.querySelector('[data-card="grok"] .brand');
        }
        if (!host || (state.hideClaude && state.hideCodex && state.hideAgy && state.hideGrok)) {
          host = document.querySelector(".footer .actions");
          className = "action";
        }
        if (!host) return;
        button.className = className;
        if (button.parentElement !== host) host.appendChild(button);
      },
      pointerdownExcludeSelector: "button, a, .codex-stale-info",
    };

    if (!window.PanelHooks || typeof window.PanelHooks !== "object") {
      window.PanelHooks = {};
    }
    Object.entries(defaultPanelHooks).forEach(([name, defaultValue]) => {
      if (window.PanelHooks[name] === undefined) {
        window.PanelHooks[name] = defaultValue;
      }
    });

ooks_equivalent": "≈ {books} 冊分の文字量", "report_wrapped_beast_phoenix_title": "フェニックス戴冠", "report_wrapped_beast_phoenix_caption": "今年は Claude の火力がわずかに上回り、灰を空へ吹き返すような一年でした。", "report_wrapped_beast_dragon_title": "ドラゴン戴冠", "report_wrapped_beast_dragon_caption": "今年は Codex の火力がより強く、工事現場を完成まで焼き切るような一年でした。", "project_butler": "前回の続きから", "project_butler_tooltip": "新規セッションを開くと、前回の進捗を自動で AI に引き継ぎます。説明し直す必要はありません。", "terse_mode_menu": "トークン節約モード", "terse_mode_tooltip": "新規セッションを開くと、Claude に短めの返答を自動で求めて出力 token を節約します（Codex を導入済みならそちらにも適用されます）。コード、コマンド、パス、エラーメッセージは省略しません。その後もあなたが送る各メッセージで、簡潔さを保つよう軽く念押しされます。", "terse_reminder_instruction": "[簡潔モードは引き続き有効：この返信は簡潔に；コード、コマンド、パス、エラーメッセージは一字そのまま；セキュリティ警告と不可逆操作の確認は引き続き完全に記述すること。]", "terse_mode_instruction": "（この会話では「簡潔モード」が有効です。最初の返信の冒頭でこのことに触れてください——すでに他の挨拶（進捗の引き継ぎなど）を述べる予定がある場合は、「簡潔モードが有効」であることをその挨拶に自然に組み込み、別の行を追加しないでください。組み込める挨拶がない場合は、自分で一行「🐾 簡潔モードが有効になりました。返答は短くしていきます！」と述べてください。今この瞬間から会話が終わるまで、すべての返信でこのルールを守ってください——会話が長くなったり話題が増えたりしても、薄れたり通常の口調に戻ったりしないこと。体言止めや断片的な言い方でも構わないので、無理に完全な文にしないでください。前置き、丁寧すぎる言い回し、重複した表現、不必要なつなぎ文を省き、短文や箇条書きで済むなら長い段落に広げないでください。言葉は短い方を選んでください（例:「修正」であって「この問題に対する解決策を実装する」ではない）。装飾的な表や絵文字、ツール呼び出しの実況も不要です。独自の省略語は作らないでください（例:「設定」を「設」に略すなど）——トークナイザー上は完全な語と同じ長さになり、何も節約にならず読み手が余計に解読する手間が増えるだけなので、完全な語のままの方が得です。コード、コマンド、ファイルパス、エラーメッセージは一文字たりとも省略・書き換えしないこと。セキュリティ警告、不可逆操作の確認、接続詞を省くと誤読の恐れがある複数手順の説明では、簡潔さより先に完全な文で明確に伝え、伝え終えたら簡潔モードに戻ってください。ユーザーが明確に詳しい解説や段階的な説明を求めた場合、または状況的に十分な推論が必要な場合は、その要求を優先し、このモードのために重要な情報を落とさないでください。）", "terse_mode_enabled_msg": "有効化しました。今後、新しい Claude Code セッションでは返答をより簡潔にするよう自動で求めます（Codex を導入済みならそちらにも適用されます）。コード、コマンド、パス、エラーメッセージは省略しません。次回セッション開始時に反映されます。", "terse_mode_disabled_msg": "無効化しました。新規セッションで簡潔な返答を自動要求しなくなります。", "resume_enabled_restart": "有効化しました。今後、新しい Claude Code セッションを開くと、このプロジェクトで前回どこまで進めたかを自動的に把握します。画面に通知は出ません（正常です）が、Claude は把握しています。次回セッション開始時に反映されます。", "resume_disabled_msg": "無効化しました。新規セッションで前回の進捗を自動で読み込まなくなります。", "resume_action_failed": "操作に失敗しました", "report_rw_none": "（記録なし）", "report_rw_inject_lead": "（これは進捗の引き継ぎです。最初の返信の冒頭で、まず一行「🐾 前回の続きを引き継ぎました！そのまま続けましょう！」と述べ、下記の手がかりをそのまま読み上げるのではなく、賢く気の利いた相棒のように消化してください：まずユーザーが最後に実際に取り組んでいたことを見極め（「最近の作業」は新しい順なので、先頭の項目を信頼し、古いものに引きずられないこと）、前回どこまで進んだか・何が完了したかを一、二文で温かく具体的に振り返り、次に取るべき具体的な一歩を提示してください——具体的に述べ、「何をしますか」と聞き返さないこと。下記にある情報だけを使い、無いことは創作しないこと。手がかりが乏しくて判断できない場合は正直にそう述べ、見えるスレッドを挙げて選んでもらうこと。その後、通常どおり応答してください。）\n\n", "report_rw_empty": "（このセッションの最初の返信の冒頭に、一行「🐾 おかえりなさい！このプロジェクトはまだ引き継ぐ進捗がありません。」と述べてから、通常どおり応答してください。）", "report_rw_prompt": "プロジェクト：{project}（最終アクティブ {when}）\n最近の作業（新しい順）：{last_request}\n完了した進捗：{commits}\n未完了のToDo：{todos}", "report_rw_uncommitted": "前回の終了時に未コミット：{branch} ブランチに変更済み未コミットのファイルが {count} 件（{files}）", "report_rw_diagnosis_reminder": "健診メモ: 直近では約 {waste_pct}% の無駄が{cause}から出ています。「直して」と言ってもらえれば、{path} の完全な診断を読んで対応します。", "report_rw_diagnosis_reminder_explain": "健診メモ: 直近では約 {waste_pct}% の無駄が{cause}から出ています。「見せて」と言ってもらえれば、{path} の完全な診断を読み解いて説明と対策をお伝えします。", "report_rw_diagnosis_cause_default": "避けられるコンテキスト浪費", "report_rw_diagnosis_cause_repeated_reads": "同じファイル群の読み直し", "report_rw_diagnosis_cause_polluter_dirs": "生成物/依存ディレクトリまで読んでいること", "report_rw_diagnosis_cause_anomaly_session": "単一セッションの異常な肥大化", "report_rw_diagnosis_cause_noisy_bash": "Bash 出力が大きすぎること", "report_rw_diagnosis_cause_repeated_bash": "同じ Bash コマンドの繰り返し実行", "report_sessions": "セッション", "report_share": "割合", "report_share_button_label": "共有", "report_share_close": "閉じる", "report_share_copied": "クリップボードにコピーしました ✓", "report_share_download_csv": ".csv で保存", "report_share_download_html": ".html を保存", "report_share_download_png": ".png を保存", "report_share_file_hint": "AirDrop / Mail / Slack / メッセージで送れます。スマホ・PC どちらも閲覧可", "report_share_file_mask_toggle": "プロジェクト名を隠す", "report_share_file_title": "コピーを共有", "report_share_modal_title": "レポートを共有", "report_share_path_copied": "パスをコピーしました ✓", "report_start_time": "開始時刻", "report_title": "AI 使用量の振り返り", "report_insights_section": "インサイト", "report_insights_quiet": "今期は安定したペースで、特筆すべき異常はありません。", "report_ins 되는 서두, 불필요한 연결 문장은 덜어내고, 짧은 문장이나 목록으로 충분하면 긴 단락으로 늘이지 마세요. 단어는 짧은 쪽을 고르세요 (예: \"이 문제에 대한 해결책을 구현하다\" 대신 \"고치다\"). 장식용 표나 이모지, 도구 호출 중계는 넣지 마세요. 임의로 줄임말을 만들지 마세요 (예: \"설정\"을 \"설\"로 줄이는 식) — 토크나이저 상으로는 완전한 단어와 길이가 같아서 절약되는 게 없고 읽는 사람만 더 해석해야 하니, 완전한 단어를 쓰는 편이 더 낫습니다. 코드, 명령어, 파일 경로, 오류 메시지는 한 글자도 생략하거나 바꾸면 안 됩니다. 보안 경고, 되돌릴 수 없는 작업의 확인, 접속사를 생략하면 오독 위험이 있는 다단계 설명에서는 간결함보다 먼저 완전하고 명확하게 전달한 뒤, 전달이 끝나면 다시 간결 모드로 돌아가세요. 사용자가 자세한 설명이나 단계별 안내를 명확히 요청했거나, 상황상 충분한 추론이 꼭 필요하다면 그 요구를 우선하고, 이 모드 때문에 핵심 정보를 빼먹지 마세요.)", "terse_mode_enabled_msg": "활성화했습니다. 이제 새 Claude Code 세션에서는 더 간결하게 답하도록 자동으로 요청합니다 (Codex가 설치되어 있으면 그쪽에도 적용됩니다). 코드, 명령어, 경로, 오류 메시지는 줄이지 않습니다. 다음 세션 시작 시 적용됩니다.", "terse_mode_disabled_msg": "비활성화했습니다. 새 세션에서 더 이상 간결한 답변을 자동 요청하지 않습니다.", "resume_enabled_restart": "활성화했습니다. 이제 새 Claude Code 세션을 시작하면 이 프로젝트에서 지난번에 어디까지 했는지 자동으로 파악합니다. 화면에는 안내가 표시되지 않지만(정상입니다) Claude는 알고 있습니다. 다음 세션 시작 시 적용됩니다.", "resume_disabled_msg": "비활성화했습니다. 새 세션에서 더 이상 지난 진행 상황을 자동으로 불러오지 않습니다.", "resume_action_failed": "작업 실패", "report_rw_none": "(기록 없음)", "report_rw_inject_lead": "(이것은 진행 상황 인수인계입니다. 첫 답변 맨 앞에 먼저 한 줄 \"🐾 지난 작업을 불러왔어요! 이어서 가볼까요?\"라고 말한 뒤, 아래 단서를 그대로 읽지 말고 똑똑하고 사려 깊은 동료처럼 소화하세요: 먼저 사용자가 마지막에 실제로 무엇을 하고 있었는지 파악하고(\"최근 작업한 내용\"은 최신순이므로 맨 위 항목을 신뢰하고 오래된 것에 끌려가지 마세요), 지난번에 어디까지 했고 무엇을 완료했는지 한두 문장으로 따뜻하고 구체적으로 짚어 준 뒤, 이어서 취해야 할 구체적인 다음 단계 하나를 제시하세요 — 구체적으로 말하고 \"무엇을 할까요\"라고 되묻지 마세요. 아래 있는 내용만 사용하고 없는 것은 지어내지 마세요. 단서가 너무 적어 판단하기 어려우면 솔직히 그렇게 말하고 보이는 갈래들을 나열해 고르게 하세요. 그런 다음 평소대로 응답하세요.)\n\n", "report_rw_empty": "(이 세션의 첫 답변 맨 앞에 한 줄 \"🐾 돌아오셨네요! 이 프로젝트는 아직 이어갈 내용이 없어요.\"라고 말한 뒤 평소대로 응답하세요.)", "report_rw_prompt": "프로젝트: {project} (마지막 활동 {when})\n최근 작업한 내용 (최신순): {last_request}\n완료한 진행: {commits}\n미완료 할 일: {todos}", "report_rw_uncommitted": "지난번 종료 시 미커밋 파일: {branch} 브랜치에 {count}개 파일이 커밋되지 않은 채 남아 있었습니다 ({files})", "report_rw_diagnosis_reminder": "진단 알림: 최근 낭비 약 {waste_pct}%의 주된 원인은 {cause}입니다. \"고쳐줘\"라고 말하면 {path}의 전체 진단을 읽고 바로 처리할게요.", "report_rw_diagnosis_reminder_explain": "진단 알림: 최근     let currentLanguage = "en";

    function languageTable(language) {
      return I18N[language] || I18N[FALLBACK_LANGUAGE] || {};
    }

    function t(key, params = {}) {
      const template = languageTable(currentLanguage)[key] || languageTable(FALLBACK_LANGUAGE)[key] || key;
      return template.replace(/\{(\w+)\}/g, (_, name) => `${params[name] ?? ""}`);
    }

    function labels() {
      return {
        session: t("session_label"),
        weekly: t("weekly_label"),
      };
    }

<title>Page not found — usage</title>

<style>
@property --p { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
:root {
  color-scheme: dark;
  --bg: #090a0f;
  --fg: #f5f5f7;
  --fg-dim: #9898a0;
  --accent: #ff8c42;
  --accent-soft: rgba(255, 140, 66, 0.12);
  --border: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; }
html, body { min-width: 0; margin: 0; overflow-x: clip; background: var(--bg); color: var(--fg); }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { display: grid; min-height: 100vh; place-items: center; padding: 32px 20px; text-align: center; }
.notfound { width: min(100%, 440px); }
.mark { position: relative; width: 160px; height: 160px; margin: 0 auto; color: var(--fg); }
.mark svg { position: absolute; inset: 0; width: 160px; height: 160px; }
.mark-base { opacity: 0.16; }
.mark-progress {
  --p: 32deg;
  -webkit-mask: conic-gradient(from 331deg, #000 0deg var(--p), transparent var(--p) 360deg);
  mask: conic-gradient(from 331deg, #000 0deg var(--p), transparent var(--p) 360deg);
}
.mark-cat { animation: breathe 4s ease-in-out infinite; }
h1 { margin: 20px 0 8px; font-size: clamp(28px, 6vw, 40px); line-height: 1.12; letter-spacing: -0.04em; }
p { margin: 0 0 20px; color: var(--fg-dim); font-size: 15px; }
.home {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
  padding: 0 16px; border-radius: 8px; background: var(--accent); color: var(--bg);
  font-size: 15px; font-weight: 600; text-decoration: none; transition: background 150ms ease;
}
.home:hover { background: #ffa365; }
.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@keyframes breathe { 50% { transform: scale(0.97); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
(function () {
  const copy = {
    en: { title: 'Page not found — usage', slogan: "This page isn't in your quota.", home: 'Back to home' },
    'zh-TW': { title: '找不到這一頁 — usage', slogan: '這一頁不在你的額度裡。', home: '回首頁' },
    'zh-CN': { title: '找不到这一页 — usage', slogan: '这一页不在你的额度里。', home: '回首页' },
    ja: { title: 'ページが見つかりません — usage', slogan: 'このページはクォータの範囲外です。', home: 'ホームへ戻る' },
    ko: { title: '페이지를 찾을 수 없습니다 — usage', slogan: '이 페이지는 할당량에 없어요.', home: '홈으로' }
  };
  function normalise(value) {
    const lang = String(value || '').toLowerCase();
    if (lang === 'zh-tw' || lang === 'zh-hk' || lang.startsWith('zh-hant')) return 'zh-TW';
    if (lang.startsWith('zh')) return 'zh-CN';
    if (lang.startsWith('ja')) return 'ja';
    if (lang.startsWith('ko')) return 'ko';
    return lang.startsWith('en') ? 'en' : '';
  }
  const pathMatch = location.pathname.match(/^\/usage\/(zh-TW|zh-CN|ja|ko)(?:\/|$)/);
  let lang = pathMatch ? pathMatch[1] : '';
  if (!lang) {
    try { lang = normalise(localStorage.getItem('usage_lang')); } catch (error) { /* ignore */ }
  }
  if (!lang) {
    const languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    for (const candidate of languages) {
      lang = normalise(candidate);
      if (lang) break;
    }
  }
  if (!copy[lang]) lang = 'en';
  const text = copy[lang];
  document.documentElement.lang = lang;
  document.title = text.title;
  document.getElementById('notfound-title').textContent = text.slogan;
  const home = document.querySelector('.home');
  home.textContent = text.home;
  home.href = lang === 'en' ? '/usage/' : '/usage/' + lang + '/';
})();
</script>

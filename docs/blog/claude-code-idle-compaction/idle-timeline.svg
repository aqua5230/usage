<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" role="img" aria-labelledby="title desc" xml:lang="zh-TW" font-family="Noto Sans TC, -apple-system, sans-serif">
<title id="title">最後一則訊息送出後的閒置壓縮時間軸</title>
<desc id="desc">0 分鐘 — 你送出最後一則訊息 / 約 54 分鐘 — 閒置壓縮：趁快取還在，先寫好摘要 / 60 分鐘 — 一小時的快取過期 / 60 分鐘後 — 你回來送訊息：Claude Code 讀的是摘要 / 沒有閒置壓縮時 — 整段對話要重新處理 / 條件：對話超過 20 萬 tokens，而且用的是一小時的快取</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DDE6E1"/>
    <stop offset="1" stop-color="#CEDBD4"/>
  </linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141414" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="640" height="364" rx="16" fill="url(#bg)"/>
<g filter="url(#sh)">
  <rect x="26" y="42" width="588" height="296" rx="10" fill="#161616" stroke="#2C2C2C" stroke-width="1"/>
</g>
<text x="372" y="72" fill="#E0E0E0" font-size="13.5" text-anchor="end" data-role="label"><tspan x="372" font-weight="600">閒置壓縮：</tspan><tspan x="372" dy="19" font-weight="400">趁快取還在，先寫好摘要</tspan></text>
<text x="582" y="72" fill="#E0E0E0" font-size="13.5" text-anchor="end" data-role="label"><tspan x="582" font-weight="600">你回來送訊息：</tspan><tspan x="582" dy="19" font-weight="400">Claude Code 讀的是摘要</tspan></text>
<path d="M 380 86 H 392 V 117" fill="none" stroke="#F2C46D" stroke-width="1.25"/>
<line x1="548" y1="99" x2="548" y2="117" stroke="#8C8C8C" stroke-width="1.25"/>
<text x="56" y="135" fill="#8A939E" font-size="13" text-anchor="start" font-weight="400" data-role="label">0 分鐘</text>
<text x="392" y="135" fill="#E0E0E0" font-size="13" text-anchor="middle" font-weight="600" data-role="label">約 54 分鐘</text>
<text x="582" y="135" fill="#8A939E" font-size="13" text-anchor="end" font-weight="500" data-role="label">60 分鐘後</text>
<line x1="56" y1="148" x2="430" y2="148" stroke="#8A939E" stroke-width="1.5"/>
<line x1="430" y1="148" x2="578" y2="148" stroke="#8A939E" stroke-width="1.5" stroke-dasharray="3 4"/>
<path d="M 576 144 L 582 148 L 576 152" fill="none" stroke="#8A939E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="56" y1="143" x2="56" y2="153" stroke="#8A939E" stroke-width="1.5"/>
<line x1="392" y1="148" x2="430" y2="148" stroke="#F2C46D" stroke-width="3.5"/>
<line x1="430" y1="148" x2="430" y2="167" stroke="#8C8C8C" stroke-width="1.25"/>
<circle cx="392" cy="148" r="4.5" fill="#F2C46D"/>
<circle cx="430" cy="148" r="3.5" fill="#8A939E"/>
<circle cx="548" cy="148" r="4" fill="#E0E0E0"/>
<text x="56" y="182" fill="#E0E0E0" font-size="13.5" text-anchor="start" font-weight="400" data-role="label">你送出最後一則訊息</text>
<text x="430" y="182" fill="#E0E0E0" font-size="13" text-anchor="middle" font-weight="600" data-role="label">60 分鐘</text>
<text x="430" y="200" fill="#8A939E" font-size="13" text-anchor="middle" font-weight="400" data-role="label">一小時的快取過期</text>
<text x="56" y="232" fill="#8A939E" font-size="13.5" text-anchor="start" font-weight="600" data-role="label">沒有閒置壓縮時</text>
<line x1="56" y1="248" x2="430" y2="248" stroke="#8A939E" stroke-width="1.25"/>
<line x1="430" y1="248" x2="578" y2="248" stroke="#8A939E" stroke-width="1.25" stroke-dasharray="3 4"/>
<path d="M 56 244 V 252 M 430 244 V 252 M 576 244 L 582 248 L 576 252" fill="none" stroke="#8A939E" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="548" y1="248" x2="548" y2="262" stroke="#F6A9A2" stroke-width="1.25"/>
<circle cx="548" cy="248" r="4.5" fill="#F6A9A2"/>
<text x="582" y="276" fill="#E0E0E0" font-size="13.5" text-anchor="end" font-weight="500" data-role="label">整段對話要重新處理</text>
<line x1="56" y1="294" x2="582" y2="294" stroke="#2C2C2C" stroke-width="1"/>
<text x="56" y="318" fill="#8A939E" font-size="13" text-anchor="start" font-weight="400" data-role="label">條件：對話超過 20 萬 tokens，而且用的是一小時的快取</text>

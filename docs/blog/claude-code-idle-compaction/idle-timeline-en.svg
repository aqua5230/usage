<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" role="img" aria-labelledby="title desc" xml:lang="en" font-family="Noto Sans TC, -apple-system, sans-serif">
<title id="title">Idle compaction timeline after your last message</title>
<desc id="desc">0 min — Your last message / About 54 min — Idle compaction: the summary is written while the cache is still there / 60 min — The one-hour cache expires / After 60 min — You come back: Claude Code works from the summary / Without idle compaction — The whole conversation is processed again / Applies to conversations over 200K tokens on the one-hour cache</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DDE6E1"/>
    <stop offset="1" stop-color="#CEDBD4"/>
  </linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141414" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="640" height="364" rx="16" fill="url(#bg)"/>
<g filter="url(#sh)">
  <rect x="26" y="42" width="588" height="296" rx="10" fill="#161616" stroke="#2C2C2C" stroke-width="1"/>
</g>
<text x="372" y="66" fill="#E0E0E0" font-size="13.5" text-anchor="end" data-role="label"><tspan x="372" font-weight="600">Idle compaction:</tspan><tspan x="372" dy="18" font-weight="400"> the summary is written</tspan><tspan x="372" dy="18" font-weight="400"> while the cache is still there</tspan></text>
<text x="582" y="66" fill="#E0E0E0" font-size="13.5" text-anchor="end" data-role="label"><tspan x="582" font-weight="600">You come back:</tspan><tspan x="582" dy="18" font-weight="400"> Claude Code works</tspan><tspan x="582" dy="18" font-weight="400"> from the summary</tspan></text>
<path d="M 380 96 H 392 V 117" fill="none" stroke="#F2C46D" stroke-width="1.25"/>
<line x1="548" y1="108" x2="548" y2="117" stroke="#8C8C8C" stroke-width="1.25"/>
<text x="56" y="135" fill="#8A939E" font-size="13" text-anchor="start" font-weight="400" data-role="label">0 min</text>
<text x="392" y="135" fill="#E0E0E0" font-size="13" text-anchor="middle" font-weight="600" data-role="label">About 54 min</text>
<text x="582" y="135" fill="#8A939E" font-size="13" text-anchor="end" font-weight="500" data-role="label">After 60 min</text>
<line x1="56" y1="148" x2="430" y2="148" stroke="#8A939E" stroke-width="1.5"/>
<line x1="430" y1="148" x2="578" y2="148" stroke="#8A939E" stroke-width="1.5" stroke-dasharray="3 4"/>
<path d="M 576 144 L 582 148 L 576 152" fill="none" stroke="#8A939E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="56" y1="143" x2="56" y2="153" stroke="#8A939E" stroke-width="1.5"/>
<line x1="392" y1="148" x2="430" y2="148" stroke="#F2C46D" stroke-width="3.5"/>
<line x1="430" y1="148" x2="430" y2="167" stroke="#8C8C8C" stroke-width="1.25"/>
<circle cx="392" cy="148" r="4.5" fill="#F2C46D"/>
<circle cx="430" cy="148" r="3.5" fill="#8A939E"/>
<circle cx="548" cy="148" r="4" fill="#E0E0E0"/>
<text x="56" y="182" fill="#E0E0E0" font-size="13.5" text-anchor="start" font-weight="400" data-role="label">Your last message</text>
<text x="430" y="182" fill="#E0E0E0" font-size="13" text-anchor="middle" font-weight="600" data-role="label">60 min</text>
<text x="430" y="200" fill="#8A939E" font-size="13" text-anchor="middle" font-weight="400" data-role="label">The one-hour cache expires</text>
<text x="56" y="232" fill="#8A939E" font-size="13.5" text-anchor="start" font-weight="600" data-role="label">Without idle compaction</text>
<line x1="56" y1="248" x2="430" y2="248" stroke="#8A939E" stroke-width="1.25"/>
<line x1="430" y1="248" x2="578" y2="248" stroke="#8A939E" stroke-width="1.25" stroke-dasharray="3 4"/>
<path d="M 56 244 V 252 M 430 244 V 252 M 576 244 L 582 248 L 576 252" fill="none" stroke="#8A939E" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="548" y1="248" x2="548" y2="262" stroke="#F6A9A2" stroke-width="1.25"/>
<circle cx="548" cy="248" r="4.5" fill="#F6A9A2"/>
<text x="582" y="276" fill="#E0E0E0" font-size="13.5" text-anchor="end" font-weight="500" data-role="label">The whole conversation is processed again</text>
<line x1="56" y1="294" x2="582" y2="294" stroke="#2C2C2C" stroke-width="1"/>
<text x="56" y="318" fill="#8A939E" font-size="13" text-anchor="start" font-weight="400" data-role="label">Applies to conversations over 200K tokens on the one-hour cache</text>
<rect x="238.39" y="16" width="163.22" height="16" fill="#DCE5E0" data-role="watermark-mask"/>
<text x="320" y="28" font-size="12" font-family="-apple-system, Noto Sans TC, sans-serif" fill="#8A8A8A" text-anchor="middle" data-role="watermark">aqua5230.github.io/usage</text>
</svg>

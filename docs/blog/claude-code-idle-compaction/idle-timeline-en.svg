<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338" role="img" aria-labelledby="title desc" xml:lang="en" font-family="Noto Sans TC, -apple-system, sans-serif">
<title id="title">Idle compaction timeline after your last message</title>
<desc id="desc">0 min — Your last message / About 54 min — Idle compaction: the summary is written while the cache is still there / 60 min — The one-hour cache expires / After 60 min — You come back: Claude Code works from the summary / Without idle compaction — The whole conversation is processed again / Applies to conversations over 200K tokens on the one-hour cache</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9CFC0"/><stop offset=".55" stop-color="#6E9E8E"/><stop offset="1" stop-color="#3F6E61"/></linearGradient><radialGradient id="g1" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#E8D9B5" stop-opacity=".55"/><stop offset="1" stop-color="#E8D9B5" stop-opacity="0"/></radialGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2A22" flood-opacity=".38"/></filter></defs>
<rect width="600" height="338" rx="16" fill="url(#bg)"/>
<rect width="600" height="338" rx="16" fill="url(#g1)"/>
<g filter="url(#sh)"><rect x="20" y="20" width="560" height="298" rx="14" fill="#1E2228" stroke="#FFFFFF1A"/></g>
<text x="48" y="171" fill="#F2F2F2" font-size="15" text-anchor="start" font-weight="400">Your last message</text>
<text x="350" y="53" fill="#9FD3BD" font-size="15" text-anchor="end"><tspan x="350" font-weight="600">Idle compaction:</tspan><tspan x="350" dy="20"> the summary is written</tspan><tspan x="350" dy="20"> while the cache is still there</tspan></text>
<text x="552" y="53" fill="#8AB4F8" font-size="15" text-anchor="end"><tspan x="552" font-weight="600">You come back:</tspan><tspan x="552" dy="20"> Claude Code works</tspan><tspan x="552" dy="20"> from the summary</tspan></text>
<path d="M48 137H408" fill="none" stroke="#8A939E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M408 137H548" fill="none" stroke="#8A939E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
<path d="M548 133L552 137L548 141" fill="none" stroke="#8A939E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M372 137H408" fill="none" stroke="#9FD3BD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M357 86H372V108" fill="none" stroke="#9FD3BD" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/>
<path d="M526 101V108" fill="none" stroke="#8AB4F8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/>
<path d="M48 132V142" fill="none" stroke="#8A939E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M408 137V153" fill="none" stroke="#F2C46D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="372" cy="137" r="5" fill="#9FD3BD"/>
<circle cx="408" cy="137" r="4" fill="#F2C46D"/>
<circle cx="526" cy="137" r="5" fill="#8AB4F8"/>
<text x="48" y="124" fill="#8A939E" font-size="14" text-anchor="start" font-weight="400">0 min</text>
<text x="372" y="124" fill="#9FD3BD" font-size="14" text-anchor="middle" font-weight="600">About 54 min</text>
<text x="552" y="124" fill="#8AB4F8" font-size="14" text-anchor="end" font-weight="600">After 60 min</text>
<text x="408" y="171" fill="#F2C46D" font-size="14" text-anchor="middle" font-weight="600">60 min</text>
<text x="408" y="192" fill="#F2C46D" font-size="15" text-anchor="middle" font-weight="400">The one-hour cache expires</text>
<text x="48" y="221" fill="#8A939E" font-size="15" text-anchor="start" font-weight="600">Without idle compaction</text>
<path d="M48 235H408" fill="none" stroke="#8A939E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M408 235H548" fill="none" stroke="#8A939E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
<path d="M48 231V239M408 231V239M548 231L552 235L548 239" fill="none" stroke="#8A939E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="526" cy="235" r="4" fill="#F6A9A2"/>
<text x="552" y="260" fill="#F6A9A2" font-size="15" text-anchor="end" font-weight="400">The whole conversation is processed again</text>
<path d="M48 276H552" fill="none" stroke="#FFFFFF1A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="300" fill="#8A939E" font-size="14" text-anchor="start" font-weight="400">Applies to conversations over 200K tokens on the one-hour cache</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 278" role="img" aria-label="Codex 在週二全體重置時，已用百分比歸零，下一次補滿的時間從原本的週五改成下週二。" font-family="Noto Sans TC, -apple-system, sans-serif">
<title>Codex 在週二全體重置時，已用百分比歸零，下一次補滿的時間從原本的週五改成下週二。</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DDE6E1"/>
    <stop offset="1" stop-color="#CEDBD4"/>
  </linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141414" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="600" height="278" rx="16" fill="url(#bg)"/>
<g filter="url(#sh)">
  <rect x="26" y="42" width="548" height="210" rx="10" fill="#161616" stroke="#2C2C2C" stroke-width="1"/>
</g>
<text x="264" y="80" font-size="13.5" font-weight="500" fill="#8A939E" text-anchor="middle" data-role="label">原本的 resets_at</text>
<text x="264" y="100" font-size="13.5" font-weight="500" fill="#8A939E" text-anchor="middle" text-decoration="line-through" data-role="label">週五</text>
<text x="472" y="80" font-size="13.5" font-weight="600" fill="#E0E0E0" text-anchor="middle" data-role="label">新的 resets_at</text>
<text x="472" y="100" font-size="13.5" font-weight="600" fill="#E0E0E0" text-anchor="middle" data-role="label">下週二</text>

<path d="M 56 122 H 264 V 142" fill="none" stroke="#8C8C8C" stroke-width="1.25" stroke-dasharray="4 4"/>
<line x1="472" y1="108" x2="472" y2="142" stroke="#F2C46D" stroke-width="1.25"/>

<line x1="56" y1="148" x2="524" y2="148" stroke="#8A939E" stroke-width="1.5"/>
<line x1="108" y1="148" x2="472" y2="148" stroke="#F2C46D" stroke-width="3"/>
<path d="M 56 143 V 153 M 264 143 V 153 M 524 143 V 153" fill="none" stroke="#8A939E" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="472" cy="148" r="4.5" fill="#F2C46D"/>
<circle cx="108" cy="148" r="5" fill="#F2C46D"/>

<text x="56" y="172" font-size="13" font-weight="400" fill="#8A939E" text-anchor="middle" data-role="label">週一</text>
<text x="108" y="172" font-size="13" font-weight="500" fill="#E0E0E0" text-anchor="middle" data-role="label">週二</text>
<text x="264" y="172" font-size="13" font-weight="400" fill="#8A939E" text-anchor="middle" data-role="label">週五</text>
<text x="524" y="172" font-size="13" font-weight="400" fill="#8A939E" text-anchor="middle" data-role="label">下週三</text>

<path d="M 108 180 V 211 H 122" fill="none" stroke="#F2C46D" stroke-width="1.25"/>
<text x="130" y="207" font-size="13.5" font-weight="600" fill="#E0E0E0" data-role="label">全體重置</text>
<text x="130" y="226" font-size="13" font-weight="400" fill="#8A939E" data-role="label">已用百分比歸零</text>
<rect x="218.39" y="16" width="163.22" height="16" fill="#DCE5E0" data-role="watermark-mask"/>
<text x="300" y="28" font-size="12" font-family="-apple-system, Noto Sans TC, sans-serif" fill="#8A8A8A" text-anchor="middle" data-role="watermark">aqua5230.github.io/usage</text>
</svg>

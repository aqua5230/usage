<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="A Codex global reset on Tuesday drops the used percentage to zero and moves the next refill from Friday to the following Tuesday." font-family="Noto Sans TC, -apple-system, sans-serif">
<title>A Codex global reset on Tuesday drops the used percentage to zero and moves the next refill from Friday to the following Tuesday.</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9CFC0"/><stop offset=".55" stop-color="#6E9E8E"/><stop offset="1" stop-color="#3F6E61"/></linearGradient><radialGradient id="g1" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#E8D9B5" stop-opacity=".55"/><stop offset="1" stop-color="#E8D9B5" stop-opacity="0"/></radialGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2A22" flood-opacity=".38"/></filter></defs>
<rect width="600" height="240" rx="16" fill="url(#bg)"/><rect width="600" height="240" rx="16" fill="url(#g1)"/>
<g filter="url(#sh)"><rect x="20" y="20" width="560" height="200" rx="14" fill="#1E2228" stroke="#FFFFFF1A"/></g>
<g font-size="15" font-weight="600">
<text x="227" y="56" fill="#8A939E" text-anchor="middle">Original resets_at</text>
<text x="227" y="77" fill="#8A939E" text-anchor="middle" text-decoration="line-through">Friday</text>
<text x="496" y="56" fill="#9FD3BD" text-anchor="middle">New resets_at</text>
<text x="496" y="77" fill="#9FD3BD" text-anchor="middle">Next Tuesday</text>
</g>
<path d="M48 99H227V118" fill="none" stroke="#8A939E" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<path d="M496 86V117" stroke="#7FB59F" stroke-width="1.6"/>
<path d="M48 123H541" stroke="#8A939E" stroke-width="2" stroke-linecap="round"/>
<path d="M93 123H496" stroke="#9FD3BD" stroke-width="5" stroke-linecap="round"/>
<g fill="none" stroke="#8A939E" stroke-width="1.6" stroke-linecap="round">
<path d="M48 119V127M227 119V127M541 119V127"/>
</g>
<circle cx="496" cy="123" r="5" fill="#9FD3BD"/>
<circle cx="93" cy="123" r="6" fill="#F28B82"/>
<g fill="#8A939E" font-size="14">
<text x="48" y="147" text-anchor="middle">Mon</text>
<text x="93" y="147" text-anchor="middle">Tue</text>
<text x="227" y="147" text-anchor="middle">Fri</text>
<text x="555" y="147" text-anchor="end">Next Wed</text>
</g>
<text x="38" y="183" font-size="15" font-weight="600" fill="#F6A9A2">Global reset</text>
<text x="38" y="204" font-size="15" fill="#F6A9A2">Used percentage drops to zero</text>
</svg>

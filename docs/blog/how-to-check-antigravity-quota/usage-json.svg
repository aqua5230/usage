<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 396" role="img" aria-label="Antigravity 的 JSON 輸出用 groups 列出兩個額度池，並顯示 Gemini 每週額度的週期、剩餘比例和補滿時間。" font-family="Noto Sans TC, -apple-system, sans-serif">
<title>Antigravity 的 JSON 輸出用 groups 列出兩個額度池，並顯示 Gemini 每週額度的週期、剩餘比例和補滿時間。</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DDE6E1"/>
    <stop offset="1" stop-color="#CEDBD4"/>
  </linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141414" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="776" height="396" rx="16" fill="url(#bg)"/>
<g filter="url(#sh)">
  <rect x="26" y="26" width="474" height="344" rx="10" fill="#161616" stroke="#2C2C2C" stroke-width="1"/>
</g>
<circle cx="43" cy="42" r="5" fill="#FF5F57"/>
<circle cx="59" cy="42" r="5" fill="#FEBC2E"/>
<circle cx="75" cy="42" r="5" fill="#28C840"/>
<text x="44" y="80" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#8A939E">you@MacBook ~ % </tspan><tspan fill="#E0E0E0">agy -p /usage --output-format json</tspan></text>
<text x="44" y="110" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">&quot;command&quot;: {</text>
<text x="60.8" y="133" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">&quot;data&quot;: {</text>
<text x="77.6" y="156" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">&quot;groups&quot;: [</text>
<text x="94.4" y="181" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">{ &quot;name&quot;: &quot;Gemini Models&quot;,</text>
<text x="111.2" y="204" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">&quot;buckets&quot;: [</text>
<text x="128" y="227" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">{ &quot;window&quot;: &quot;weekly&quot;,</text>
<text x="144.8" y="252" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">&quot;remaining_fraction&quot;: 0.958730936050415,</text>
<text x="144.8" y="277" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">&quot;reset_time&quot;: &quot;2026-11-30T22:13:16Z&quot; },</text>
<text x="128" y="302" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">{ &quot;window&quot;: &quot;5h&quot;, … } ] },</text>
<text x="94.4" y="325" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">{ &quot;name&quot;: &quot;Claude and GPT models&quot;, … }</text>
<text x="77.6" y="348" font-size="14" font-family="Menlo, Consolas, monospace" fill="#E0E0E0" xml:space="preserve" data-role="terminal">] } }</text>
<path d="M 86.02 159.5 V 162.5 H 136.62 V 159.5" fill="none" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="178.3" y1="152" x2="500" y2="152" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="500" y1="152" x2="540" y2="152" stroke="#666666" stroke-width="1.25"/>
<text x="548" y="146" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace" fill="#1F2A26" text-anchor="start" data-role="label">groups</text>
<text x="548" y="166" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">兩個額度池</text>

<path d="M 153.28 230.5 V 233.5 H 203.86 V 230.5" fill="none" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="313" y1="223" x2="500" y2="223" stroke="#8C8C8C" stroke-width="1.25"/>
<path d="M 500 223 H 514 V 210 H 540" fill="none" stroke="#666666" stroke-width="1.25"/>
<text x="548" y="204" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace" fill="#1F2A26" text-anchor="start" data-role="label">window</text>
<text x="548" y="224" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">weekly＝每週、5h＝5 小時</text>

<path d="M 153.22 255.5 V 258.5 H 304.96 V 255.5" fill="none" stroke="#F2C46D" stroke-width="1.25"/>
<line x1="489.9" y1="248" x2="500" y2="248" stroke="#F2C46D" stroke-width="1.25"/>
<path d="M 500 248 H 528 V 268 H 540" fill="none" stroke="#666666" stroke-width="1.25"/>
<text x="548" y="262" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace" fill="#1F2A26" text-anchor="start" data-role="label">remaining_fraction</text>
<text x="548" y="282" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">這個範例約剩 96%</text>

<path d="M 153.22 280.5 V 283.5 H 237.52 V 280.5" fill="none" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="481.5" y1="273" x2="500" y2="273" stroke="#8C8C8C" stroke-width="1.25"/>
<path d="M 500 273 H 516 V 326 H 540" fill="none" stroke="#666666" stroke-width="1.25"/>
<text x="548" y="320" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace" fill="#1F2A26" text-anchor="start" data-role="label">reset_time</text>
<text x="548" y="340" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">補滿時間（UTC）</text>
<rect x="181.39" y="34" width="163.22" height="16" fill="#161616" data-role="watermark-mask"/>
<text x="263.0" y="46" font-size="12" font-family="-apple-system, Noto Sans TC, sans-serif" fill="#8A8A8A" text-anchor="middle" data-role="watermark">aqua5230.github.io/usage</text>
</svg>

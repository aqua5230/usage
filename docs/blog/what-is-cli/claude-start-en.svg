<text x="48" y="190" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#F2C46D">❯</tspan><tspan fill="#E0E0E0"> Make a web page: a pond at night with a</tspan></text>
<text x="48" y="213" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#E0E0E0">  small fish swimming. When the fish swims</tspan></text>
<text x="48" y="236" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#E0E0E0">  through the moon&#x27;s reflection, the</tspan></text>
<text x="48" y="259" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#E0E0E0">  reflection breaks up and sways; clicking</tspan></text>
<text x="48" y="282" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#E0E0E0">  the water sends out ripples. Don&#x27;t use</tspan></text>
<text x="48" y="305" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#E0E0E0">  any images; draw everything with code</tspan></text>
<text x="48" y="328" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#E0E0E0">  and save it as pond.html.</tspan></text>

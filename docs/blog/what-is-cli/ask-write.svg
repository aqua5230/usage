<text x="40" y="201" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#8A939E">  3 &lt;head&gt;</tspan></text>
<text x="40" y="224" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#8A939E">  ⋮ （後面還有 473 行）</tspan></text>

<text x="40" y="86" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#28C840">⏺ </tspan><tspan fill="#F2F2F2">Write(pond.html)</tspan></text>
<text x="40" y="109" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2"> Create file</tspan></text>

<text x="40" y="270" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2"> Do you want to create pond.html?</tspan></text>
<text x="40" y="293" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2C46D"> ❯</tspan><tspan fill="#F2F2F2"> 1. Yes</tspan></text>

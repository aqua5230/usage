<text x="300.0" y="43" font-size="13" fill="#9AA0A6" text-anchor="middle">池塘 — claude</text>
<line x1="20" y1="56" x2="580" y2="56" stroke="#FFFFFF14"/>
<text x="40" y="86" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#E8A87C">Claude Code v2.1.277</tspan></text>
<text x="40" y="109" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#8A939E">Opus 5 · Claude Pro</tspan></text>
<text x="40" y="132" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#8A939E">~/池塘</tspan></text>

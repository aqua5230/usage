<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 318" role="img" aria-label="Claude Code 剛打開的畫面：第一行 Claude Code v2.1.277；第二行 Opus 5 · Claude Pro，標註「AI 模型和你訂的方案」；第三行 ~/池塘，標註「目前所在的資料夾」；最後是 ❯ 後面打的那句話，標註「在 ❯ 後面打你想做的事，用中文就可以」" font-family="Noto Sans TC, -apple-system, sans-serif">

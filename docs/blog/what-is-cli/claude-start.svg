<text x="40" y="201" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2">  游過月亮的倒影時倒影會晃開；點一下水面會</tspan></text>
<text x="40" y="224" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2">  起漣漪。不要用任何圖片，全部用程式碼畫，</tspan></text>
<text x="40" y="247" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2">  存成 pond.html。</tspan></text>

<line x1="371.95" y1="262" x2="490" y2="262" stroke="#F2C46D" stroke-width="1.25"/>
<line x1="490" y1="262" x2="508" y2="262" stroke="#666666" stroke-width="1.25"/>
<text x="516" y="266" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">asks you first</text>
<line x1="140.72" y1="285" x2="490" y2="285" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="490" y1="285" x2="508" y2="285" stroke="#666666" stroke-width="1.25"/>
<text x="516" y="289" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">yes, this time</text>
<path d="M 446.03 300 H 451.03 V 385 H 446.03" fill="none" stroke="#F6A9A2" stroke-width="1.25"/>
<line x1="451.03" y1="342.5" x2="490" y2="342.5" stroke="#F6A9A2" stroke-width="1.25"/>
<line x1="490" y1="342.5" x2="508" y2="342.5" stroke="#666666" stroke-width="1.25"/>
<text x="516" y="337.5" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">yes, and stop asking</text>
<text x="516" y="357.5" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">even for most deletes</text>
<line x1="131.08" y1="400" x2="490" y2="400" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="490" y1="400" x2="508" y2="400" stroke="#666666" stroke-width="1.25"/>
<text x="516" y="404" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">no</text>
<rect x="176.39" y="34" width="163.22" height="16" fill="#161616" data-role="watermark-mask"/>
<text x="258" y="46" font-size="12" font-family="-apple-system, Noto Sans TC, sans-serif" fill="#8A8A8A" text-anchor="middle" data-role="watermark">aqua5230.github.io/usage</text>

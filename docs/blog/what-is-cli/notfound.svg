<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332" role="img" aria-label="終端機畫面。第一行是 you@MacBook 池塘 %，後面接使用者打的「幫我做一個池塘網頁」，圖上分別標出使用者名稱、電腦名稱、所在資料夾和你打的字。第二行是終端機的回覆：zsh: command not found: 幫我做一個池塘網頁" font-family="Noto Sans TC, -apple-system, sans-serif">

<text x="40" y="109" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2">  圖片或網址。</tspan></text>
<text x="40" y="155" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2"> Bash command</tspan></text>
<line x1="167.39" y1="150" x2="192" y2="150" stroke="#D7DCE1" stroke-width="1.3" stroke-dasharray="2 4" stroke-linecap="round"/>
<text x="200" y="155" font-size="14" fill="#D7DCE1">要執行指令，下面 4 步用 &amp;&amp; 接起來</text>
<text x="40" y="178" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#9FD3BD">cd &quot;/Users/you/池塘&quot;</tspan><tspan fill="#8A939E"> &amp;&amp; </tspan><tspan fill="#8AB4F8">ls -la</tspan><tspan fill="#8A939E"> &amp;&amp; </tspan><tspan fill="#F2C46D">wc -l</tspan></text>
<text x="40" y="201" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2C46D">pond.html</tspan><tspan fill="#8A939E"> &amp;&amp; </tspan><tspan fill="#C9A2F7">grep -nEi &#x27;https?://|src=|</tspan></text>
<text x="40" y="224" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#C9A2F7">href=|url\(|&lt;img|&lt;svg|data:|\.png|…&#x27;</tspan></text>
<text x="40" y="247" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#C9A2F7">pond.html</tspan></text>
<text x="40" y="270" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#8A939E">List files and search pond.html for</tspan></text>

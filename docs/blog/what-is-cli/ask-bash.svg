<text x="410" y="270" font-size="14" fill="#D7DCE1">它自己寫的摘要</text>
<text x="40" y="293" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#8A939E">images or URLs</tspan></text>
<text x="40" y="339" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2"> Do you want to proceed?</tspan></text>
<text x="40" y="362" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2C46D"> ❯</tspan><tspan fill="#F2F2F2"> 1. Yes</tspan></text>
<text x="40" y="385" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2">   2. Yes, and don’t ask again for: cd *</tspan></text>

<text x="420" y="408" font-size="13" fill="#F6A9A2">改成自動模式</text>
<text x="40" y="431" font-size="15" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#F2F2F2">   4. No</tspan></text>
<rect x="20" y="494" width="276" height="28" rx="14" fill="#1E2228" fill-opacity=".88"/><text x="34" y="513" font-size="14" fill="#9FD3BD">① <tspan font-family="Menlo, Consolas, monospace">cd</tspan><tspan fill="#E6E6E6">　切到池塘資料夾</tspan></text>
<rect x="304" y="494" width="276" height="28" rx="14" fill="#1E2228" fill-opacity=".88"/><text x="318" y="513" font-size="14" fill="#8AB4F8">② <tspan font-family="Menlo, Consolas, monospace">ls -la</tspan><tspan fill="#E6E6E6">　列出資料夾裡的檔案</tspan></text>
<rect x="20" y="528" width="276" height="28" rx="14" fill="#1E2228" fill-opacity=".88"/><text x="34" y="547" font-size="14" fill="#F2C46D">③ <tspan font-family="Menlo, Consolas, monospace">wc -l</tspan><tspan fill="#E6E6E6">　數 pond.html 有幾行</tspan></text>
<rect x="304" y="528" width="276" height="28" rx="14" fill="#1E2228" fill-opacity=".88"/><text x="318" y="547" font-size="14" fill="#C9A2F7">④ <tspan font-family="Menlo, Consolas, monospace">grep</tspan><tspan fill="#E6E6E6">　搜尋像圖片或網址的寫法</tspan></text>

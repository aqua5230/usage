<title>Claude Code 要執行指令前問你的畫面。上面是我打的「幫我查 pond.html 裡面有沒有用到任何圖片或網址」，Bash command 標註「要執行指令，下面 4 步用 &amp;&amp; 接起來」。指令用四種顏色分成四步：① cd 切到池塘資料夾，② ls -la 列出資料夾裡的檔案，③ wc -l 數 pond.html 有幾行，④ grep 搜尋像圖片或網址的寫法。List files and search pond.html for images or URLs 標註「它自己寫的摘要」。選項 2 Yes, and don’t ask again for: cd * 標註「這個專案以後 cd 都不問」，選項 3 Yes, and switch to auto mode 標註「改成自動模式」</title>

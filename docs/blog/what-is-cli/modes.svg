<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-label="三種設定由上而下比較：Manual 改東西前大多先問；接受編輯時，資料夾裡建檔、改檔和一般刪檔都不問；自動模式只在看起來危險時才擋下來" font-family="Noto Sans TC, -apple-system, sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Two ways to make a folder on the desktop: (1) right-click the desktop and choose New Folder, (2) move Terminal to the desktop and type mkdir practice. Both arrows point to the same practice folder in the top-right corner of the desktop." font-family="Noto Sans TC, -apple-system, sans-serif">
<title>Two ways to make a folder on the desktop: (1) right-click the desktop and choose New Folder, (2) move Terminal to the desktop and type mkdir practice. Both arrows point to the same practice folder in the top-right corner of the desktop.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DDE6E1"/>
    <stop offset="1" stop-color="#CEDBD4"/>
  </linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141414" flood-opacity="0.20"/>
  </filter>
  <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#666666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <clipPath id="clip-desk"><rect width="600" height="420" rx="16"/></clipPath>
</defs>
<rect width="600" height="420" rx="16" fill="url(#bg)"/>

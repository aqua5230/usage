<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 793 324" role="img" aria-label="Claude Code 的額度用完、官方伺服器過載與沒有登入畫面" font-family="Noto Sans TC, -apple-system, sans-serif">

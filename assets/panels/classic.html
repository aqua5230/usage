<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --muse: #0082FB;
      color-scheme: dark light;
      --bg: #080d12;
      --panel: rgba(25, 33, 42, 0.86);
      --panel-border: rgba(255, 255, 255, 0.15);
      --line: rgba(255, 255, 255, 0.13);
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.58);
      --track: rgba(255, 255, 255, 0.07);
      --tick: rgba(255, 255, 255, 0.34);
      --button: rgba(255, 255, 255, 0.08);
      --button-border: rgba(255, 255, 255, 0.18);
      --button-hover: rgba(255, 255, 255, 0.13);
      --claude: #f49164;
      --codex: #58d6e6;
      --agy: #6b9aff;
      --grok: #e9e9ee;
      --projects: #30d158;
      --warn: #ffc439;
      --danger: #ff453a;
      --radius: 8px;
      /* Numeric readouts use the system mono face; no webfont, panel stays offline. */
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --muse: #0064E0;
        --bg: #eef2f7;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-border: rgba(20, 28, 38, 0.14);
        --line: rgba(20, 28, 38, 0.13);
        --text: rgba(12, 18, 26, 0.9);
        --muted: rgba(12, 18, 26, 0.55);
        --track: rgba(12, 18, 26, 0.08);
        --tick: rgba(12, 18, 26, 0.32);
        --button: rgba(12, 18, 26, 0.05);
        --button-border: rgba(12, 18, 26, 0.14);
        --button-hover: rgba(12, 18, 26, 0.10);
        --agy: #3f74e8;
        --grok: #1c1c1f;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0;
      overscroll-behavior: none;
    }

    body {
      padding: 12px;
      background:
        linear-gradient(180deg, #111b25 0%, #0b1118 44%, var(--bg) 100%);
    }

    @media (prefers-color-scheme: light) {
      body {
        background:
          linear-gradient(180deg, #f8fafc 0%, #eef3f8 48%, var(--bg) 100%);
      }
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .card {
      padding: 13px 15px 12px;
    }

    .card[data-card="codex"],
    .card[data-card="agy"] {
      overflow: visible;
      z-index: 2;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 6px auto 6px 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 22%, transparent));
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    /* Chasing halo. No box-shadow anywhere: the effect is a conic gradient
       clipped to the card's own border ring, so it cannot bleed past the box
       even on the codex/agy cards, which are overflow:visible for tooltips. */
    @property --halo-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    .card[data-critical="true"]::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      pointer-events: none;
      background: conic-gradient(from var(--halo-angle),
          transparent 0deg 232deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 286deg,
          var(--danger) 334deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 352deg,
          transparent 360deg);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      animation: halo-spin 2.6s linear infinite;
    }

    @keyframes halo-spin {
      to {
        --halo-angle: 360deg;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      height: 32px;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 6px 14px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .card[data-card="agy"] .brand-icon svg,
    .card[data-card="grok"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="agy"] .brand-icon,
    .card[data-card="grok"] .brand-icon {
      color: var(--accent);
    }

    .brand h1 {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 21px;
      line-height: 1;
      font-weight: 800;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .card[data-card="agy"] .brand h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="agy"] .codex-stale {
      margin-left: auto;
    }

    .card[data-card="codex"] .brand.usage-switch-host h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="codex"] .brand.usage-switch-host .codex-stale {
      flex: 1 1 0;
      overflow: hidden;
    }

    .card[data-card="codex"] .brand.usage-switch-host [data-codex-stale-age] {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(10, 14, 20, 0.96);
      color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .card[data-card="projects"] .brand {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      height: auto;
      row-gap: 10px;
      margin-bottom: 10px;
    }

    .card[data-card="projects"] .brand-icon {
      grid-column: 1;
    }

    .card[data-card="projects"] h1 {
      grid-column: 2;
    }

    .project-actions {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .project-actions .switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      height: 30px;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1;
    }

    /* Same lead / quiet pair as Refresh / Quit in the footer. */
    .project-actions [data-action="toggle-project-range"] {
      border-color: rgba(48, 209, 88, 0.36);
      background: linear-gradient(180deg, rgba(48, 209, 88, 0.24), rgba(40, 180, 75, 0.14));
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .project-actions [data-action="toggle-project-range"]:hover {
      border-color: rgba(48, 209, 88, 0.55);
      background: linear-gradient(180deg, rgba(48, 209, 88, 0.34), rgba(40, 180, 75, 0.22));
    }

    .project-actions .switch:not([data-action="toggle-project-range"]) {
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
    }

    .project-actions .switch:not([data-action="toggle-project-range"]):hover {
      background: var(--button);
      color: var(--text);
    }

    .switch {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: var(--button);
      color: var(--text);
      font: 600 12px/26px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: nowrap;
    }

    /* Settings sits in a card header, so it is header-sized and quieter than the actions. */
    .brand .switch[data-action="switch"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: color-mix(in srgb, var(--button) 65%, transparent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .brand .switch[data-action="switch"]:hover {
      background: var(--button-hover);
      border-color: var(--button-border);
      color: var(--text);
    }

    .row + .row {
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 8px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
    }

    .row-title {
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .percent {
      font-size: 14px;
      line-height: 18px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .track {
      position: relative;
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--track);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.18);
    }

    /* Tick marks the 80% danger threshold from colorFor(); drawn above the fill
       so a bar past it still shows where the line was crossed. */
    .track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 calc(80% - 1px);
      width: 1.5px;
      background: var(--tick);
      pointer-events: none;
    }

    .fill {
      width: 0%;
      height: 100%;
      min-width: 4px;
      border-radius: inherit;
      background: var(--fill-color, var(--accent));
      background-image: linear-gradient(180deg, color-mix(in srgb, var(--fill-color, var(--accent)) 100%, white 12%), var(--fill-color, var(--accent)));
      box-shadow: 0 0 12px color-mix(in srgb, var(--fill-color, var(--accent)) 30%, transparent);
      transition: width 140ms ease-out, background-color 140ms ease-out;
    }

    .reset {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 13px;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .reset[data-warning="true"] {
      color: #ff3b30;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: var(--muted);
    }

    .row[data-available="false"] .fill {
      width: 0%;
    }

    /* min-width keeps a sub-1% bar visible; a genuine 0% must stay empty. */
    .fill[style*="width: 0%"] {
      min-width: 0;
    }

    .proj-row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 5px 8px;
      padding: 7px 0 8px;
      font-size: 13.5px;
      line-height: 20px;
    }

    .proj-row + .proj-row {
      border-top: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    }

    .proj-row:first-child {
      font-weight: 600;
    }

    .proj-rank {
      width: 16px;
      height: 16px;
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--muted) 26%, transparent);
      color: var(--text);
      font-weight: 700;
      font-size: 10px;
    }

    .proj-row:first-child .proj-rank {
      background: color-mix(in srgb, var(--projects) 32%, transparent);
      color: white;
    }

    .proj-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-row:first-child .proj-name {
      color: var(--text);
    }

    .proj-tokens {
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
      min-width: 92px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-cost {
      min-width: 52px;
      color: color-mix(in srgb, var(--muted) 70%, transparent);
      font-size: 12px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-bar {
      grid-column: 1 / -1;
      height: 3px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
      align-self: end;
    }

    .proj-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 72%, transparent), var(--accent));
      opacity: 0.7;
    }

    .proj-row:first-child .proj-bar {
      height: 3.5px;
    }

    .proj-row:first-child .proj-bar-fill {
      opacity: 1;
    }

    .footer {
      min-height: 144px;
      padding: 12px 15px 11px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta > div {
      padding: 2px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--button) 40%, transparent);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(220, 80, 60, 0.16);
      border: 1px solid rgba(220, 80, 60, 0.4);
      color: #ff9b85;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .today {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 15px;
      line-height: 20px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }


    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      height: auto;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: normal;
      min-width: 0;
      line-height: 1.3;
      flex: 1;
    }

    .action,
    .switch {
      transition:
        filter 80ms ease-out,
        transform 80ms ease-out,
        background 160ms ease-out,
        background-color 160ms ease-out,
        border-color 160ms ease-out,
        color 160ms ease-out;
    }

    .action:focus-visible,
    .switch:focus-visible {
      outline: 2px solid var(--accent, #58d6e6);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {

      .action,
      .switch,
      .fill {
        transition: none;
      }

      .card[data-critical="true"]::after {
        animation: none;
        background: color-mix(in srgb, var(--danger) 72%, transparent);
      }
    }

    .action:active,
    .switch:active {
      filter: brightness(0.82);
      transform: scale(0.98);
    }

    .action.primary {
      border-color: rgba(88, 214, 230, 0.30);
      background: linear-gradient(180deg, rgba(88, 214, 230, 0.26), rgba(24, 172, 216, 0.18));
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .action.primary:hover {
      border-color: rgba(88, 214, 230, 0.55);
      background: linear-gradient(180deg, #34d7f2, #18acd8);
      color: white;
    }

    .action:not(.primary):hover {
      background: var(--button);
      color: var(--text);
    }

    .action[data-action="install"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }

    .switch:hover {
      background: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.28);
    }

    @media (prefers-color-scheme: light) {
      .switch:hover {
        background: rgba(12, 18, 26, 0.10);
        border-color: rgba(12, 18, 26, 0.22);
      }

      .action.primary {
        border-color: rgba(24, 172, 216, 0.45);
        background: linear-gradient(180deg, rgba(88, 214, 230, 0.30), rgba(24, 172, 216, 0.20));
      }

      .proj-row:first-child .proj-rank {
        background: color-mix(in srgb, var(--projects) 35%, transparent);
        color: #0b5120;
      }

      /* A white app icon needs a dark outline on a white card. */
      .brand img {
        box-shadow:
          0 0 0 1px var(--panel-border),
          0 4px 10px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      .track {
        box-shadow: inset 0 1px 1px rgba(12, 18, 26, 0.06);
      }
    }

    .attribution {
      font-size: 10px;
      color: rgba(255,255,255,0.18);
      text-align: center;
      margin-top: 6px;
    }

    .attribution a {
      color: inherit;
      text-decoration: none;
    }

    @media (prefers-color-scheme: light) {
      .attribution {
        color: rgba(12,18,26,0.30);
      }
    }




    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: 0.72; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24); transform: translateY(-2px); }
    .is-card-dragging, .is-card-dragging * { user-select: none; }

    .card[data-card="agy"] .agy-group-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      height: 20px;
      border: 1px solid color-mix(in srgb, var(--agy) 38%, transparent);
      border-radius: 999px;
      padding: 0 8px;
      background: color-mix(in srgb, var(--agy) 12%, transparent);
      color: var(--agy);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    /* display above would otherwise override the hidden attribute. */
    .card[data-card="agy"] .agy-group-toggle[hidden] {
      display: none;
    }
    .card[data-card="agy"] .brand h1 {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card[data-card="agy"] .agy-group-toggle:hover,
    .card[data-card="agy"] .agy-group-toggle:focus-visible {
      background: color-mix(in srgb, var(--agy) 25%, transparent);
    }

    .card[data-card="muse"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="muse"] .brand-icon {
      color: var(--accent);
    }

    .hide-muse [data-card="muse"] { display: none; }

    /* Compact layout keeps this theme's header geometry and decoration. */
    html.compact-cards body .card[data-card="projects"] { padding-inline: 13px; }
    html.compact-cards body .card[data-card="projects"] .brand {
      grid-template-columns: 24px minmax(0, 1fr);
      column-gap: 8px;
    }
    html.compact-cards body .card[data-card] .brand-icon svg { width: 15px; height: 15px; }
    /* The folder artwork carries its own padding inside the viewBox. */
    html.compact-cards body .card[data-card="projects"] .brand-icon svg { width: 20px; height: 20px; }
    html.compact-cards body .footer { padding-inline: 13px; }
    html.compact-cards body .card:is([data-card="claude"], [data-card="codex"], [data-card="agy"], [data-card="grok"], [data-card="muse"]):not([data-compact-single="true"]) {
      column-gap: 0;
    }
    html.compact-cards body .card:is([data-card="claude"], [data-card="codex"], [data-card="agy"], [data-card="grok"], [data-card="muse"]):not([data-compact-single="true"]) > .row[data-row="session"] {
      padding-right: 12px;
    }
    html.compact-cards body .card:is([data-card="claude"], [data-card="codex"], [data-card="agy"], [data-card="grok"], [data-card="muse"]):not([data-compact-single="true"]) > .row[data-row="weekly"] {
      border-left: 1px solid var(--line);
      padding-left: 12px;
    }
    html.compact-cards body .card:is([data-card="claude"], [data-card="codex"], [data-card="agy"], [data-card="grok"], [data-card="muse"]) .row-title {
      font-size: 11.5px;
    }
    html.compact-cards body .card:is([data-card="claude"], [data-card="codex"], [data-card="agy"], [data-card="grok"], [data-card="muse"]) .percent {
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" data-card="claude" style="--accent: var(--claude)">
      <header class="brand">
        <img src="{{CLAUDE_ICON}}" alt="">
        <h1 data-i18n="claude_name">Claude Code</h1>
        <button class="switch" data-action="switch" data-i18n="settings_button">⚙ Settings</button>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="codex" style="--accent: var(--codex)">
      <header class="brand">
        <img src="{{CODEX_ICON}}" alt="">
        <h1 data-i18n="codex_name">Codex</h1>
        <div class="codex-stale" data-codex-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-codex-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="agy" style="--accent: var(--agy)">
      <header class="brand">
        <div class="brand-icon"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
        <h1 data-i18n="agy_name">Antigravity</h1>
        <button type="button" class="agy-group-toggle" data-action="set_agy_quota_group" title="" aria-label=""></button>
        <div class="codex-stale" data-agy-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-agy-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-agy-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="grok" style="--accent: var(--grok)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></div>
        <h1 data-i18n="grok_name">Grok</h1>
        <div class="codex-stale" data-grok-stale hidden>
          <span aria-hidden="true">⚠</span><span data-grok-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-grok-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="muse" style="--accent: var(--muse)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M24.6257 16.1214C28.2365 16.1214 30.8187 18.9408 30.8187 23.3643C30.8185 27.7868 30.1055 31.7765 28.9225 40.2466C28.0743 46.1813 26.62 55.2418 26.0132 59.0088C27.1782 56.7815 29.9074 51.5757 30.3914 50.5982C36.1081 39.061 42.0657 28.7544 43.7826 26.0254C46.0594 22.382 48.062 20.9229 51.1597 20.9229C52.7685 20.923 54.6826 21.7357 55.6315 22.819C56.9178 24.2895 57.1859 26.6602 57.1411 29.244C57.0738 33.2073 56.5599 39.5264 55.8553 46.5698C55.5416 49.7057 54.9365 56.1066 54.5288 60.4004C58.1883 53.8532 64.9609 41.8109 67.6921 37.6058C70.0727 33.9402 72.466 31.5797 75.6836 31.5796C78.4595 31.5796 81.8809 33.5416 81.6772 38.7573C81.3774 46.4556 80.2673 63.2232 79.7607 70.7479C83.1662 65.7913 87.6377 58.4543 89.3148 55.6966C91.0104 52.908 92.75 50.6542 95.3898 50.5778C98.0987 50.4995 99.913 52.341 99.9959 55.1839C100.078 58.0277 98.3835 61.2256 96.1344 64.856C93.6937 68.7957 90.9621 73.0123 87.6383 76.9491C84.3148 80.8856 81.2604 83.8782 76.5991 83.8786C72.4243 83.8786 69.4869 81.1043 69.283 76.0254C69.1768 73.364 69.6804 67.6405 70.0602 63.1673C70.5 57.9875 71.0315 52.9861 71.403 49.6786C67.7337 56.3979 60.0101 70.4676 56.5348 75.9603C53.1343 81.3339 51.4774 83.2269 47.8882 83.2275C44.2977 83.2275 42.7226 80.6416 42.6717 76.7497C42.6142 72.5285 45.7852 47.1821 46.8587 38.737C45.1183 42.4616 40.839 51.6056 38.1551 57.0435C35.5587 62.3055 31.204 71.3978 28.0436 76.6357C25.7668 80.4094 23.2092 83.2273 19.4173 83.2275C15.6252 83.2275 13.4847 80.6784 13.4847 76.5788C13.4847 72.4794 14.6716 65.6492 15.9465 57.1777C16.5839 53.0781 17.3108 48.6133 18.1315 43.8761C18.7324 40.448 19.7764 34.4169 20.4183 30.7129C17.502 35.2539 12.2536 43.4278 10.6567 45.8903C8.88113 48.6291 7.28747 50.626 4.64681 50.6266C1.7329 50.6266 0.000532901 48.3522 0 45.7113C0 43.0703 1.34323 41.0344 3.52376 37.4512C6.32403 32.8465 11.3578 26.57 14.1154 23.2747C17.3656 19.3912 20.6139 16.1219 24.6257 16.1214Z"/></svg></div>
        <h1 data-i18n="muse_name">Muse</h1>
        <div class="codex-stale" data-muse-stale hidden>
          <span aria-hidden="true">⚠</span><span data-muse-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-muse-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="projects" style="--accent: var(--projects)">
      <header class="brand">
        <div class="brand-icon"><svg width="30" height="30" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.75 8.25C4.75 7.14543 5.64543 6.25 6.75 6.25H10.5729C10.9737 6.25 11.3598 6.40073 11.6548 6.67228L12.9952 7.90522C13.2902 8.17677 13.6763 8.3275 14.0771 8.3275H19.25C20.3546 8.3275 21.25 9.22293 21.25 10.3275V17.75C21.25 18.8546 20.3546 19.75 19.25 19.75H6.75C5.64543 19.75 4.75 18.8546 4.75 17.75V8.25Z" stroke="var(--projects)" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.25 11.25H18.75" stroke="var(--projects)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/><path d="M8.75 14.15C8.75 13.4596 9.30964 12.9 10 12.9H10.3C10.9904 12.9 11.55 13.4596 11.55 14.15V16.5H8.75V14.15Z" fill="var(--projects)" opacity="0.18" stroke="var(--projects)" stroke-width="1.4"/><path d="M12.6 13.25C12.6 12.6425 13.0925 12.15 13.7 12.15H14.05C14.6575 12.15 15.15 12.6425 15.15 13.25V16.5H12.6V13.25Z" fill="var(--projects)" opacity="0.3" stroke="var(--projects)" stroke-width="1.4"/><path d="M16.2 14.85C16.2 14.1873 16.7373 13.65 17.4 13.65H17.75C18.4127 13.65 18.95 14.1873 18.95 14.85V16.5H16.2V14.85Z" fill="var(--projects)" opacity="0.48" stroke="var(--projects)" stroke-width="1.4"/></svg></div>
        <h1 data-i18n="projects_title">Project Usage</h1>
        <div class="codex-stale" data-history-error hidden>
          <span aria-hidden="true">⚠</span>
          <span data-history-error-text></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-history-error-tooltip></span>
          </span>
        </div>
        <div class="project-actions">
          <button class="switch" data-action="toggle-project-range">Today</button>
          <button class="switch" data-action="analyze" data-i18n="analyze_usage">Analyze</button>
        </div>
      </header>
      <div data-project-list></div>
    </section>

    <section class="footer">
      <div data-footer="service-alerts" hidden></div>
      <div class="meta">
        <div data-footer="rate">Rate: --</div>
        <div data-footer="status">Status: Loading</div>
      </div>
      <div class="today" data-footer="today">Today: $0.00 (0 tokens)</div>

      <div class="actions">
        <button class="action primary" data-action="refresh" data-i18n="refresh_now">↻ Refresh Now</button>
        <button class="action" data-action="quit" data-i18n="quit">⏻ Quit</button>
        <button class="action" data-action="install" data-i18n="install_hook">Install Hook</button>
      </div>
      <p class="attribution">based on <a href="https://github.com/aqua5230/usage" target="_blank">usage</a> by lollapalooza</p>
    </section>
  </main>

  <script>
    window.PanelHooks = {
      percentColor() {
        return "var(--text)";
      },
    };
  </script>
  <script>
{{CORE_SCRIPT}}  </script>
</body>
</html>

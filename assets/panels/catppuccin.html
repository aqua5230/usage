<!doctype html>
<html lang="en" data-flavor="{{PANEL_FLAVOR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark light;
      --bg: #080d12;
      --panel: rgba(25, 33, 42, 0.86);
      --panel-border: rgba(255, 255, 255, 0.15);
      --line: rgba(255, 255, 255, 0.13);
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.58);
      --track: rgba(255, 255, 255, 0.07);
      --button: rgba(255, 255, 255, 0.08);
      --button-border: rgba(255, 255, 255, 0.18);
      --button-hover: rgba(255, 255, 255, 0.13);
      --claude: #f49164;
      --codex: #58d6e6;
      --agy: #6b9aff;
      --grok: #e9e9ee;
      --projects: #30d158;
      --warn: #ffc439;
      --danger: #ff453a;
      --radius: 8px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef2f7;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-border: rgba(20, 28, 38, 0.14);
        --line: rgba(20, 28, 38, 0.13);
        --text: rgba(12, 18, 26, 0.9);
        --muted: rgba(12, 18, 26, 0.55);
        --track: rgba(12, 18, 26, 0.06);
        --button: rgba(12, 18, 26, 0.05);
        --button-border: rgba(12, 18, 26, 0.14);
        --button-hover: rgba(12, 18, 26, 0.10);
        --agy: #3f74e8;
        --grok: #1c1c1f;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0;
      overscroll-behavior: none;
    }

    body {
      padding: 12px;
      background:
        linear-gradient(180deg, #111b25 0%, #0b1118 44%, var(--bg) 100%);
    }

    @media (prefers-color-scheme: light) {
      body {
        background:
          linear-gradient(180deg, #f8fafc 0%, #eef3f8 48%, var(--bg) 100%);
      }
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .card {
      padding: 13px 15px 12px;
    }

    .card[data-card="codex"],
    .card[data-card="agy"] {
      overflow: visible;
      z-index: 2;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), transparent 72%);
      opacity: 0.72;
    }

    .brand {
      display: flex;
      align-items: center;
      height: 32px;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 6px 14px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .card[data-card="agy"] .brand-icon svg,
    .card[data-card="grok"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="agy"] .brand-icon,
    .card[data-card="grok"] .brand-icon {
      color: var(--accent);
    }

    .brand h1 {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 21px;
      line-height: 1;
      font-weight: 800;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .card[data-card="agy"] .brand h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="agy"] .codex-stale {
      margin-left: auto;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(10, 14, 20, 0.96);
      color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .card[data-card="projects"] .brand {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      height: auto;
      row-gap: 10px;
      margin-bottom: 10px;
    }

    .card[data-card="projects"] .brand-icon {
      grid-column: 1;
    }

    .card[data-card="projects"] h1 {
      grid-column: 2;
    }

    .project-actions {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .project-actions .switch {
      width: 100%;
      min-width: 0;
    }

    .switch {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: var(--button);
      color: var(--text);
      font: 600 12px/26px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: nowrap;
    }

    .row + .row {
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 8px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
    }

    .row-title {
      font-size: 15px;
      line-height: 18px;
      font-weight: 700;
    }

    .percent {
      font-size: 13px;
      line-height: 18px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
    }

    .track {
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--track);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.18);
    }

    .fill {
      width: 0%;
      height: 100%;
      min-width: 0;
      border-radius: inherit;
      background: var(--fill-color, var(--accent));
      background-image: linear-gradient(180deg, color-mix(in srgb, var(--fill-color, var(--accent)) 100%, white 12%), var(--fill-color, var(--accent)));
      box-shadow: 0 0 12px color-mix(in srgb, var(--fill-color, var(--accent)) 30%, transparent);
      transition: width 140ms ease-out, background-color 140ms ease-out;
    }

    .reset {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 13px;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
    }

    .reset[data-warning="true"] {
      color: #ff3b30;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: var(--muted);
    }

    .row[data-available="false"] .fill {
      width: 0%;
    }

    .proj-row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto auto;
      align-items: baseline;
      gap: 8px;
      padding: 8px 0 11px;
      font-size: 13.5px;
      line-height: 20px;
    }

    .proj-row:first-child {
      font-weight: 600;
    }

    .proj-rank {
      width: 16px;
      height: 16px;
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--muted) 26%, transparent);
      color: var(--text);
      font-weight: 700;
      font-size: 10px;
    }

    .proj-row:first-child .proj-rank {
      background: color-mix(in srgb, var(--projects) 32%, transparent);
      color: white;
    }

    .proj-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-row:first-child .proj-name {
      color: var(--text);
    }

    .proj-tokens {
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
      min-width: 84px;
    }

    .proj-cost {
      color: color-mix(in srgb, var(--muted) 70%, transparent);
      font-size: 12px;
      white-space: nowrap;
    }

    .proj-bar {
      grid-column: 1 / -1;
      height: 3px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
      align-self: end;
    }

    .proj-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 72%, transparent), var(--accent));
      opacity: 0.7;
    }

    .proj-row:first-child .proj-bar {
      height: 3.5px;
    }

    .proj-row:first-child .proj-bar-fill {
      opacity: 1;
    }

    .footer {
      min-height: 144px;
      padding: 12px 15px 11px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta > div {
      padding: 3px 8px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--button) 78%, transparent);
      border: 1px solid var(--button-border);
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(220, 80, 60, 0.16);
      border: 1px solid rgba(220, 80, 60, 0.4);
      color: #ff9b85;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .today {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 15px;
      line-height: 20px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }


    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: nowrap;
      flex: 1;
    }

    .action,
    .switch {
      transition: filter 80ms ease-out, transform 80ms ease-out;
    }

    .action:active,
    .switch:active {
      filter: brightness(0.82);
      transform: scale(0.98);
    }

    .action.primary {
      border-color: rgba(88, 214, 230, 0.30);
      background: linear-gradient(180deg, rgba(88, 214, 230, 0.26), rgba(24, 172, 216, 0.18));
      color: rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .action.primary:hover {
      border-color: rgba(88, 214, 230, 0.55);
      background: linear-gradient(180deg, #34d7f2, #18acd8);
      color: white;
    }

    .action:not(.primary):hover {
      background: var(--button);
      color: var(--text);
    }

    .action[data-action="install"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }

    .switch:hover {
      background: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .switch[data-active="true"] {
      color: white;
      border-color: rgba(48, 209, 88, 0.45);
      background: linear-gradient(180deg, rgba(48, 209, 88, 0.30), rgba(40, 180, 75, 0.20));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    @media (prefers-color-scheme: light) {
      .switch:hover {
        background: rgba(12, 18, 26, 0.10);
        border-color: rgba(12, 18, 26, 0.22);
      }
    }

    .attribution {
      font-size: 10px;
      color: rgba(255,255,255,0.18);
      text-align: center;
      margin-top: 6px;
    }

    .attribution a {
      color: inherit;
      text-decoration: none;
    }

    @media (prefers-color-scheme: light) {
      .attribution {
        color: rgba(12,18,26,0.30);
      }
    }




    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: 0.72; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24); transform: translateY(-2px); }
    .is-card-dragging, .is-card-dragging * { user-select: none; }

  --ctp-surface0: #313244;
  --ctp-base: #1e1e2e;
  --ctp-mantle: #181825;
  --ctp-crust: #11111b;
  --bg: #181825;
  --panel: #1e1e2e;
  --panel-border: #7f849c;
  --line: #585b70;
  --text: #cdd6f4;
  --muted: #a6adc8;
  --blueprint-accent: #74c7ec;
  --button: #313244;
  --button-border: #45475a;
  --button-hover: #45475a;
  --warn: #f9e2af;
  --danger: #f38ba8;
  --claude: var(--ctp-peach);
  --codex: var(--ctp-sky);
  --agy: var(--ctp-mauve);
  --grok: var(--ctp-subtext0);
  --projects: var(--ctp-green);
  --track: color-mix(in srgb, var(--ctp-overlay0) 25%, transparent);
  --blueprint-grid-fine: color-mix(in srgb, var(--ctp-overlay0) 22%, transparent);
  --blueprint-grid-coarse: color-mix(in srgb, var(--ctp-overlay0) 45%, transparent);
}

* {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important;
  letter-spacing: 0.05em !important;
}

body {
  background-color: var(--bg) !important;
  background-image: 
    repeating-linear-gradient(0deg, transparent, transparent 7px, var(--blueprint-grid-fine) 7px, var(--blueprint-grid-fine) 8px),
    repeating-linear-gradient(90deg, transparent, transparent 7px, var(--blueprint-grid-fine) 7px, var(--blueprint-grid-fine) 8px),
    repeating-linear-gradient(0deg, transparent, transparent 39px, var(--blueprint-grid-coarse) 39px, var(--blueprint-grid-coarse) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, var(--blueprint-grid-coarse) 39px, var(--blueprint-grid-coarse) 40px) !important;
  background-position: center top !important;
}

.card, .footer, .track, .fill, .proj-bar, .proj-bar-fill, .switch, .action, .brand img, .brand-icon, .proj-rank, .meta > div, .service-alert {
  border-radius: 0 !important;
}

.card, .footer {
  background: var(--bg) !important;
  border: 1px solid var(--panel-border) !important;
  box-shadow: none !important;
  overflow: visible !important;
}

.card::before, .footer::before {
  content: "";
  display: block !important;
  position: absolute;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  background:
    linear-gradient(var(--panel-border), var(--panel-border)) 4px 8px / 9px 1px no-repeat,
    linear-gradient(var(--panel-border), var(--panel-border)) 8px 4px / 1px 9px no-repeat,
    linear-gradient(var(--panel-border), var(--panel-border)) calc(100% - 4px) 8px / 9px 1px no-repeat,
    linear-gradient(var(--panel-border), var(--panel-border)) calc(100% - 8px) 4px / 1px 9px no-repeat,
    linear-gradient(var(--panel-border), var(--panel-border)) 4px calc(100% - 8px) / 9px 1px no-repeat,
    linear-gradient(var(--panel-border), var(--panel-border)) 8px calc(100% - 4px) / 1px 9px no-repeat,
    linear-gradient(var(--panel-border), var(--panel-border)) calc(100% - 4px) calc(100% - 8px) / 9px 1px no-repeat,
    linear-gradient(var(--panel-border), var(--panel-border)) calc(100% - 8px) calc(100% - 4px) / 1px 9px no-repeat !important;
  opacity: 1 !important;
  z-index: 10;
}

.card::after, .footer::after {
  content: "SEC: 0" !important;
  position: absolute;
  bottom: 0;
  right: 0;
  padding: 2px 6px !important;
  font-size: 8px !important;
  line-height: 10px !important;
  font-weight: bold;
  color: var(--panel-border);
  border-top: 1px solid var(--panel-border);
  border-left: 1px solid var(--panel-border);
  background: var(--bg);
  pointer-events: none;
  z-index: 10;
}
.card[data-card="claude"]::after { content: "SYS: CLAUDE" !important; }
.card[data-card="codex"]::after { content: "SYS: CODEX" !important; }
.card[data-card="agy"]::after { content: "SYS: AGY" !important; }
.card[data-card="projects"]::after { content: "SYS: PROJ" !important; }
.footer::after { content: "SYS: META" !important; }

.row-title, .switch, .action, .meta > div, .today, .proj-name {
  text-transform: uppercase;
}

h1 {
  letter-spacing: 0.01em !important;
}

.track {
  position: relative !important;
  background: 
    repeating-linear-gradient(90deg, 
      var(--panel-border) 0, 
      var(--panel-border) 1px, 
      transparent 1px, 
      transparent 10%) bottom left / 100% 4px no-repeat,
    transparent !important;
  border-bottom: 1px solid var(--panel-border) !important;
  box-shadow: none !important;
  overflow: visible !important;
}

.track::before,
.track::after {
  content: "";
  position: absolute;
  top: 100%;
  width: 6px;
  height: 6px;
  border-top: 1px solid var(--panel-border);
}
.track::before {
  left: 0;
  border-left: 1px solid var(--panel-border);
  transform: translateY(-50%) rotate(-45deg);
}
.track::after {
  right: 0;
  border-right: 1px solid var(--panel-border);
  transform: translateY(-50%) rotate(45deg);
}

.fill {
  background: repeating-linear-gradient(45deg, 
    var(--blueprint-accent), 
    var(--blueprint-accent) 2px, 
    transparent 2px, 
    transparent 4px) !important;
  box-shadow: none !important;
  border-bottom: 2px solid var(--blueprint-accent) !important;
}

.proj-bar {
  position: relative !important;
  background: 
    repeating-linear-gradient(90deg, 
      var(--panel-border) 0, 
      var(--panel-border) 1px, 
      transparent 1px, 
      transparent 10%) bottom left / 100% 3px no-repeat,
    transparent !important;
  border-bottom: 1px solid var(--panel-border) !important;
  box-shadow: none !important;
  overflow: visible !important;
}

.proj-bar::before,
.proj-bar::after {
  content: "";
  position: absolute;
  top: 100%;
  width: 4px;
  height: 4px;
  border-top: 1px solid var(--panel-border);
}
.proj-bar::before {
  left: 0;
  border-left: 1px solid var(--panel-border);
  transform: translateY(-50%) rotate(-45deg);
}
.proj-bar::after {
  right: 0;
  border-right: 1px solid var(--panel-border);
  transform: translateY(-50%) rotate(45deg);
}

.proj-bar-fill {
  background: repeating-linear-gradient(45deg, 
    var(--blueprint-accent), 
    var(--blueprint-accent) 1px, 
    transparent 1px, 
    transparent 3px) !important;
  border-bottom: 1px solid var(--blueprint-accent) !important;
  opacity: 1 !important;
}

.percent, .proj-tokens, .proj-cost {
  text-shadow: 
    -1px -1px 0 var(--bg),  
     1px -1px 0 var(--bg),
    -1px  1px 0 var(--bg),
     1px  1px 0 var(--bg) !important;
}

.action, .switch {
  background: var(--button) !important;
  border: 1px solid var(--button-border) !important;
  color: var(--text) !important;
  box-shadow: none !important;
}

.action:hover, .switch:hover {
  background: var(--button-hover) !important;
}

.action.primary {
  background: var(--blueprint-accent) !important;
  color: var(--bg) !important;
  border-color: var(--blueprint-accent) !important;
  font-weight: bold !important;
}

.action.primary:hover {
  background: var(--text) !important;
  border-color: var(--text) !important;
  color: var(--bg) !important;
}

.switch[data-active="true"] {
  background: var(--blueprint-accent) !important;
  color: var(--bg) !important;
  border-color: var(--blueprint-accent) !important;
}

.brand img {
  filter: grayscale(100%) contrast(200%);
  border: 1px solid var(--panel-border);
  box-shadow: none !important;
}

.brand-icon {
  background: transparent !important;
  box-shadow: inset 0 0 0 1px var(--panel-border) !important;
  color: var(--blueprint-accent) !important;
}

.proj-rank {
  border: 1px solid var(--panel-border) !important;
  background: transparent !important;
  color: var(--text) !important;
}
.proj-row:first-child .proj-rank {
  border-color: var(--blueprint-accent) !important;
  color: var(--blueprint-accent) !important;
  background: transparent !important;
}

.meta > div {
  border: 1px solid var(--panel-border) !important;
  background: transparent !important;
}


/* 藍圖原稿把填色寫死成單一製圖藍，蓋掉了每張卡自己的 --accent。
   改回吃 --accent，四張卡才會各是 peach / sky / mauve / green。 */
.fill {
  background: repeating-linear-gradient(45deg,
    var(--accent),
    var(--accent) 2px,
    transparent 2px,
    transparent 4px) !important;
  border-bottom: 2px solid var(--accent) !important;
}

.proj-bar-fill {
  background: repeating-linear-gradient(45deg,
    var(--ctp-green),
    var(--ctp-green) 2px,
    transparent 2px,
    transparent 4px) !important;
}

/* 卡片原本跟背景同色，整片糊在一起。Catppuccin 的層次靠 mantle < base，讓卡片浮起來。 */
.card, .footer {
  background: var(--panel) !important;
}

/* SYS 標籤原本貼在卡片右下角內側，正好蓋住最後一行的 "Resets in ..."。
   改成騎在卡片下框線上，像貼在圖紙外緣的標籤，就不會壓字。 */
.card::after, .footer::after {
  bottom: -7px !important;
  right: 10px !important;
  background: var(--panel) !important;
}

/* 署名原本淡到幾乎看不見 */
.attribution {
  color: var(--muted) !important;
  opacity: 0.75 !important;
}

.attribution a { color: var(--ctp-sapphire) !important; }

/* 等寬字 + 大寫 + 字距讓標題列塞不下，兩邊各讓一點，避免 "Claude Co…" 被截 */
.brand h1 {
  font-size: 19px !important;
  letter-spacing: 0 !important;
}

.switch {
  letter-spacing: 0.02em !important;
  font-size: 11px !important;
}

/* footer 署名被色票列擠掉，拉開間距並補回對比 */
.footer .credit,
.footer > div:last-of-type {
  opacity: 1;
}

/* 底部 flavor 選色列：方形色票 + 製圖十字，配合圖紙語彙 */
.ctp-flavors {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  padding: 12px 0 2px;
}

.ctp-flavors button {
  width: 20px;
  height: 20px;
  padding: 0;
  border-radius: 0;
  border: 1px solid var(--panel-border);
  cursor: pointer;
  position: relative;
  -webkit-appearance: none;
  appearance: none;
  transition: transform 0.12s ease;
}

.ctp-flavors button:hover { transform: scale(1.15); }

.ctp-flavors button[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  inset: -5px;
  border: 1px solid var(--blueprint-accent);
}

.ctp-flavors button[aria-pressed="true"]::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -9px;
  width: 1px;
  height: 5px;
  background: var(--blueprint-accent);
}

.ctp-flavors button[data-flavor="latte"] { background: #eff1f5; }
.ctp-flavors button[data-flavor="frappe"] { background: #303446; }
.ctp-flavors button[data-flavor="macchiato"] { background: #24273a; }
.ctp-flavors button[data-flavor="mocha"] { background: #1e1e2e; }


  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" data-card="claude" style="--accent: var(--claude)">
      <header class="brand">
        <img src="{{CLAUDE_ICON}}" alt="">
        <h1 data-i18n="claude_name">Claude Code</h1>
        <button class="switch" data-action="switch" data-i18n="switch_panel">⇄ Switch Panel</button>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="codex" style="--accent: var(--codex)">
      <header class="brand">
        <img src="{{CODEX_ICON}}" alt="">
        <h1 data-i18n="codex_name">Codex</h1>
        <div class="codex-stale" data-codex-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-codex-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
      <div class="codex-credits" data-codex-credits></div>
    </section>

    <section class="card" data-card="agy" style="--accent: var(--agy)">
      <header class="brand">
        <div class="brand-icon"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
        <h1 data-i18n="agy_name">Antigravity</h1>
        <div class="codex-stale" data-agy-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-agy-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-agy-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="grok" style="--accent: var(--grok)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></div>
        <h1 data-i18n="grok_name">Grok</h1>
        <div class="codex-stale" data-grok-stale hidden>
          <span aria-hidden="true">⚠</span><span data-grok-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-grok-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="projects" style="--accent: var(--projects)">
      <header class="brand">
        <div class="brand-icon"><svg width="30" height="30" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.75 8.25C4.75 7.14543 5.64543 6.25 6.75 6.25H10.5729C10.9737 6.25 11.3598 6.40073 11.6548 6.67228L12.9952 7.90522C13.2902 8.17677 13.6763 8.3275 14.0771 8.3275H19.25C20.3546 8.3275 21.25 9.22293 21.25 10.3275V17.75C21.25 18.8546 20.3546 19.75 19.25 19.75H6.75C5.64543 19.75 4.75 18.8546 4.75 17.75V8.25Z" stroke="var(--projects)" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.25 11.25H18.75" stroke="var(--projects)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/><path d="M8.75 14.15C8.75 13.4596 9.30964 12.9 10 12.9H10.3C10.9904 12.9 11.55 13.4596 11.55 14.15V16.5H8.75V14.15Z" fill="var(--projects)" opacity="0.18" stroke="var(--projects)" stroke-width="1.4"/><path d="M12.6 13.25C12.6 12.6425 13.0925 12.15 13.7 12.15H14.05C14.6575 12.15 15.15 12.6425 15.15 13.25V16.5H12.6V13.25Z" fill="var(--projects)" opacity="0.3" stroke="var(--projects)" stroke-width="1.4"/><path d="M16.2 14.85C16.2 14.1873 16.7373 13.65 17.4 13.65H17.75C18.4127 13.65 18.95 14.1873 18.95 14.85V16.5H16.2V14.85Z" fill="var(--projects)" opacity="0.48" stroke="var(--projects)" stroke-width="1.4"/></svg></div>
        <h1 data-i18n="projects_title">Project Usage</h1>
        <div class="codex-stale" data-history-error hidden>
          <span aria-hidden="true">⚠</span>
          <span data-history-error-text></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-history-error-tooltip></span>
          </span>
        </div>
        <div class="project-actions">
          <button class="switch" data-action="toggle-project-range">Today</button>
          <button class="switch" data-action="analyze" data-i18n="analyze_usage">Analyze</button>
          <button class="switch" data-action="toggle-statusline" data-i18n="cli">CLI</button>
        </div>
      </header>
      <div data-project-list></div>
    </section>

    <section class="footer">
      <div data-footer="service-alerts" hidden></div>
      <div class="meta">
        <div data-footer="rate">Rate: --</div>
        <div data-footer="status">Status: Loading</div>
      </div>
      <div class="today" data-footer="today">Today: $0.00 (0 tokens)</div>

      <div class="actions">
        <button class="action primary" data-action="refresh" data-i18n="refresh_now">↻ Refresh Now</button>
        <button class="action" data-action="quit" data-i18n="quit">⏻ Quit</button>
        <button class="action" data-action="install" data-i18n="install_hook">Install Hook</button>
      </div>
      <p class="attribution">based on <a href="https://github.com/aqua5230/usage" target="_blank">usage</a> by lollapalooza</p>
      <div class="ctp-flavors">
        <button type="button" data-flavor="latte" title="Latte" aria-label="Latte" aria-pressed="false"></button>
        <button type="button" data-flavor="frappe" title="Frappé" aria-label="Frappé" aria-pressed="false"></button>
        <button type="button" data-flavor="macchiato" title="Macchiato" aria-label="Macchiato" aria-pressed="false"></button>
        <button type="button" data-flavor="mocha" title="Mocha" aria-label="Mocha" aria-pressed="false"></button>
      </div>
    </section>
  </main>

  <script>
    var ctpFlavorButtons = document.querySelectorAll(".ctp-flavors button");

    function syncCtpFlavorButtons() {
      var flavor = document.documentElement.dataset.flavor;
      for (var i = 0; i < ctpFlavorButtons.length; i += 1) {
        ctpFlavorButtons[i].setAttribute(
          "aria-pressed",
          String(ctpFlavorButtons[i].dataset.flavor === flavor)
        );
      }
    }

    function setCtpFlavor(flavor) {
      document.documentElement.dataset.flavor = flavor;
      syncCtpFlavorButtons();
      var bridge =
        window.webkit &&
        window.webkit.messageHandlers &&
        window.webkit.messageHandlers.usage;
      if (bridge && typeof bridge.postMessage === "function") {
        bridge.postMessage(JSON.stringify({ action: "set_panel_flavor", flavor: flavor }));
      }
    }

    for (var i = 0; i < ctpFlavorButtons.length; i += 1) {
      ctpFlavorButtons[i].addEventListener("click", function () {
        setCtpFlavor(this.dataset.flavor);
      });
    }
    syncCtpFlavorButtons();
  </script>
  <script>
{{CORE_SCRIPT}}  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --muse: #0082FB;
      --text: #f0e8ff;
      --muted: #a08cc0;
      --panel-bg: rgba(10, 0, 20, 0.25);
      --warn: #ffe066;
      --danger: #ff4f8a;
      --tick: rgba(240, 232, 255, 0.16);
      --rainbow: linear-gradient(90deg, hsl(0 100% 62%), hsl(45 100% 62%), hsl(100 100% 60%), hsl(175 100% 58%), hsl(235 100% 68%), hsl(300 100% 64%));
      --holo-border: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      --shadow: 0 18px 46px rgba(0, 0, 0, 0.44);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: #07000f;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -32%;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: conic-gradient(from 0deg, #ff00ff, #00ffff, #ffff00, #ff6600, #8844ff, #ff00ff);
      opacity: 0.07;
      filter: blur(18px);
      animation: auraSpin 28s linear infinite;
    }

    body::after {
      inset: 0;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 0, 255, 0.18), transparent 28%),
        radial-gradient(circle at 78% 18%, rgba(0, 255, 255, 0.14), transparent 28%),
        radial-gradient(circle at 52% 92%, rgba(255, 255, 0, 0.1), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 42%);
      opacity: 0.8;
    }

    @keyframes auraSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes sweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(220%); }
    }

    .prism-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 10px;
      overflow: hidden;
      isolation: isolate;
    }

    .wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer,
    .switch,
    .range-chip,
    .action {
      border: 1.5px solid transparent;
      background-image:
        linear-gradient(#07000f, #07000f),
        var(--holo-border);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }

    .card,
    .footer {
      position: relative;
      overflow: hidden;
      background-color: var(--panel-bg);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .card::before,
    .footer::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255, 0, 255, 0.12), transparent 32%, rgba(0, 255, 255, 0.12) 68%, transparent),
        radial-gradient(circle at top right, rgba(255, 255, 0, 0.1), transparent 34%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .card {
      padding: 12px 14px;
    }

    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] {
      min-height: 210px;
      padding: 10px 14px;
    }

    .card[data-card="codex"]:has([data-row="session"][hidden]) {
      min-height: 0;
    }

    .card[data-card="claude"] .header,
    .card[data-card="codex"] .header,
    .card[data-card="agy"] .header {
      margin-bottom: 8px;
    }

    .header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .header img,
    .prism-badge {
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background:
        linear-gradient(135deg, rgba(255, 0, 255, 0.3), rgba(0, 255, 255, 0.18), rgba(255, 255, 0, 0.22)),
        rgba(40, 0, 60, 0.22);
      box-shadow: 0 0 18px rgba(255, 0, 255, 0.22), inset 0 0 14px rgba(255, 255, 255, 0.08);
    }

    .prism-badge {
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
    }

    .header-copy {
      min-width: 0;
      flex: 1;
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card[data-card="projects"] .header {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      height: auto;
      column-gap: 10px;
      row-gap: 10px;
    }

    .card[data-card="projects"] .prism-badge {
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
    }

    .card[data-card="projects"] .header-copy {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
    }

    .card[data-card="projects"] h1 {
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .card[data-card="projects"] .range-chip {
      grid-column: 1 / 3;
      grid-row: 2;
      width: calc((100% - 8px) / 2);
    }

    .card[data-card="projects"] .range-chip:nth-of-type(1) {
      justify-self: start;
    }

    .card[data-card="projects"] .range-chip:nth-of-type(2) {
      justify-self: end;
    }


    .switch,
    .range-chip,
    .action {
      background-color: rgba(40, 0, 60, 0.25);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 0 14px rgba(255, 0, 255, 0.18), inset 0 0 10px rgba(0, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .switch,
    .range-chip {
      flex: none;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .switch:active,
    .action:active,
    .range-chip:active {
      transform: translateY(1px);
    }

    .row {
      position: relative;
      z-index: 1;
      padding: 10px 0 0;
    }

    .card[data-card="claude"] .row,
    .card[data-card="codex"] .row,
    .card[data-card="agy"] .row {
      padding-top: 8px;
    }

    .row + .row {
      margin-top: 10px;
      border-top: 1px solid rgba(240, 232, 255, 0.13);
    }

    .card[data-card="claude"] .row + .row,
    .card[data-card="codex"] .row + .row,
    .card[data-card="agy"] .row + .row {
      margin-top: 8px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .row-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0;
    }

    .percent {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .track {
      position: relative;
      height: 16px;
      padding: 2px;
      overflow: hidden;
      border-radius: 999px;
      border: 1px solid rgba(240, 232, 255, 0.18);
      background: rgba(8, 0, 16, 0.84);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.48);
    }

    .track::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 calc(10% - 1px),
          var(--tick) calc(10% - 1px) 10%
        );
      pointer-events: none;
      z-index: 2;
    }

    .track::after {
      content: "";
      position: absolute;
      inset: 1px auto 1px 0;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), transparent);
      animation: sweep 2.4s linear infinite;
      pointer-events: none;
      z-index: 3;
    }

    .fill {
      position: relative;
      z-index: 1;
      width: var(--value, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--rainbow);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.2), 0 0 18px rgba(0, 255, 255, 0.16);
      transition: width 160ms ease-out, filter 160ms ease-out;
    }

    .reset {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .reset[data-warning="true"] {
      color: var(--danger);
      font-weight: 600;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: rgba(160, 140, 192, 0.7);
    }

    .projects-card {
      flex: 1;
      padding-bottom: 12px;
    }

    [data-project-list] {
      position: relative;
      z-index: 1;
    }

    .proj-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 8px 0 11px;
      border-top: 1px solid rgba(240, 232, 255, 0.13);
    }

    .proj-row:first-child {
      border-top: none;
    }

    .proj-topline {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .proj-rank {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(255, 0, 255, 0.24), rgba(0, 255, 255, 0.22));
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      flex: none;
    }

    .proj-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .proj-tokens {
      align-self: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .proj-cost {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .empty-state {
      padding: 12px 4px 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer {
      padding: 12px 14px;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 79, 138, 0.16);
      border: 1px solid rgba(255, 79, 138, 0.5);
      color: #ff99bc;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      line-height: 1.15;
      color: var(--muted);
    }

    .today {
      position: relative;
      z-index: 1;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid rgba(240, 232, 255, 0.13);
      font-size: 13px;
      line-height: 1.15;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .action {
      flex: 1;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
    }

    .action.primary:hover {
      background-color: color-mix(in srgb, #ff00ff 18%, rgba(40, 0, 60, 0.25));
      box-shadow: 0 0 18px rgba(255, 0, 255, 0.28), 0 0 14px rgba(0, 255, 255, 0.18), inset 0 0 12px rgba(255, 255, 255, 0.08);
    }

    .action:not(.primary):hover {
      background-color: var(--panel-bg);
      color: var(--text);
    }

    .switch:hover,
    .range-chip:hover {
      background-color: color-mix(in srgb, #00ffff 10%, var(--panel-bg));
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.22), inset 0 0 10px rgba(255, 0, 255, 0.1);
    }


    .action[data-action="install"] {
      display: none;
    }

    .footer .action[data-action="switch"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }


    .card[data-card="agy"] .prism-badge svg,
    .card[data-card="grok"] .prism-badge svg {
      width: 18px;
      height: 18px;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(10, 14, 20, 0.96);
      color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .stale-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .stale-badge[hidden] {
      display: none;
    }

    .stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 240px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 0, 255, 0.32);
      background: rgba(10, 0, 20, 0.96);
      color: var(--text);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 0, 255, 0.18);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .stale-info:hover .stale-tooltip {
      display: block;
    }

    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .hide-claude .footer .action[data-action="switch"] { display: inline-block; }

    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging {
      cursor: grabbing;
      opacity: 0.8;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), 0 0 22px rgba(255, 0, 255, 0.34), 0 0 18px rgba(0, 255, 255, 0.24);
      transform: translateY(-2px);
    }
    .is-card-dragging, .is-card-dragging * { user-select: none; }

    .card[data-card="agy"] .agy-group-toggle {
      flex: 0 0 auto;
      border: 1px solid color-mix(in srgb, #8ef2ff 60%, transparent);
      border-radius: 999px;
      padding: 3px 6px;
      background: color-mix(in srgb, #8ef2ff 12%, transparent);
      color: #8ef2ff;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
    }
    .card[data-card="agy"] .agy-group-toggle:hover,
    .card[data-card="agy"] .agy-group-toggle:focus-visible {
      background: color-mix(in srgb, #8ef2ff 25%, transparent);
    }
    .card[data-card="agy"] .header-copy {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card[data-card="agy"] .header-copy h1 {
      flex: 0 1 auto;
    }

    .card[data-card="muse"] .prism-badge svg {
      width: 18px;
      height: 18px;
    }

    .hide-muse [data-card="muse"] { display: none; }

    .card[data-card="muse"] .prism-badge { color: var(--text); }

    .card[data-card="muse"] {
      min-height: 210px;
      padding: 10px 14px;
    }

    .card[data-card="muse"] .header {
      margin-bottom: 8px;
    }

    .card[data-card="muse"] .row {
      padding-top: 8px;
    }

    .card[data-card="muse"] .row + .row {
      margin-top: 8px;
    }
    /* Compact layout keeps this theme's header geometry and decoration. */
    html.compact-cards body .card[data-card="projects"] { padding-inline: 13px; }
    html.compact-cards body .card[data-card="projects"] .header {
      grid-template-columns: 24px minmax(0, 1fr);
      column-gap: 8px;
    }
    html.compact-cards body .card[data-card] .prism-badge {
      width: 24px;
      height: 24px;
      flex-basis: 24px;
    }
    html.compact-cards body .card[data-card] .header :is(.brand-icon, .prism-badge) svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <canvas class="prism-canvas" aria-hidden="true"></canvas>

  <div class="viewport">
    <main class="wrap">
      <section class="card" data-card="claude">
        <header class="header">
          <img src="{{CLAUDE_ICON}}" alt="">
          <div class="header-copy">
            <h1 data-i18n="claude_name">Claude Code</h1>
          </div>
          <button class="switch" data-action="switch" data-i18n="settings_button">⚙ Settings</button>
        </header>
        <div class="row" data-row="session"></div>
        <div class="row" data-row="weekly"></div>
      </section>

      <section class="card" data-card="codex">
        <header class="header">
          <img src="{{CODEX_ICON}}" alt="">
          <div class="header-copy">
            <h1 data-i18n="codex_name">Codex</h1>
          </div>
          <div class="codex-stale" data-codex-stale hidden>
            <span aria-hidden="true">⚠</span>
            <span data-codex-stale-age></span>
            <span class="codex-stale-info" aria-hidden="true">ⓘ
              <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
            </span>
          </div>
        </header>
        <div class="row" data-row="session"></div>
        <div class="row" data-row="weekly"></div>
      </section>

      <section class="card" data-card="agy">
        <header class="header">
          <div class="prism-badge" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
          <div class="header-copy">
            <h1 data-i18n="agy_name">Antigravity</h1>
        <button type="button" class="agy-group-toggle" data-action="set_agy_quota_group" title="" aria-label=""></button>
          </div>
          <div class="stale-badge" data-agy-stale hidden>
            <span aria-hidden="true">⚠</span>
            <span data-agy-stale-age></span>
            <span class="stale-info" aria-hidden="true">ⓘ
              <span class="stale-tooltip" data-agy-stale-tooltip></span>
            </span>
          </div>
        </header>
        <div class="row" data-row="session"></div>
        <div class="row" data-row="weekly"></div>
      </section>

      <section class="card" data-card="grok">
        <header class="header">

  <script>
    window.PanelHooks = {
      accentFallback() {
        return "";
      },
      applyFillVisual(fillEl, { available, percent, color }) {
        fillEl.style.setProperty("--value", available ? `${Math.max(0, Math.min(100, percent))}%` : "0%");
        fillEl.style.filter = available && color ? "saturate(1.25) brightness(1.12)" : "";
      },
      renderProjectRow(project, index) {
        const row = document.createElement("div");
        const topline = document.createElement("div");
        const rank = document.createElement("span");
        const name = document.createElement("span");
        const tokens = document.createElement("span");
        const cost = document.createElement("span");
        row.className = "proj-row";
        topline.className = "proj-topline";
        rank.className = "proj-rank";
        name.className = "proj-name";
        tokens.className = "proj-tokens";
        cost.className = "proj-cost";
        rank.textContent = `${index + 1}`;
        name.textContent = project.name || "";
        tokens.textContent = project.tokensText || "";
        cost.textContent = project.costText || "";
        topline.append(rank, name);
        row.append(topline, tokens, cost);
        return row;
      },
      switchButtonStrategy() {},
      pointerdownExcludeSelector: "button, a, .codex-stale-info, .stale-info",
    };

    const canvas = document.querySelector(".prism-canvas");
    const ctx = canvas.getContext("2d");
    const shards = [];
    const motes = [];
    const shardCount = 26;
    const moteCount = 64;
    let width = 0;
    let height = 0;
    let pixelRatio = 1;

    function hsl(hue, alpha) {
      return `hsla(${hue}, 100%, 64%, ${alpha})`;
    }

    function resetShard(shard) {
      shard.x = Math.random() * width;
      shard.y = Math.random() * height;
      shard.size = 18 + Math.random() * 34;
      shard.sides = Math.random() > 0.48 ? 3 : 4;
      shard.hue = Math.random() * 360;
      shard.fillAlpha = 0.08 + Math.random() * 0.07;
      shard.angle = Math.random() * Math.PI * 2;
      shard.spin = (Math.random() - 0.5) * 0.004;
      shard.dx = (Math.random() - 0.5) * 0.16;
      shard.dy = (Math.random() - 0.5) * 0.12;
    }

    function resetMote(mote) {
      mote.x = Math.random() * width;
      mote.y = Math.random() * height;
      mote.r = 0.8 + Math.random() * 1.8;
      mote.hue = Math.random() * 360;
      mote.phase = Math.random() * Math.PI * 2;
      mote.dx = (Math.random() - 0.5) * 0.22;
      mote.dy = (Math.random() - 0.5) * 0.2;
      mote.baseAlpha = 0.18 + Math.random() * 0.35;
    }

    function resizeCanvas() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * pixelRatio);
      canvas.height = Math.floor(height * pixelRatio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      if (shards.length === 0) {
        for (let i = 0; i < shardCount; i += 1) {
          const shard = {};
          resetShard(shard);
          shards.push(shard);
        }
      }
      if (motes.length === 0) {
        for (let i = 0; i < moteCount; i += 1) {
          const mote = {};
          resetMote(mote);
          motes.push(mote);
        }
      }
    }

    function wrapPoint(item, margin) {
      if (item.x < -margin) item.x = width + margin;
      if (item.x > width + margin) item.x = -margin;
      if (item.y < -margin) item.y = height + margin;
      if (item.y > height + margin) item.y = -margin;
    }

    function drawShard(shard) {
      const half = shard.size / 2;
      ctx.save();
      ctx.translate(shard.x, shard.y);
      ctx.rotate(shard.angle);
      ctx.beginPath();
      if (shard.sides === 3) {
        ctx.moveTo(0, -half);
        ctx.lineTo(half * 0.9, half * 0.72);
        ctx.lineTo(-half * 0.85, half * 0.68);
      } else {
        ctx.moveTo(0, -half);
        ctx.lineTo(half * 0.75, 0);
        ctx.lineTo(0, half);
        ctx.lineTo(-half * 0.75, 0);
      }
      ctx.closePath();
      ctx.fillStyle = hsl(shard.hue, shard.fillAlpha);
      ctx.strokeStyle = hsl((shard.hue + 40) % 360, 0.4);
      ctx.lineWidth = 0.4;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawMote(mote, time) {
      const alpha = mote.baseAlpha * (0.45 + Math.sin(time * 0.003 + mote.phase) * 0.28 + 0.35);
      ctx.beginPath();
      ctx.arc(mote.x, mote.y, mote.r, 0, Math.PI * 2);
      ctx.fillStyle = hsl(mote.hue, Math.max(0.08, Math.min(0.75, alpha)));
      ctx.shadowColor = hsl(mote.hue, 0.65);
      ctx.shadowBlur = 7;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawPrismField(time) {
      ctx.clearRect(0, 0, width, height);
      shards.forEach((shard) => {
        shard.x += shard.dx;
        shard.y += shard.dy;
        shard.angle += shard.spin;
        wrapPoint(shard, shard.size);
        drawShard(shard);
      });
      motes.forEach((mote) => {
        mote.x += mote.dx + Math.sin(time * 0.001 + mote.phase) * 0.05;
        mote.y += mote.dy + Math.cos(time * 0.0011 + mote.phase) * 0.04;
        wrapPoint(mote, 8);
        drawMote(mote, time);
      });
    }

    function animate(time) {
      drawPrismField(time);
      window.requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    window.requestAnimationFrame(animate);
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --text: #ffe8cc;
      --muted: #b07040;
      --surface: rgba(8, 4, 0, 0.14);
      --line: rgba(255, 120, 20, 0.3);
      --warn: #ffcc44;
      --danger: #ff5533;
      --bar: linear-gradient(90deg, #ff6600 0%, #ffcc44 52%, #ffffff 100%);
      --tick: rgba(255, 232, 204, 0.13);
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: #000000;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 32%, rgba(255, 110, 0, 0.11), transparent 28%),
        linear-gradient(180deg, transparent 0 55%, rgba(70, 24, 0, 0.2) 100%);
    }

    @keyframes sweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(220%); }
    }

    .space-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 10px;
      overflow: hidden;
      isolation: isolate;
    }

    .wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow), 0 0 24px rgba(255, 100, 0, 0.08) inset;
      border-radius: 8px;
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
    }

    .card::before,
    .footer::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top right, rgba(255, 160, 32, 0.12), transparent 34%),
        linear-gradient(180deg, rgba(255, 120, 20, 0.08), transparent 42%);
    }

    .card {
      padding: 12px 14px;
    }

    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] {
      flex: none;
      min-height: 210px;
      padding: 10px 14px;
    }

    .card[data-card="codex"]:has([data-row="session"][hidden]) {
      min-height: 0;
    }

    .card[data-card="agy"] {
      overflow: visible;
    }

    .card[data-card="claude"] .header,
    .card[data-card="codex"] .header,
    .card[data-card="agy"] .header {
      margin-bottom: 8px;
    }

    .header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .header img,
    .singularity-badge {
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 50%;
      border: 1px solid rgba(255, 140, 40, 0.34);
      background:
        radial-gradient(circle, #000 0 42%, rgba(255, 150, 35, 0.5) 48%, rgba(40, 8, 0, 0.8) 72%),
        rgba(20, 8, 0, 0.8);
      box-shadow: 0 0 18px rgba(255, 100, 0, 0.2), inset 0 0 12px rgba(255, 180, 60, 0.1);
    }

    .singularity-badge {
      display: grid;
      place-items: center;
      color: #ffcc44;
      font-size: 14px;
      font-weight: 800;
    }

    .header-copy {
      min-width: 0;
      flex: 1;
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(10, 14, 20, 0.96);
      color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .card[data-card="projects"] .header {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      height: auto;
      column-gap: 10px;
      row-gap: 10px;
    }

    .card[data-card="projects"] .singularity-badge {
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
    }

    .card[data-card="projects"] .header-copy {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
    }

    .card[data-card="projects"] h1 {
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .card[data-card="projects"] .range-chip {
      grid-column: 1 / 3;
      grid-row: 2;
      width: calc((100% - 16px) / 3);
    }

    .card[data-card="projects"] .range-chip:nth-of-type(1) {
      justify-self: start;
    }

    .card[data-card="projects"] .range-chip:nth-of-type(2) {
      justify-self: center;
    }

    .card[data-card="projects"] .range-chip:nth-of-type(3) {
      justify-self: end;
    }

    .switch,
    .range-chip,
    .action {
      border: 1px solid rgba(255, 120, 20, 0.4);
      background: rgba(20, 8, 0, 0.8);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 0 14px rgba(255, 100, 0, 0.14), inset 0 0 10px rgba(255, 160, 32, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .switch,
    .range-chip {
      flex: none;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .switch:active,
    .action:active,
    .range-chip:active {
      transform: translateY(1px);
    }

    .row {
      position: relative;
      z-index: 1;
      padding: 10px 0 0;
    }

    .card[data-card="claude"] .row,
    .card[data-card="codex"] .row,
    .card[data-card="agy"] .row {
      padding-top: 8px;
    }

    .row + .row {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 120, 20, 0.15);
    }

    .card[data-card="claude"] .row + .row,
    .card[data-card="codex"] .row + .row,
    .card[data-card="agy"] .row + .row {
      margin-top: 8px;
    }

    .agy-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: none;
      color: #ffcc44;
      border: 1px solid rgba(255, 140, 40, 0.34);
      border-radius: 50%;
      background:
        radial-gradient(circle, #000 0 42%, rgba(255, 150, 35, 0.5) 48%, rgba(40, 8, 0, 0.8) 72%),
        rgba(20, 8, 0, 0.8);
      box-shadow: 0 0 18px rgba(255, 100, 0, 0.2), inset 0 0 12px rgba(255, 180, 60, 0.1);
    }

    .agy-icon svg {
      width: 20px;
      height: 20px;
    }

    .card[data-card="grok"] .brand-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: none;
      color: #ffcc44;
      border: 1px solid rgba(255, 140, 40, 0.34);
      border-radius: 50%;
      background:
        radial-gradient(circle, #000 0 42%, rgba(255, 150, 35, 0.5) 48%, rgba(40, 8, 0, 0.8) 72%),
        rgba(20, 8, 0, 0.8);
      box-shadow: 0 0 18px rgba(255, 100, 0, 0.2), inset 0 0 12px rgba(255, 180, 60, 0.1);
    }

    .card[data-card="grok"] .brand-icon svg {
      width: 20px;
      height: 20px;
    }

    .stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      margin-left: auto;
      color: var(--warn);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .stale[hidden] {
      display: none;
    }

    .stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 120, 20, 0.3);
      border-radius: 7px;
      background: rgba(20, 8, 0, 0.92);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.45;
      white-space: normal;
    }

    .stale-info:hover .stale-tooltip {
      display: block;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .row-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0;
    }

    .percent {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .track {
      position: relative;
      height: 16px;
      padding: 2px;
      overflow: hidden;
      border-radius: 999px;
      border: 1px solid rgba(255, 120, 20, 0.24);
      background: rgba(12, 4, 0, 0.84);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.62);
    }

    .track::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 calc(10% - 1px),
          var(--tick) calc(10% - 1px) 10%
        );
      pointer-events: none;
      z-index: 2;
    }

    .track::after {
      content: "";
      position: absolute;
      inset: 1px auto 1px 0;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.68), transparent);
      animation: sweep 2.5s linear infinite;
      pointer-events: none;
      z-index: 3;
    }

    .fill {
      position: relative;
      z-index: 1;
      width: var(--value, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--bar);
      box-shadow: 0 0 18px rgba(255, 100, 0, 0.24);
      transition: width 160ms ease-out, filter 160ms ease-out;
    }

    .reset {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .reset[data-warning="true"] {
      color: var(--danger);
      font-weight: 600;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: rgba(176, 112, 64, 0.72);
    }

    .projects-card {
      flex: 1;
      padding-bottom: 12px;
    }

    [data-project-list] {
      position: relative;
      z-index: 1;
    }

    .proj-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 8px 0 11px;
      border-top: 1px solid rgba(255, 120, 20, 0.15);
    }

    .proj-row:first-child {
      border-top: none;
    }

    .proj-topline {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .proj-rank {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 120, 20, 0.16);
      color: #ffcc44;
      font-size: 11px;
      font-weight: 700;
      flex: none;
    }

    .proj-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .proj-tokens {
      align-self: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .proj-cost {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .empty-state {
      padding: 12px 4px 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer {
      padding: 12px 14px;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 85, 51, 0.16);
      border: 1px solid rgba(255, 85, 51, 0.48);
      color: var(--warn);
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      line-height: 1.15;
      color: var(--muted);
    }

    .today {
      position: relative;
      z-index: 1;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 120, 20, 0.15);
      font-size: 13px;
      line-height: 1.15;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .action {
      flex: 1;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
    }

    .action.primary:hover {
      background: color-mix(in srgb, #ff6600 26%, var(--surface));
      border-color: rgba(255, 160, 32, 0.68);
      box-shadow: 0 0 18px rgba(255, 100, 0, 0.24), inset 0 0 12px rgba(255, 160, 32, 0.12);
    }

    .action:not(.primary):hover {
      background: var(--surface);
      color: var(--text);
    }

    .switch:hover,
    .range-chip:hover {
      background: color-mix(in srgb, #ff6600 12%, var(--surface));
      border-color: rgba(255, 120, 20, 0.52);
    }

    .range-chip[data-active="true"] {
      background: color-mix(in srgb, #ff6600 18%, var(--surface));
      color: var(--text);
      border-color: rgba(255, 120, 20, 0.55);
    }

    .action[data-action="install"] {
      display: none;
    }

    .footer .action[data-action="switch"] {
      display: none;
    }

    .footer .action[data-action="switch"][data-switch-relocatable="true"] {
      display: inline-block;
      flex: 1;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }


    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging {
      cursor: grabbing;
      opacity: 0.78;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.52), 0 0 20px rgba(255, 112, 20, 0.18);
      transform: translateY(-2px);
    }
    .is-card-dragging, .is-card-dragging * { user-select: none; }
  </style>
</head>
<body>
  <canvas class="space-canvas" aria-hidden="true"></canvas>

  <div class="viewport">
    <main class="wrap">
      <section class="card" data-card="claude">
        <header class="header">
          <img src="{{CLAUDE_ICON}}" alt="">
          <div class="header-copy">
            <h1 data-i18n="claude_name">Claude Code</h1>
          </div>
          <button class="switch" data-action="switch" data-switch-relocatable="true" data-i18n="switch_panel">Switch Panel</button>
        </header>
        <div class="row" data-row="session"></div>
        <div class="row" data-row="weekly"></div>
      </section>

      <section class="card" data-card="codex">
        <header class="header">
          <img src="{{CODEX_ICON}}" alt="">
          <div class="header-copy">
            <h1 data-i18n="codex_name">Codex</h1>
          </div>
          <div class="codex-stale" data-codex-stale hidden>
            <span aria-hidden="true">⚠</span>
            <span data-codex-stale-age></span>
            <span class="codex-stale-info" aria-hidden="true">ⓘ
              <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
            </span>
          </div>
        </header>
        <div class="row" data-row="session"></div>
        <div class="row" data-row="weekly"></div>
      </section>

      <section class="card" data-card="agy">
        <header class="header">
          <div class="agy-icon"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
          <div class="header-copy">
            <h1 data-i18n="agy_name"></h1>
          </div>
          <div class="stale" data-agy-stale hidden>
            <span aria-hidden="true">⚠</span>
            <span data-agy-stale-age></span>
            <span class="stale-info" aria-hidden="true">ⓘ
              <span class="stale-tooltip" data-agy-stale-tooltip></span>
            </span>
          </div>
        </header>
        <div class="row" data-row="session"></div>
        <div class="row" data-row="weekly"></div>
      </section>

      <section class="card" data-card="grok" style="--accent: #9b6dff">
        <header class="header">
          <div class="brand-icon" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></div>
          <div class="header-copy"><h1 data-i18n="grok_name">Grok</h1></div>
          <div class="codex-stale" data-grok-stale hidden>
            <span aria-hidden="true">⚠</span><span data-grok-stale-age></span>
            <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-grok-stale-tooltip></span></span>
          </div>
        </header>
        <div class="row" data-row="weekly"></div>
      </section>

      <section class="card projects-card" data-card="projects">
        <header class="header">
          <div class="singularity-badge" aria-hidden="true">O</div>
          <div class="header-copy">
            <h1 data-i18n="projects_title">Project Usage</h1>
          </div>
          <div class="codex-stale" data-history-error hidden>
            <span aria-hidden="true">⚠</span>
            <span data-history-error-text></span>
            <span class="codex-stale-info" aria-hidden="true">ⓘ
              <span class="codex-stale-tooltip" data-history-error-tooltip></span>
            </span>
          </div>
          <button class="range-chip" data-action="toggle-project-range">Today</button>
          <button class="range-chip" data-action="analyze" data-i18n="analyze_usage">Analyze</button>
          <button class="range-chip" data-action="toggle-statusline" data-i18n="cli">CLI</button>
        </header>
        <div data-project-list></div>
      </section>

      <section class="footer">
        <div data-footer="service-alerts" hidden></div>
        <div class="meta">
          <div data-footer="rate">Rate: --</div>
          <div data-footer="status">Status: Loading</div>
        </div>
        <div class="today" data-footer="today">Today: $0.00 (0 tokens)</div>
        <div class="actions">
          <button class="action primary" data-action="refresh" data-i18n="refresh_now">Refresh</button>
          <button class="action" data-action="switch" data-i18n="switch_panel">Switch</button>
          <button class="action" data-action="quit" data-i18n="quit">Quit</button>
          <button class="action" data-action="install" data-i18n="install_hook">Install Hook</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    window.PanelHooks = {
      accentFallback() {
        return "";
      },
      applyFillVisual(fillEl, { available, percent, color }) {
        fillEl.style.setProperty("--value", available ? `${Math.max(0, Math.min(100, percent))}%` : "0%");
        fillEl.style.filter = available && color ? "brightness(1.14)" : "";
      },
      renderProjectRow(project, index) {
        const row = document.createElement("div");
        const topline = document.createElement("div");
        const rank = document.createElement("span");
        const name = document.createElement("span");
        const tokens = document.createElement("span");
        const cost = document.createElement("span");
        row.className = "proj-row";
        topline.className = "proj-topline";
        rank.className = "proj-rank";
        name.className = "proj-name";
        tokens.className = "proj-tokens";
        cost.className = "proj-cost";
        rank.textContent = `${index + 1}`;
        name.textContent = project.name || "";
        tokens.textContent = project.tokensText || "";
        cost.textContent = project.costText || "";
        topline.append(rank, name);
        row.append(topline, tokens, cost);
        return row;
      },
      switchButtonStrategy(state) {
        const button = document.querySelector('[data-switch-relocatable="true"]');
        if (!button) return;
        let host = document.querySelector('[data-card="claude"] .header');
        let className = "switch";
        if (state.hideClaude && !state.hideCodex) {
          host = document.querySelector('[data-card="codex"] .header');
        } else if (state.hideClaude && state.hideCodex && !state.hideAgy) {
          host = document.querySelector('[data-card="agy"] .header');
        } else if (state.hideClaude && state.hideCodex && state.hideAgy && !state.hideGrok) {
          host = document.querySelector('[data-card="grok"] .header');
        }
        if (!host || (state.hideClaude && state.hideCodex && state.hideAgy && state.hideGrok)) {
          host = document.querySelector(".footer .actions");
          className = "action";
        }
        if (!host) return;
        button.className = className;
        button.dataset.switchRelocatable = "true";
        if (button.parentElement !== host) host.appendChild(button);
      },
      pointerdownExcludeSelector: "button, a, .codex-stale-info, .stale-info",
    };

    const canvas = document.querySelector(".space-canvas");
    const ctx = canvas.getContext("2d");
    const stars = [];
    const particles = [];
    const starCount = 120;
    const particleCount = 16;
    const twinkleCount = 8;
    let width = 0;
    let height = 0;
    let pixelRatio = 1;

    function createStars() {
      stars.length = 0;
      for (let i = 0; i < starCount; i += 1) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 0.5 + Math.random(),
          alpha: 0.3 + Math.random() * 0.7,
          phase: Math.random() * Math.PI * 2,
          twinkle: i < twinkleCount,
        });
      }
    }

    function createParticles() {
      particles.length = 0;
      for (let i = 0; i < particleCount; i += 1) {
        particles.push({
          phase: (i / particleCount) * Math.PI * 2,
          speed: 0.0015 + Math.random() * 0.0012,
          size: 1.4 + Math.random() * 1.8,
        });
      }
    }

    function resizeCanvas() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * pixelRatio);
      canvas.height = Math.floor(height * pixelRatio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      createStars();
      if (particles.length === 0) createParticles();
    }

    function drawStars(time) {
      stars.forEach((star) => {
        const wobble = star.twinkle ? Math.sin(time * 0.004 + star.phase) * 0.18 : 0;
        const alpha = Math.max(0.18, Math.min(1, star.alpha + wobble));
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();
      });
    }

    function ellipsePoint(cx, cy, rx, ry, angle, rotation) {
      const x = Math.cos(angle) * rx;
      const y = Math.sin(angle) * ry;
      const cos = Math.cos(rotation);
      const sin = Math.sin(rotation);
      return {
        x: cx + x * cos - y * sin,
        y: cy + x * sin + y * cos,
      };
    }

    function drawDiskHalf(cx, cy, rotation, start, end) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      const gradient = ctx.createLinearGradient(-104, 0, 104, 0);
      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.24, "#ffd060");
      gradient.addColorStop(0.46, "#ff8800");
      gradient.addColorStop(0.72, "#ff4400");
      gradient.addColorStop(0.88, "#aa2200");
      gradient.addColorStop(1, "#330000");
      ctx.beginPath();
      ctx.ellipse(0, 0, 100, 28, 0, start, end);
      ctx.ellipse(0, 0, 52, 14, 0, end, start, true);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.shadowColor = "rgba(255, 130, 0, 0.45)";
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255, 220, 120, 0.24)";
      ctx.stroke();
      ctx.restore();
    }

    function drawEventHorizon(cx, cy) {
      const edge = ctx.createRadialGradient(cx, cy, 28, cx, cy, 58);
      edge.addColorStop(0, "rgba(0, 0, 0, 0)");
      edge.addColorStop(0.58, "rgba(80, 40, 180, 0.5)");
      edge.addColorStop(1, "rgba(80, 40, 180, 0)");
      ctx.beginPath();
      ctx.arc(cx, cy, 58, 0, Math.PI * 2);
      ctx.fillStyle = edge;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, 36, 0, Math.PI * 2);
      ctx.fillStyle = "#000000";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, 38, 0, Math.PI * 2);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(255, 200, 80, 0.7)";
      ctx.stroke();
    }

    function drawParticleStream(cx, cy, rotation, time) {
      particles.forEach((particle) => {
        const base = particle.phase + time * particle.speed;
        for (let i = 3; i >= 0; i -= 1) {
          const point = ellipsePoint(cx, cy, 100, 28, base - i * 0.09, rotation);
          const alpha = (4 - i) * 0.14;
          ctx.beginPath();
          ctx.arc(point.x, point.y, particle.size * (1 - i * 0.12), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, ${150 + i * 18}, 40, ${alpha})`;
          ctx.fill();
        }
      });
    }

    function drawBlackHole(time) {
      const cx = width / 2;
      const cy = height * 0.32;
      const rotation = time * 0.00024;
      const halo = ctx.createRadialGradient(cx, cy, 12, cx, cy, 120);
      halo.addColorStop(0, "rgba(255, 140, 0, 0.25)");
      halo.addColorStop(0.42, "rgba(255, 95, 0, 0.12)");
      halo.addColorStop(1, "rgba(255, 140, 0, 0)");
      ctx.beginPath();
      ctx.arc(cx, cy, 120, 0, Math.PI * 2);
      ctx.fillStyle = halo;
      ctx.fill();

      drawDiskHalf(cx, cy, rotation, 0, Math.PI);
      drawEventHorizon(cx, cy);
      drawDiskHalf(cx, cy, rotation, Math.PI, Math.PI * 2);
      drawParticleStream(cx, cy, rotation, time);
    }

    function animate(time) {
      ctx.clearRect(0, 0, width, height);
      drawStars(time);
      drawBlackHole(time);
      window.requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    window.requestAnimationFrame(animate);
  </script>
  <script>
{{CORE_SCRIPT}}  </script>
</body>
</html>

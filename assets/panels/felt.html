  const PAW = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.2" ry="4.3"/><ellipse cx="5.6" cy="10.4" rx="2.1" ry="2.7"/><ellipse cx="9.6" cy="6.6" rx="2.1" ry="2.8"/><ellipse cx="14.4" cy="6.6" rx="2.1" ry="2.8"/><ellipse cx="18.4" cy="10.4" rx="2.1" ry="2.7"/></svg>';
  const loadList = (key) => {
    try {
      const v = JSON.parse(localStorage.getItem(key) || "[]");
      return Array.isArray(v) ? v.filter((n) => HIDDEN.has(n)) : [];
    } catch {
      return [];
    }
  };
  const saveList = (key, v) => {
    try {
      localStorage.setItem(key, JSON.stringify(v));
    } catch {}
  };
  const seen = loadList("usage-felt-hidden-seen");
  let fresh = loadList("usage-felt-hidden-fresh");
  const el = (tag, cls, text) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, text === undefined ? {} : { textContent: text });
  const dateText = (d) => d.toLocaleDateString(document.documentElement.lang || undefined, { month: "numeric", day: "numeric", weekday: "short" });
  const no = (name) => `No.${String(HIDDEN_ORDER.indexOf(name) + 1).padStart(2, "0")}`;

  function renderBook() {
    book.hidden = !unlocked(HIDDEN_ORDER[0]);
    book.querySelector("span").textContent = `${seen.length}/${HIDDEN_ORDER.length}`;
    book.classList.toggle("fresh", fresh.length > 0);
    book.title = tr("hidden_book");
  }
  function bumpBook() {
    renderBook();
    book.classList.remove("bump");
    void book.offsetWidth;
    book.classList.add("bump");
  }

  const dex = el("div", "pal-dex");
  dex.hidden = true;
  document.body.appendChild(dex);
  function openDex() {
    const now = new Date();
    const card = el("div", "pal-dex-card");
    const close = el("button", "pal-dex-x", "×");
    close.type = "button";
    close.setAttribute("aria-label", tr("hidden_close"));
    const head = el("div", "pal-dex-head");
    head.append(el("h3", "", tr("hidden_book")), el("span", "", tr("hidden_count", { n: seen.length, total: HIDDEN_ORDER.length })));
    const bar = el("div", "pal-dex-bar");
    const fill = el("i");
    fill.style.width = `${(seen.length / HIDDEN_ORDER.length) * 100}%`;
    bar.append(fill);
    const grid = el("div", "pal-dex-grid");
    const next = HIDDEN_ORDER.find((n) => !unlocked(n, now));
    for (const name of HIDDEN_ORDER) {
      const state = !unlocked(name, now) ? "locked" : seen.includes(name) ? "seen" : "nearby";
      const cell = el("div", `pal-dex-cell ${state}`);
      cell.style.setProperty("--tone", TONE[name] || "#e8b86a");
      if (state === "locked") {
        const emblem = el("div", "emblem");
        emblem.innerHTML = PAW;
        cell.append(el("span", "no", no(name)), emblem, el("small", "", tr("hidden_unlocks", { date: dateText(unlockAt(name)) })));
      } else {
        if (fresh.includes(name)) cell.append(el("span", "new", "NEW"));
        const art = el("div", "art");
        const img = el("img");
        img.src = src(name, "stand");
        img.alt = "";
        art.append(img);
        cell.append(el("span", "no", no(name)), art, el("b", "", state === "seen" ? label(name) : "？？？"));
        if (state === "nearby") cell.append(el("small", "", tr("hidden_nearby")));
      }
      if (state === "seen") {
        if (!still) {
          cell.addEventListener("pointermove", (e) => {
            const r = cell.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
            cell.style.setProperty("--mx", `${x * 100}%`);
            cell.style.setProperty("--my", `${y * 100}%`);
            cell.style.transform = `rotateX(${(0.5 - y) * 14}deg) rotateY(${(x - 0.5) * 16}deg) translateZ(6px)`;
          });
          cell.addEventListener("pointerleave", () => { cell.style.transform = ""; });
        }
      }
      grid.append(cell);
    }
    const done = seen.length === HIDDEN_ORDER.length;
    card.classList.toggle("done", done);
    const foot = el("p", "pal-dex-foot", next ? tr("hidden_next", { date: dateText(unlockAt(next)) }) : tr(done ? "hidden_done" : "hidden_all"));
    card.append(close, head, bar, grid, foot);
    dex.replaceChildren(card);
    dex.hidden = false;
    if (fresh.length) {
      fresh = [];
      saveList("usage-felt-hidden-fresh", fresh);
      renderBook();
    }
  }
  book.addEventListener("click", openDex);
  dex.addEventListener("click", (e) => {
    if (e.target === dex || e.target.classList.contains("pal-dex-x")) dex.hidden = true;
  });

  function sparkle(p) {
    for (let i = 0; i < 14; i++) {
      const s = el("i", "pal-spark");
      s.style.setProperty("--a", `${i * (360 / 14)}deg`);
      s.style.setProperty("--d", `${30 + Math.random() * 16}px`);
      p.wrap.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }
  }

  function buildCard(name) {
    const card = el("div", "pal-card");
    card.style.setProperty("--tone", TONE[name] || "#e8b86a");
    const flip = el("div", "flip");
    const back = el("div", "face back");
    const emblem = el("div", "emblem");
    emblem.innerHTML = PAW;
    back.append(emblem, el("span", "brand", "PLUSH PALS"));
    const front = el("div", "face front");
    const top = el("div", "top");
    top.append(el("span", "", no(name)), el("span", "tag", tr("hidden_tag")));
    const art = el("div", "art");
    const img = el("img");
    img.src = src(name, "cheer") || src(name, "stand");
    img.alt = "";
    art.append(img);
    const plate = el("div", "plate");
    plate.append(el("b", "", label(name)), el("small", "", tr("hidden_added")));
    front.append(top, art, plate, el("i", "shine"));
    flip.append(back, front);
    card.append(flip);
    return card;
  }
  async function flyCard(name) {
    const card = buildCard(name);
    document.body.appendChild(card);
    await card.animate([{ transform: "translateY(40px) rotate(-8deg) scale(.6)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 420, easing: "cubic-bezier(.2,1.3,.4,1)", fill: "forwards" }).finished;
    await wait(250);
    card.classList.add("show");
    await wait(2300);
    const r = card.getBoundingClientRect(), t = book.getBoundingClientRect();
    const dx = t.left + t.width / 2 - (r.left + r.width / 2), dy = t.top + t.height / 2 - (r.top + r.height / 2);
    await card.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) scale(.1) rotate(-14deg)`, opacity: 0.3 }],
      { duration: 620, easing: "cubic-bezier(.5,0,.8,.5)", fill: "forwards" }).finished;
    card.remove();
  }

  // Record first, so closing the panel mid-effect never replays the card.
  async function meet(p) {
    if (!HIDDEN.has(p.name) || seen.includes(p.name)) return;
    seen.push(p.name);
    fresh.push(p.name);
    saveList("usage-felt-hidden-seen", seen);
    saveList("usage-felt-hidden-fresh", fresh);
    renderBook();
    if (still || hidden() || book.hidden) return bumpBook();
    while (p.busy) await wait(100);
    if (p.offstage) return bumpBook();
    p.busy = true;
    sparkle(p);
    const card = flyCard(p.name);
    await jump(p, p.x, p.y, 20, { air: "cheer", land: "cheer" });
    await wait(300);
    await jump(p, p.x, p.y, 12, { air: "cheer", land: "cheer" });
    await card;
    pose(p, rest(p));
    idle(p);
    free(p);
    bumpBook();
  }
  renderBook();
  if (guest) setTimeout(() => meet(guest), 2500);

  function pose(p, name) {
    const use = aspect[`${p.name}_${name}`] ? name : "stand";
    p.pose = name;
    const s = src(p.name, use);
    const a = aspect[`${p.name}_${use}`];
    const h = SIZE * (HEIGHT[use] || 1);
    for (const el of [p.img, p.sil]) {
      if (!el.src.endsWith(s)) el.src = s;
      if (a) {
        el.style.height = `${h}px`;
        el.style.width = `${h * a}px`;
        el.style.left = `${(-h * a) / 2}px`;
      }
    }
  }
  // The resting pose for a pal's mood.
  const rest = (p) => (p.mood === "alert" ? "worried" : p.mood === "asleep" ? "sleep" : "stand");
  pals.forEach((p) => pose(p, "stand"));

  // Draw a pal at (x, y) with squash/stretch and tilt; the shadow stays on `ground`.
  function draw(p, x, y, sx = 1, sy = 1, rot = 0, ground = y) {
    p.last = [x, y, sx, sy, rot, ground];
    if (p.bar < 0 && !p.exiting) x = Math.min(x, lineRight);
    // shift moves a pal that is mid-action along with its strip (see settle()).
    p.wrap.style.translate = `${x}px ${y + p.shift}px`;
    p.wrap.style.opacity = p.alpha < 1 ? String(p.alpha) : "";
    p.body.style.transform = `rotate(${rot}deg) scale(${p.face * sx * p.scale}, ${sy * p.scale})`;
    // Keep the cast shadow down-right whichever way the pal faces (the body's scale mirrors it).
    p.sil.style.translate = `${p.face < 0 ? -3 : 3}px 2px`;
    const k = Math.max(0.35, 1 - Math.max(0, ground - y) / 70) * p.scale;
    p.shadow.style.translate = `${x}px ${ground + p.shift}px`;
    p.shadow.style.transform = `scale(${k})`;
    p.shadow.style.opacity = String(k * p.alpha);
  }

  // Run fn(k) for k in [0, 1] over dur ms. Idle CSS animation pauses while a pal is being animated.
  const play = (dur, fn, p, cancelled) =>
    new Promise((done) => {
      if (p) p.body.classList.remove("idle", "dozing");
      const t0 = performance.now();
      const tick = (now) => {
        if (cancelled?.()) return done();
        const k = Math.min(1, (now - t0) / dur);
        fn(k);
        if (k < 1) requestAnimationFrame(tick);
        else done();
      };
      requestAnimationFrame(tick);
    });

  function idle(p) {
    if (still) {
      p.body.classList.remove("idle", "dozing");
      return;
    }
    p.body.classList.toggle("idle", p.mood !== "asleep");
    p.body.classList.toggle("dozing", p.mood === "asleep");
  }

  // Turn to face `dir` by squeezing through edge-on instead of snapping.
  async function turn(p, dir) {
    if (p.face === dir) return;
    const from = p.face;
    await play(180, (k) => {
      p.face = lerp(from, dir, ease(k)) || 0.001;
      draw(p, p.x, p.y);
    }, p);
    p.face = dir;
  }

  function puff(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      const d = Object.assign(document.createElement("div"), { className: "pal-dust" });
      const side = i % 2 ? 1 : -1;
      const up = colors ? -rand(14, 34) : -6;
      d.style.cssText = `left:${x + side * rand(4, 10)}px;top:${y - (colors ? 20 : 2)}px;` +
        `--dx:${side * rand(6, colors ? 26 : 14)}px;--dy:${up}px` + (colors ? `;background:${colors[i % colors.length]}` : "");
      layer.appendChild(d);
      setTimeout(() => d.remove(), 600);
    }
  }

  async function jump(p, tx, ty, height, { flip = false, scale = p.scale, air = "jump", land, alpha, landSquash = true } = {}) {
    const x0 = p.x, y0 = p.y, s0 = p.scale, a0 = p.alpha;
    // A hop within the line stays inside the felt strip, so a pal never pops out over the footer card.
    if (p.bar < 0 && Math.abs(ty - y0) < 2) {
      const top = toLocal(lineEl.getBoundingClientRect()).top;
      height = Math.min(height, Math.max(0, y0 + p.shift - SIZE * p.scale * 1.06 - top - 4));
    }
    if (Math.abs(tx - x0) > 2) await turn(p, tx > x0 ? 1 : -1);
    // Crouch, deeper before a big jump.
    const crouch = height > 20 ? 0.28 : 0.18;
    await play(height > 20 ? 170 : 110, (k) => {
      const e = Math.sin((k * Math.PI) / 2);
      draw(p, x0, y0, 1 + crouch * 0.7 * e, 1 - crouch * e);
    }, p);
    // Flight: x linear in time, y a parabola, stretched when fast and level at the apex; big leaps somersault.
    const apex = Math.min(y0, ty) - height;
    pose(p, air);
    await play(Math.min(1400, 280 + Math.hypot(tx - x0, ty - y0) * 0.95 + height * 4), (k) => {
      const y = (1 - k) * (1 - k) * y0 + 2 * (1 - k) * k * apex + k * k * ty;
      const v = Math.abs(1 - 2 * k);
      const spin = flip ? p.face * 360 * ease(k) : 0;
      p.scale = lerp(s0, scale, k);
      if (alpha !== undefined) p.alpha = lerp(a0, alpha, k);
      draw(p, lerp(x0, tx, k), y, 1 - 0.08 * v, 1 + 0.14 * v, spin + p.face * 9 * (1 - 2 * k), k < 0.5 ? y0 : ty);
    }, p);
    pose(p, land || rest(p));
    p.x = tx;
    p.y = ty;
    p.scale = scale;
    if (alpha !== undefined) p.alpha = alpha;
    if (height >= 9) puff(tx, ty, height > 20 ? 4 : 2);
    // Land: damped squash.
    if (landSquash) {
      await play(460, (k) => {
        const d = Math.exp(-5 * k) * Math.cos(k * 14);
        draw(p, tx, ty, 1 + 0.2 * d, 1 - 0.24 * d);
      }, p);
    }
    idle(p);
  }

  // The rider's mood follows its bar: calm, alert at the warning line, asleep when the quota is gone.
  function moodOf(p) {
    if (p.bar < 0) return "calm";
    return p.pct >= 1 ? "asleep" : p.pct >= WARN ? "alert" : "calm";
  }

  function setMood(p) {
    const was = p.mood;
    p.mood = moodOf(p);
    p.badge.classList.toggle("on", p.mood === "alert");
    p.zs.forEach((z) => z.classList.toggle("on", p.mood === "asleep"));
    return was !== p.mood;
  }

  function bubble(p, cls, text, bottom, left) {
    const el = Object.assign(document.createElement("div"), { className: cls, textContent: text });
    el.style.bottom = `${bottom}px`;
    el.style.left = `${left}px`;
    p.wrap.appendChild(el);
    return el;
  }

  // Queue service alerts, quota warnings and resets, tool suggestions, records, greetings, and rare events.
  // say() draws only the line selected by the queue. New riders wait two seconds before speaking.
  const PRIORITY = {
    outage: 5, fixed: 5, out: 4, soon: 4, reset: 4, pace: 3, switch: 3, warn: 3,
    record: 2, hello: 1, late: 1, xmas: 1, chat_a: 0, chat_b: 0, nap: 0,
  };
  const SPEECH_GAP = 400;
  const QUIET_TIME = 2000;
  const lastLine = {};
  const speech = [];
  let speaking = null;
  let nameBubble = null;
  let speechTimer;
  let speechReadyAt = 0;
  let pausedAt = hidden() ? performance.now() : null;
  let hiddenTime = 0;
  const speechTime = () => (pausedAt ?? performance.now()) - hiddenTime;

  function say(p, { event, text }) {
    if (typeof text === "function") text = text();
    if (text === undefined) {
      const variants = [1, 2, 3].filter((i) => i !== lastLine[event]);
      const i = variants[Math.floor(Math.random() * variants.length)];
      text = tr(`say_${event}_${i}`);
      if (!text) return null;
      lastLine[event] = i;
    }
    if (!text) return null;
    const el = bubble(p, "pal-say", text, SIZE * p.scale + (p.mood === "alert" ? 26 : 9), 0);
    p.wrap.style.zIndex = "3";
    // Keep the bubble inside the panel; the tail still points at the pal.
    const origin = localOrigin();
    const r = toLocal(el.getBoundingClientRect(), origin);
    const mid = (r.left + r.right) / 2, w = el.offsetWidth;
    const minX = -origin.left / origin.zoom + 6;
    const maxX = (innerWidth - origin.left) / origin.zoom - 6;
    const shift = clamp(0, minX - (mid - w / 2), maxX - (mid + w / 2));
    el.style.marginLeft = `${shift}px`;
    el.style.setProperty("--tail", `${-shift}px`);
    return el;
  }

  function speak({ ttl = 20000, ...request }) {
    const same = (item) => item?.event === request.event && item.card === request.card;
    if (same(speaking?.item) || speech.some(same)) return;
    speech.push({ ...request, ttl, expires: speechTime() + ttl });
    schedule();
  }

  function endSpeech(finished = false, requeue = true) {
    const { item, p, el } = speaking;
    speaking = null;
    el.remove();
    p.wrap.style.zIndex = "1";
    speechReadyAt = speechTime() + SPEECH_GAP;
    if (finished) item.onFinished?.();
    else if (requeue && PRIORITY[item.event] >= 3 && !item.replayed) {
      speech.unshift({ ...item, replayed: true, expires: speechTime() + item.ttl });
    }
  }

  function riderFor(card, b) {
    // Compact layout may move the rider between rows while it is still busy on the same card.
    const session = quotaKey(card, "session"), weekly = quotaKey(card, "weekly");
    return pals.find((p) => b[p.bar]?.card === card && (p.key === session || p.key === weekly));
  }

  function playSpeech(b) {
    clearTimeout(speechTimer);
    if (hidden()) return;
    const now = speechTime();
    if (speaking && now >= speaking.until) endSpeech(true);
    if (speaking?.item.valid && !speaking.item.valid()) endSpeech(false, false);
    if (speaking?.p.offstage) endSpeech(false, false);
    if (speaking?.item.card && riderFor(speaking.item.card, b) !== speaking.p) endSpeech();

    let next = Infinity;
    let item;
    let p;
    for (let i = 0; i < speech.length;) {
      const queued = speech[i];
      if (queued.expires <= now) {
        speech.splice(i, 1);
        continue;
      }
      const target = queued.card ? riderFor(queued.card, b)
        : (queued.queue ? queue.find((o) => !o.busy) : null) || queued.speaker?.();
      if (target && queued.valid && !queued.valid()) {
        speech.splice(i, 1);
        continue;
      }
      next = Math.min(next, queued.expires);
      if (target && (!item || PRIORITY[queued.event] > PRIORITY[item.event])) {
        item = queued;
        p = target;
      }
      i++;
    }

    if (item && !nameBubble && (!speaking || PRIORITY[item.event] > PRIORITY[speaking.item.event])) {
      const readyAt = Math.max(speechReadyAt, now + p.since + QUIET_TIME - performance.now());
      if (now < readyAt) next = Math.min(next, readyAt);
      else if (speaking) {
        endSpeech();
        next = Math.min(next, speechReadyAt);
      } else {
        speech.splice(speech.indexOf(item), 1);
        const el = say(p, item);
        if (el) {
          speaking = { item, p, el, until: now + 3600 };
          item.onShown?.();
          item.onShown = undefined;
          if (!still && !p.busy) item.motion?.(p);
        } else schedule();
      }
    }
    if (speaking) next = Math.min(next, speaking.until);
    if (Number.isFinite(next)) speechTimer = setTimeout(schedule, Math.max(1, next - now));
  }

  // Alert: startle on crossing the line, then keep signalling with quick hops and a shake. Returns true when handled.
  async function react(p, bar) {
    const fresh = setMood(p);
    if (p.mood === "asleep") {
      if (fresh) {
        // Settle down for a nap.
        await play(380, (k) => draw(p, p.x, p.y, 1 + 0.12 * Math.sin(k * Math.PI), 1 - 0.16 * Math.sin(k * Math.PI)), p);
        pose(p, "sleep");
        idle(p);
      }
      return true;
    }
    if (p.mood !== "alert") return false;
    await turn(p, 1);
    if (fresh) {
      // The whole line hops in surprise.
      queue.filter((o) => !o.busy).forEach((o, i) => {
        o.busy = true;
        wait(i * 60).then(() => jump(o, o.x, o.y, 12)).then(() => free(o));
      });
      await jump(p, bar.x, bar.y, 30, { flip: true });
    }
    await jump(p, bar.x, bar.y, 9);
    await jump(p, bar.x, bar.y, 9);
    await play(600, (k) => draw(p, bar.x, bar.y, 1, 1, Math.sin(k * Math.PI * 6) * 13 * (1 - k)), p);
    pose(p, rest(p));
    idle(p);
    return true;
  }

  function wave() {
    return Promise.all(queue.filter((o) => !o.busy).map((o, i) => {
      o.busy = true;
      return wait(150 + i * 90)
        .then(() => jump(o, o.x, o.y, 16, { air: "cheer", land: "cheer" }))
        .then(() => wait(500))
        .then(() => {
          pose(o, "stand");
          free(o);
        });
    }));
  }

  // Quota reset: the rider wakes and cheers with confetti, and the line cheers in a wave.
  async function celebrate(p, bar) {
    setMood(p);
    await turn(p, 1);
    puff(bar.x, bar.y, 10, CONFETTI);
    const line = wave();
    await jump(p, bar.x, bar.y, 28, { flip: true, air: "cheer", land: "cheer" });
    await jump(p, bar.x, bar.y, 18, { air: "cheer", land: "cheer" });
    await wait(700);
    pose(p, rest(p));
    await line;
  }

  // Click: cheer, hop and say its name.
  async function poke(p) {
    if (p.busy) return;
    if (speaking) endSpeech();
    nameBubble?.remove();
    const name = bubble(p, "pal-name", label(p.name), SIZE * p.scale + 6, 0);
    nameBubble = name;
    setTimeout(() => {
      if (nameBubble !== name) return;
      name.remove();
      nameBubble = null;
      speechReadyAt = speechTime() + SPEECH_GAP;
      schedule();
    }, 1900);
    if (still) return;
    p.busy = true;
    if (p.mood !== "asleep") {
      const heart = bubble(p, "pal-heart", "♥", SIZE * p.scale + 24, -9);
      setTimeout(() => heart.remove(), 1900);
      await jump(p, p.x, p.y, 14, { air: "cheer", land: "cheer" });
      await wait(450);
      pose(p, rest(p));
    } else {
      // A dozing pal only stirs.
      await play(420, (k) => draw(p, p.x, p.y, 1, 1, Math.sin(k * Math.PI * 4) * 5 * (1 - k)), p);
    }
    idle(p);
    free(p);
  }

  // A pal in line turns to its neighbour, both hop, and a heart pops up.
  async function greet(p) {
    const i = queue.indexOf(p);
    const mate = [queue[i - 1], queue[i + 1]].find((o) => o && !o.busy);
    if (!mate) return;
    mate.busy = true;
    const dir = mate.x > p.x ? 1 : -1;
    await Promise.all([turn(p, dir), turn(mate, -dir)]);
    const heart = bubble(p, "pal-heart", "♥", SIZE * p.scale + 2, dir * 12 - 9);
    setTimeout(() => heart.remove(), 1900);
    await Promise.all([jump(p, p.x, p.y, 10), jump(mate, mate.x, mate.y, 10)]);
    const waving = [p, mate].filter((o) => has(o, "wave"));
    waving.forEach((o) => pose(o, "wave"));
    await wait(waving.length ? 900 : 500);
    waving.forEach((o) => pose(o, rest(o)));
    await Promise.all([turn(p, -1), turn(mate, -1)]);
    idle(p);
    idle(mate);
    free(mate);
  }

  async function act(p) {
    if (p.bar >= 0) {
      // Rider: lively when there is quota left, sluggish near the limit.
      const bar = bars()[p.bar];
      if (bar?.key !== p.key) return;
      p.pct = bar.pct;
      if (await react(p, bar)) return;
      if (Math.random() < 0.4) await turn(p, -p.face);
      const h = lerp(16, 5, bar.pct / WARN);
      await jump(p, bar.x, bar.y, h);
      if (bar.pct < 0.4 && Math.random() < 0.5) await jump(p, bar.x, bar.y, h * 0.6);
      return;
    }
    // In line: hop on the spot, glance back, or greet a neighbour; always face the front again.
    if (has(p, "signature") && Math.random() < 0.25) return signature(p);
    const roll = Math.random();
    if (roll < 0.4) return jump(p, p.x, p.y, rand(7, 13));
    if (roll < 0.7) {
      await turn(p, 1);
      await wait(rand(500, 1100));
      await turn(p, -1);
      return idle(p);
    }
    return greet(p);
  }

  // Hop every pal in line that is off its slot into place, front first.
  let closing = false;
  async function closeUp() {
    if (closing) return;
    closing = true;
    const moves = queue.map((p, i) => [p, slot(i)]).filter(([p, s]) => !p.busy && Math.abs(p.x - s.x) > 1);
    await Promise.all(moves.map(([p, s], k) => {
      p.busy = true;
      return wait(k * 90)
        .then(() => jump(p, s.x, s.y, 10))
        .then(() => turn(p, -1))
        .then(() => {
          idle(p);
          p.busy = false;
        });
    }));
    closing = false;
    schedule();
  }

  function toOffstage(p) {
    stopPalLoop(p);
    stopHurry(p);
    if (speaking?.p === p) endSpeech(false, false);
    if (nameBubble && nameBubble.parentElement === p.wrap) {
      nameBubble.remove();
      nameBubble = null;
    }
    p.offstage = true;
    p.exiting = false;
    p.alpha = 1;
    p.body.classList.remove("idle", "dozing");
    p.wrap.style.display = "none";
    p.shadow.style.display = "none";
    p.wrap.style.opacity = "";
    p.shadow.style.opacity = "";
  }

  function fromOffstage(p, ground) {
    p.offstage = false;
    p.exiting = false;
    p.alpha = 1;
    p.bar = -1;
    p.mood = "calm";
    p.scale = QUEUE_SCALE;
    p.face = -1;
    pose(p, "stand");
    p.wrap.style.display = "";
    p.shadow.style.display = "";
    p.wrap.style.opacity = "";
    if (p.x) p.y = ground;
    if (motionActive() && !p.loopTimer) loop(p);
  }

  // Shift change: the front of the line takes over a bar, the longest-serving rider goes to the back, the line moves up.
  async function swap() {
    const b = bars();
    // A rider at the warning line stays put so the signal is not lost in a shift change.
    const riders = pals.filter((p) => p.bar >= 0 && (!p.busy || p.hurry?.moving)
      && b[p.bar]?.key === p.key && b[p.bar].pct < WARN);
    const fresh = queue[0];
    if (rotating || !riders.length || !fresh || fresh.busy) return;
    const rider = riders.reduce((a, c) => (c.since < a.since ? c : a));
    const i = rider.bar;
    stopHurry(rider);
    rider.busy = fresh.busy = true;
    // Hand the bar over in one step, so settle() never sees it empty and sends another pal.
    queue.shift();
    queue.push(rider);
    fresh.y += fresh.shift;
    fresh.shift = 0;
    fresh.bar = i;
    fresh.key = b[i].key;
    fresh.pct = fresh.seen = b[i].pct;
    fresh.since = performance.now();
    rider.bar = -1;
    setMood(rider);
    setMood(fresh);
    const back = slot(queue.length - 1);
    await Promise.all([
      jump(fresh, b[i].x, b[i].y, 30, { flip: true, scale: 1 }),
      wait(250).then(() => jump(rider, back.x, back.y, 30, { scale: QUEUE_SCALE })),
    ]);
    fresh.busy = false;
    await turn(rider, -1);
    idle(rider);
    free(rider);
    await closeUp();
  }

  // Line rotation: the back pal hops offstage to the right and the longest-waiting offstage pal takes its place.
  let rotating = false;
  async function rotate() {
    for (const p of pals) {
      if (HIDDEN.has(p.name) && p.offstage && !vault.includes(p) && unlocked(p.name)) vault.push(p);
    }
    if (rotating || !(offstage.length || vault.length) || !queue.length) return;
    const out = queue[queue.length - 1];
    const incoming = vault.length && Math.random() < RARE ? vault[Math.floor(Math.random() * vault.length)] : offstage[0];
    if (!out || out.busy || speaking?.p === out || !incoming || incoming.busy) return;
    rotating = true;
    out.busy = true;
    incoming.busy = true;
    const offX = lineMetrics().r.right + SIZE * 0.75;

    stopPalLoop(out);
    out.exiting = true;
    const outMid = (out.x + offX) / 2;
    await jump(out, outMid, out.y, 8, { alpha: 0.5 });
    await jump(out, offX, out.y, 8, { alpha: 0, landSquash: false });
    const outIdx = queue.indexOf(out);
    if (outIdx >= 0) queue.splice(outIdx, 1);
    toOffstage(out);
    park(out);
    out.busy = false;

    for (const list of [offstage, vault]) {
      const inIdx = list.indexOf(incoming);
      if (inIdx >= 0) list.splice(inIdx, 1);
    }
    const ground = slot(0).y;
    if (queue.length >= lineCap()) {
      if (HIDDEN.has(incoming.name)) vault.push(incoming);
      else offstage.unshift(incoming);
      incoming.busy = false;
      rotating = false;
      schedule();
      return;
    }
    fromOffstage(incoming, ground);
    queue.push(incoming);
    if (still) {
      incoming.x = slot(queue.length - 1).x;
      incoming.y = ground;
      draw(incoming, incoming.x, incoming.y);
      rotating = false;
      free(incoming);
      meet(incoming);
      return;
    }
    incoming.x = offX;
    incoming.y = ground;
    incoming.alpha = 0;
    incoming.exiting = true;
    draw(incoming, incoming.x, incoming.y);
    const slotX = () => {
      const idx = queue.indexOf(incoming);
      return idx >= 0 ? slot(idx).x : offX;
    };
    const inMid = (offX + slotX()) / 2;
    await jump(incoming, inMid, incoming.y, 8, { alpha: 0.55 });
    await jump(incoming, slotX(), incoming.y, 8, { alpha: 1 });
    incoming.exiting = false;
    incoming.alpha = 1;
    draw(incoming, incoming.x, incoming.y);

    const heart = bubble(incoming, "pal-heart", "♥", SIZE * incoming.scale + 2, -9);
    setTimeout(() => heart.remove(), 1900);

    rotating = false;
    free(incoming);
    meet(incoming);
  }
  window.__feltRotate = () => rotate();

  function settle() {
    const b = bars();
    const { r, w } = lineMetrics();
    const cap = lineCap(w);
    lineRight = treeSpace ? r.right - treeSpace - 30 : Infinity;
    const ground = r.bottom - LINE_GROUND;
    const moved = lineY === null ? 0 : ground - lineY;
    lineY = ground;
    // One rider per bar: extras rejoin the line, empty bars (bars appear once the data renders) take the front.
    b.forEach((_, i) => {
      const on = pals.filter((p) => p.bar === i);
      on.slice(1).filter((p) => !p.busy).forEach((p) => {
        stopHurry(p);
        p.bar = -1;
        setMood(p);
        queue.push(p);
      });
      if (on.length) return;
      const p = queue.find((o) => !o.busy);
      if (!p) return;
      queue.splice(queue.indexOf(p), 1);
      p.bar = i;
      p.key = b[i].key;
      p.pct = p.seen = b[i].pct;
      p.since = performance.now();
      if (!p.x || still) {
        p.scale = 1;
        return;
      }
      p.busy = true;
      jump(p, b[i].x, b[i].y, 30, { flip: true, scale: 1 }).then(() => free(p));
    });
    for (const p of pals) {
      if (p.hurry && b[p.bar]?.key !== p.key) stopHurry(p);
      if (p.bar >= 0 && !b[p.bar]) p.bar = -1;
      if (p.bar < 0 && !p.offstage && !queue.includes(p)) queue.push(p);
    }
    // Keep the waiting line within cap so pals never crowd tighter than SIZE * 0.95.
    for (let i = queue.length - 1; queue.length > cap && i >= 0; i--) {
      if (queue[i].busy) continue;
      const [p] = queue.splice(i, 1);
      toOffstage(p);
      park(p);
    }
    while (queue.length < cap && offstage.length) {
      const p = offstage.find((o) => !o.busy);
      if (!p) break;
      offstage.splice(offstage.indexOf(p), 1);
      fromOffstage(p, ground);
      queue.push(p);
    }
    for (const p of pals) {
      if (p.offstage) continue;
      if (p.busy) {
        // A pal busy hopping in line, or on its way back to it, finishes its action but moves as far as the line
        // moved: the footer grew or shrank, or the panel was first laid out, which can move it hundreds of pixels.
        if (p.bar < 0 && Math.abs(moved) > 1) {
          p.shift += moved;
          // Redraw now: during a pause in its action nothing else would.
          if (p.last) draw(p, ...p.last);
        }
        continue;
      }
      p.y += p.shift;
      p.shift = 0;
      if (p.bar >= 0) {
        const bar = b[p.bar];
        // The bar now shows another card or quota: take its reading as the new baseline, without celebrating or talking.
        if (bar.key !== p.key) {
          p.key = bar.key;
          p.seen = bar.pct;
          p.since = performance.now();
        }
        // p.seen is only written here, so an action that already read the new value cannot hide a crossing.
        const before = p.seen;
        p.pct = p.seen = bar.pct;
        // Quota came back (a reset, or relief from the limit).
        const back = quotaReturned(before, bar.pct);
        if (!still && p.x) {
          if (back) {
            p.busy = true;
            celebrate(p, bar).then(() => free(p));
            continue;
          }
          // The tip moved (new data or a resize): hop there rather than jump-cut.
          if (Math.hypot(bar.x - p.x, bar.y - p.y) > 2) {
            p.busy = true;
            jump(p, bar.x, bar.y, 8).then(() => free(p));
            continue;
          }
          // Crossed into another mood: react now rather than at the next action.
          if (moodOf(p) !== p.mood) {
            p.busy = true;
            act(p).then(() => free(p));
            continue;
          }
        }
        p.x = bar.x;
        p.y = bar.y;
        p.scale = 1;
        if (still) {
          setMood(p);
          pose(p, rest(p));
        }
      } else {
        if (p.mood !== "calm") {
          setMood(p);
          pose(p, "stand");
        }
        p.scale = QUEUE_SCALE;
        const s = slot(queue.indexOf(p));
        // Snap only on first placement or after a layout change; normal moves hop via closeUp().
        if (still || !p.x || Math.abs(p.y - s.y) > 1) p.x = s.x;
        p.y = s.y;
      }
      draw(p, p.x, p.y);
    }
    if (!still && queue.some((p, i) => !p.busy && Math.abs(p.x - slot(i).x) > 1)) closeUp();
    checkSoon(b);
    playSpeech(b);
  }

  // A pal finished moving: re-check its place, since layout changes during a move are skipped.
  function free(p) {
    p.busy = false;
    schedule();
  }

  // Re-place only when the data or the layout changes; coalesce bursts into one frame.
  let pending = false;
  const schedule = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      settle();
    });
  };

  const motionActive = () => !hidden() && !still;
  let shiftTimer = null;
  let rotateTimer = null;

  function stopPalLoop(p) {
    clearTimeout(p.loopTimer);
    p.loopTimer = null;
  }

  function loop(p) {
    stopPalLoop(p);
    if (!motionActive() || p.offstage) return;
    const ms = p.mood === "alert" ? 2600 : p.bar >= 0 ? lerp(1200, 5200, Math.min(p.pct, WARN)) : rand(3000, 7000);
    p.loopTimer = setTimeout(async () => {
      p.loopTimer = null;
      if (!motionActive() || p.offstage) return;
      if (!p.busy) {
        p.busy = true;
        await act(p);
        free(p);
      }
      loop(p);
    }, ms * rand(0.8, 1.2));
  }

  function shifts() {
    clearTimeout(shiftTimer);
    shiftTimer = null;
    if (!motionActive()) return;
    shiftTimer = setTimeout(async () => {
      shiftTimer = null;
      if (!motionActive()) return;
      await swap();
      shifts();
    }, rand(20000, 40000));
  }

  function rotations() {
    clearTimeout(rotateTimer);
    rotateTimer = null;
    if (!motionActive()) return;
    rotateTimer = setTimeout(async () => {
      rotateTimer = null;
      if (!motionActive()) return;
      await rotate();
      rotations();
    }, rand(150000, 300000));
  }

  function startMotion() {
    if (!motionActive()) return;
    pals.forEach((p, i) => {
      if (p.offstage || p.loopTimer) return;
      p.loopTimer = setTimeout(() => {
        p.loopTimer = null;
        loop(p);
      }, i * 350);
    });
    if (!shiftTimer) shifts();
    if (!rotateTimer) rotations();
  }

  function stopMotion() {
    clearTimeout(shiftTimer);
    shiftTimer = null;
    clearTimeout(rotateTimer);
    rotateTimer = null;
    pals.forEach(stopPalLoop);
  }

  let latest = null;
  const previousAlerts = new Map();
  let previousToday = null;
  let previousVisible = new Set();
  const wakeNoted = new Map();
  const previousQuotas = new Map();
  const paceNoted = new Map();
  const switchNoted = new Map();
  const quotaNames = (id) => latest?.[id]?.weeklyOnly ? ["weekly"] : ["session", "weekly"];
  const quotaKey = (id, name = "") => `${id}/${name}/${latest?.[id]?.groupName ?? ""}`;
  const quotaRows = (id) => quotaNames(id).map((name) => latest?.[id]?.[name]).filter(Boolean);
  const available = (row) => row?.available === true && Number.isFinite(row.percent);
  const readQuota = (id, name) => {
    const row = latest?.[id]?.[name];
    return available(row) ? row : undefined;
  };
  const quotaShare = (rows) => Math.max(0, ...rows.map((row) => row?.percent ?? 0)) / 100;
  const cardShare = (id) => quotaShare(quotaNames(id).map((name) => previousQuotas.get(quotaKey(id, name))));
  const quotaReturned = (before, after) => (before >= 0.5 && after <= before - 0.3) || (before >= 1 && after < 1);
  const hasWarning = (rows) => rows.some((row) => row?.warning === true);

  function observeQuotas(card, remainedVisible) {
    const names = quotaNames(card);
    const group = quotaKey(card);
    const current = () => names.map((name) => readQuota(card, name));
    const rows = current();
    // Missing readings keep their last values. The first valid reading for each row is a baseline.
    const beforeRows = names.map((name, i) => {
      const key = quotaKey(card, name);
      const before = previousQuotas.get(key) ?? rows[i];
      if (rows[i]) previousQuotas.set(key, rows[i]);
      return before;
    });
    const before = quotaShare(beforeRows);
    const pct = cardShare(card);
    const sameGroup = () => quotaKey(card) === group;
    if (!hasWarning(beforeRows) && hasWarning(rows) && pct < 1 && !recent(paceNoted, card, 30000)) {
      quotaSpeech("pace", card, () => sameGroup() && hasWarning(current()) && cardShare(card) < 1, {
        text: () => paceText(card), motion: hurry, onShown: () => paceNoted.set(card, Date.now()),
      });
    }
    if (!remainedVisible) return;
    if (quotaReturned(before, pct)) {
      // A missing reading cannot confirm the drop that caused this reminder.
      speak({ event: "reset", card, valid: () => sameGroup() && quotaReturned(before, cardShare(card))
        && quotaReturned(before, quotaShare(current().map((row, i) => row ?? beforeRows[i]))) });
    } else if (before < 1 && pct >= 1) {
      quotaSpeech("out", card, () => sameGroup() && quotaShare(current()) >= 1);
    } else if (before < WARN && pct >= WARN) {
      quotaSpeech("warn", card, () => sameGroup() && quotaShare(current()) >= WARN && cardShare(card) < 1);
    }
  }

  function switchText(card) {
    let best = 50;
    let tool = "";
    for (const el of visibleCards()) {
      const id = el.dataset.card;
      if (id === card) continue;
      const rows = quotaRows(id);
      if (!rows.length || !rows.every(available)) continue;
      const used = Math.max(...rows.map((row) => row.percent));
      const name = el.querySelector(".brand h1")?.textContent.trim();
      if (used >= best || !name) continue;
      best = used;
      tool = name;
    }
    return tool ? tr("say_switch", { tool }) : "";
  }

  function recent(times, key, ms) {
    return Date.now() - (times.get(key) ?? -Infinity) < ms;
  }

  function quotaSpeech(event, card, valid, { text, motion, onShown } = {}) {
    const canSuggest = () => !recent(switchNoted, card, 30 * 60 * 1000);
    speak({ event, card, valid, text, motion, onShown: () => {
      onShown?.();
      if (canSuggest() && switchText(card)) {
        let shown = false;
        speak({ event: "switch", card,
          valid: () => valid() && (shown || canSuggest()) && !!switchText(card),
          text: () => switchText(card),
          onShown: () => {
            shown = true;
            switchNoted.set(card, Date.now());
          },
        });
      }
    } });
  }

  function paceText(card) {
    const rows = quotaRows(card).filter((row) => available(row) && row.warning === true);
    if (!rows.length) return undefined;
    const seconds = (row) => Number.isFinite(row.emptyAt) ? row.emptyAt - Date.now() / 1000 : Infinity;
    const chosen = rows.reduce((best, row) => seconds(row) < seconds(best) ? row : best);
    return chosen.emptyText ? tr("say_pace_time", { time: chosen.emptyText }) || undefined : undefined;
  }

  // A pal with its own signature move strikes it for a moment, then settles back.
  async function signature(p) {
    pose(p, "signature");
    await play(500, (k) => {
      const s = Math.sin(Math.PI * k);
      draw(p, p.x, p.y, 1 + 0.05 * s, 1 - 0.05 * s);
    }, p);
    await wait(rand(1400, 2200));
    pose(p, rest(p));
    idle(p);
  }

  async function startle(p) {
    p.busy = true;
    await jump(p, p.x, p.y, 14, { air: has(p, "surprised") ? "surprised" : "jump" });
    free(p);
  }

  async function stretch(p) {
    p.busy = true;
    pose(p, has(p, "stretch") ? "stretch" : "stand");
    await play(600, (k) => {
      const s = Math.sin(2 * Math.PI * k) * Math.sin(Math.PI * k);
      draw(p, p.x, p.y, 1 - 0.07 * s, 1 + 0.12 * s);
    }, p);
    pose(p, rest(p));
    idle(p);
    free(p);
  }

  // Burning too fast: quick little steps on the spot, with a drop of sweat sliding off.
  function stopHurry(p) {
    const action = p.hurry;
    if (!action) return;
    p.hurry = null;
    action.sweat.remove();
    if (action.moving) {
      pose(p, rest(p));
      idle(p);
      free(p);
    }
  }

  async function hurry(p) {
    stopHurry(p);
    p.busy = true;
    const sweat = document.createElement("div");
    sweat.className = "pal-sweat";
    sweat.style.left = "10px";
    sweat.style.bottom = `${SIZE * p.scale + 2}px`;
    p.wrap.appendChild(sweat);
    const action = { sweat, moving: true };
    const cancelled = () => p.hurry !== action;
    p.hurry = action;
    if (has(p, "run")) pose(p, "run");
    setTimeout(() => {
      sweat.remove();
      if (!cancelled() && !action.moving) p.hurry = null;
    }, 1200);
    await play(900, (k) => {
      draw(p, p.x + Math.sin(k * Math.PI * 6) * 3, p.y - Math.abs(Math.sin(k * Math.PI * 3)) * 3);
    }, p, cancelled);
    if (cancelled()) return;
    action.moving = false;
    if (!sweat.parentElement) p.hurry = null;
    pose(p, rest(p));
    idle(p);
    free(p);
  }

  // Local calendar day (YYYY-MM-DD), and whether it is the small hours.
  const dayKey = (d = new Date()) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const isLate = (d = new Date()) => d.getHours() < 5;
  const storedDay = (key) => {
    try {
      return localStorage.getItem(key) || "";
    } catch {
      return "";
    }
  };
  const storeDay = (key, day) => {
    try {
      localStorage.setItem(key, day);
    } catch {}
  };
  let helloDay = storedDay("usage-felt-hello");
  let lateDay = storedDay("usage-felt-late");
  let rareDay = storedDay("usage-felt-rare");
  let greetingTimer = null;
  let visitReady = false;
  let lateOfferedDay = "";

  function checkLate(now = new Date()) {
    if (hidden() || !visitReady || !isLate(now)) return false;
    const tonight = dayKey(now);
    if (lateDay === tonight) return false;
    if (lateOfferedDay === tonight) return true;
    lateOfferedDay = tonight;
    // Showing the line marks the night as done; `shown` keeps that from cutting this bubble short.
    let shown = false;
    speak({ event: "late", queue: true, visit: true,
      speaker: () => pals.find((o) => o.bar >= 0 && !o.busy && o.mood !== "asleep"),
      valid: () => isLate() && dayKey() === tonight && (shown || lateDay !== tonight),
      onShown: () => {
        shown = true;
        lateDay = tonight;
        storeDay("usage-felt-late", tonight);
      },
      motion: stretch,
    });
    return true;
  }

  async function helloHop(front) {
    front.busy = true;
    await jump(front, front.x, front.y, 16, { air: "cheer", land: "cheer" });
    await wait(500);
    pose(front, "stand");
    free(front);
  }

  async function nap(p, sleeper) {
    const before = sleeper.pose;
    sleeper.busy = true;
    pose(sleeper, "sleep");
    startle(p);
    await wait(4000);
    pose(sleeper, before);
    free(sleeper);
  }

  function checkRare(today) {
    if (rareDay === today || speaking || nameBubble || speech.length
      || queue.filter((p) => !p.busy).length < 3 || Math.random() >= 1 / 6) return;
    const pairs = queue.slice(0, -1).map((p, i) => [p, queue[i + 1]])
      .filter(([p, mate]) => !p.busy && !mate.busy);
    if (!pairs.length) return;
    const [first, second] = pairs[Math.floor(Math.random() * pairs.length)];
    const variant = Math.floor(Math.random() * 3) + 1;
    const nearby = () => {
      const i = queue.indexOf(first);
      return dayKey() === today && i >= 0 && queue[i + 1] === second;
    };
    const ready = () => !first.busy && !second.busy;
    const onShown = () => {
      rareDay = today;
      storeDay("usage-felt-rare", today);
    };
    if (Math.random() < 0.5) {
      speak({ event: "chat_a", visit: true, text: tr(`say_chat_a_${variant}`),
        speaker: () => ready() ? first : null, valid: nearby, onShown,
        onFinished: () => speak({ event: "chat_b", visit: true, text: tr(`say_chat_b_${variant}`),
          speaker: () => second.busy ? null : second, valid: nearby }),
      });
    } else {
      speak({ event: "nap", visit: true, text: tr(`say_nap_${variant}`),
        speaker: () => ready() ? first : null, valid: nearby, onShown, motion: (p) => nap(p, second),
      });
    }
  }

  // The day's greeting fits the visit, in this order: a weekly quota that reset since the last greeting, three or
  // more days away, Monday or Friday, then a time-of-day or general hello. usage-felt-week keeps each weekly reset
  // time seen at the last greeting, so a new week is noticed once.
  let greetedWeeks = {};
  try {
    greetedWeeks = JSON.parse(localStorage.getItem("usage-felt-week") || "{}") || {};
  } catch {}
  const pickLine = (keys, params) => tr(keys[Math.floor(Math.random() * keys.length)], params);
  function greeting(now) {
    const weeks = {};
    let freshTool = "";
    for (const el of visibleCards()) {
      const key = quotaKey(el.dataset.card, "weekly");
      const row = latest?.[el.dataset.card]?.weekly;
      if (!available(row) || !Number.isFinite(row.resetsAt)) continue;
      weeks[key] = row.resetsAt;
      const before = greetedWeeks[key];
      // Antigravity reset times drift by a minute between probes, so only a jump of over an hour is a new week.
      if (!freshTool && Number.isFinite(before) && Math.abs(row.resetsAt - before) > 3600 && row.percent <= 5) {
        freshTool = el.querySelector(".brand h1")?.textContent.trim() ?? "";
      }
    }
    const remember = () => {
      greetedWeeks = { ...greetedWeeks, ...weeks };
      try {
        localStorage.setItem("usage-felt-week", JSON.stringify(greetedWeeks));
      } catch {}
    };
    const last = helloDay ? new Date(`${helloDay}T00:00`) : null;
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const away = last && !Number.isNaN(last.getTime()) ? Math.round((today - last) / 864e5) : 0;
    const hour = now.getHours();
    const time = hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening";
    let text;
    if (freshTool) text = pickLine(["say_week_1", "say_week_2"], { tool: freshTool });
    else if (away >= 3) text = pickLine(["say_back_1", "say_back_2"]);
    else if (now.getDay() === 1) text = pickLine(["say_monday_1", "say_monday_2"]);
    else if (now.getDay() === 5) text = pickLine(["say_friday_1", "say_friday_2"]);
    else text = pickLine([`say_${time}_1`, `say_${time}_2`, "say_hello_1", "say_hello_2", "say_hello_3"]);
    return { text, remember };
  }

  // Give each visible visit 2.5 seconds before offering a greeting.
  function beginVisit() {
    if (greetingTimer !== null || visitReady) return;
    greetingTimer = setTimeout(() => {
      greetingTimer = null;
      if (hidden()) return;
      visitReady = true;
      const now = new Date();
      const today = dayKey(now);
      if (isLate(now)) {
        if (!checkLate(now)) checkRare(today);
        return;
      }
      if (helloDay === today) return checkRare(today);
      const christmas = now.getMonth() === 11 && (now.getDate() === 24 || now.getDate() === 25);
      const hello = christmas ? null : greeting(now);
      // Showing the greeting marks the day as greeted; `shown` keeps that from cutting this bubble short.
      let shown = false;
      speak({ event: christmas ? "xmas" : "hello", queue: true, visit: true, text: hello?.text || undefined,
        valid: () => !isLate() && dayKey() === today && (shown || helloDay !== today),
        onShown: () => {
          shown = true;
          hello?.remember();
          helloDay = today;
          storeDay("usage-felt-hello", today);
        },
        motion: helloHop,
      });
    }, 2500);
  }

  function nextWake(card) {
    // The pal can only wake once all spent quotas have reset.
    let wake;
    for (const name of quotaNames(card)) {
      const key = quotaKey(card, name);
      if ((previousQuotas.get(key)?.percent ?? 0) < 100) continue;
      const resetsAt = readQuota(card, name)?.resetsAt;
      if (!Number.isFinite(resetsAt)) return undefined;
      if (!wake || resetsAt > wake.resetsAt) wake = { key, resetsAt };
    }
    return wake;
  }

  function wakesSoon(resetsAt) {
    const remaining = resetsAt - Date.now() / 1000;
    return remaining > 0 && remaining <= 600;
  }

  function checkSoon(b) {
    for (const { card } of b) {
      const wake = nextWake(card);
      if (!wake || !wakesSoon(wake.resetsAt)) continue;
      const lastNoted = wakeNoted.get(wake.key);
      if (lastNoted !== undefined && Math.abs(wake.resetsAt - lastNoted) <= 180) continue;
      speak({ event: "soon", card,
        valid: () => {
          const current = nextWake(card);
          return current?.key === wake.key && wakesSoon(current.resetsAt);
        },
        onShown: () => wakeNoted.set(wake.key, nextWake(card).resetsAt),
        motion: stretch,
      });
    }
  }

  function onState(state) {
    const alerts = new Set(state.footer?.serviceAlertCards);
    const operational = new Set(state.footer?.serviceOperationalCards);
    for (const id of state.footer?.serviceKnownCards ?? []) {
      const active = alerts.has(id);
      const previous = previousAlerts.get(id);
      previousAlerts.set(id, active);
      if (previous === undefined || active === previous) continue;
      if (!active && !operational.has(id)) continue;
      speak({ event: active ? "outage" : "fixed", card: id,
        valid: () => previousAlerts.get(id) === active
          && (active || (latest?.footer?.serviceOperationalCards ?? []).includes(id)),
        motion: active ? startle : undefined });
    }

    if (state.footer?.totalsReady !== false) {
      const today = Number((state.footer?.today?.tokensCount ?? "").replace(/\D/g, ""));
      const yesterday = Number((state.footer?.yesterday?.tokensCount ?? "").replace(/\D/g, ""));
      if (previousToday !== null && yesterday > 0 && previousToday <= yesterday && today > yesterday) {
        speak({ event: "record", queue: true });
        if (!still) wave();
      }
      previousToday = today;
    }

    const visible = new Set(visibleCards().map((el) => quotaKey(el.dataset.card)));
    for (const id of CARD_IDS) {
      const key = quotaKey(id);
      observeQuotas(id, visible.has(key) && previousVisible.has(key));
    }
    previousVisible = visible;
    if (speaking?.item.valid && !speaking.item.valid()) endSpeech(false, false);
    schedule();
  }

  const start = () => {
    const applyState = window.usageApplyState;
    if (typeof applyState === "function") {
      window.usageApplyState = function (state) {
        const result = applyState.apply(this, arguments);
        latest = state;
        onState(state);
        return result;
      };
    }
    document.documentElement.classList.toggle("pal-paused", hidden());
    setInterval(() => { if (!hidden()) { refreshChristmas(); schedule(); checkLate(); } }, 30000);
    refreshChristmas();
    settle();
    if (!hidden()) beginVisit();
    if (still) {
      pals.forEach((p) => p.body.classList.remove("idle", "dozing"));
      return;
    }
    startMotion();
  };
  new ResizeObserver(schedule).observe(document.body);
  const cards = document.querySelector(".card")?.parentElement;
  if (cards) {
    new MutationObserver(schedule).observe(cards, {
      subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["style", "hidden", "class"],
    });
  }
  // Service alerts grow the footer and push the line down; re-place the pals in line at once instead of leaving
  // them floating where the strip used to be.
  const footer = document.querySelector(".footer");
  if (footer) new MutationObserver(schedule).observe(footer, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  // Catch up on anything that changed while the panel was hidden.
  document.addEventListener("visibilitychange", () => {
    document.documentElement.classList.toggle("pal-paused", hidden());
    if (hidden()) {
      stopMotion();
      pausedAt = performance.now();
      clearTimeout(speechTimer);
      clearTimeout(greetingTimer);
      greetingTimer = null;
      visitReady = false;
      lateOfferedDay = "";
      if (speaking?.item.visit) endSpeech();
      else speaking?.el.classList.add("paused");
      for (let i = speech.length - 1; i >= 0; i--) {
        if (speech[i].visit) speech.splice(i, 1);
      }
      return;
    }
    if (pausedAt !== null) hiddenTime += performance.now() - pausedAt;
    pausedAt = null;
    speaking?.el.classList.remove("paused");
    refreshChristmas();
    schedule();
    beginVisit();
    startMotion();
  });
  reducedMotion.addEventListener("change", () => {
    still = reducedMotion.matches;
    if (still) {
      stopMotion();
      pals.forEach((p) => p.body.classList.remove("idle", "dozing"));
      snow?.remove();
      snow = null;
    } else {
      pals.forEach((p) => { if (!p.busy) idle(p); });
      treeDay = "";
      refreshChristmas();
      startMotion();
    }
    schedule();
  });
  if (document.readyState === "complete") start();
  else addEventListener("load", start);
})();

  </script>

{{CORE_SCRIPT}}  </script>

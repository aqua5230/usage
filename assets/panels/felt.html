<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --muse: #0082FB;
      color-scheme: dark light;
      --bg: #080d12;
      --panel: rgba(25, 33, 42, 0.86);
      --panel-border: rgba(255, 255, 255, 0.10);
      --line: rgba(255, 255, 255, 0.13);
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.58);
      --track: rgba(255, 255, 255, 0.07);
      --tick: rgba(255, 255, 255, 0.34);
      --button: rgba(255, 255, 255, 0.08);
      --button-border: rgba(255, 255, 255, 0.18);
      --button-hover: rgba(255, 255, 255, 0.13);
      --claude: #f49164;
      --codex: #58d6e6;
      --agy: #6b9aff;
      --grok: #e9e9ee;
      --projects: #30d158;
      --warn: #ffc439;
      --danger: #ff453a;
      --radius: 8px;
      /* Numeric readouts use the system mono face; no webfont, panel stays offline. */
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    }

    @media all { /* Felt is light-only: always take classic's light rules. */
      :root {
        --muse: #0064E0;
        --bg: #eef2f7;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-border: rgba(20, 28, 38, 0.14);
        --line: rgba(20, 28, 38, 0.13);
        --text: rgba(12, 18, 26, 0.9);
        --muted: rgba(12, 18, 26, 0.55);
        --track: rgba(12, 18, 26, 0.08);
        --tick: rgba(12, 18, 26, 0.32);
        --button: rgba(12, 18, 26, 0.05);
        --button-border: rgba(12, 18, 26, 0.14);
        --button-hover: rgba(12, 18, 26, 0.10);
        --agy: #3f74e8;
        --grok: #1c1c1f;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0;
      overscroll-behavior: none;
    }

    body {
      padding: 12px;
      background:
        linear-gradient(180deg, #111b25 0%, #0b1118 44%, var(--bg) 100%);
    }

    @media all {
      body {
        background:
          linear-gradient(180deg, #f8fafc 0%, #eef3f8 48%, var(--bg) 100%);
      }
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .card {
      padding: 13px 15px 12px;
    }

    .card[data-card="codex"],
    .card[data-card="agy"] {
      overflow: visible;
      z-index: 2;
    }

    /* Chasing halo. No box-shadow anywhere: the effect is a conic gradient
       clipped to the card's own border ring, so it cannot bleed past the box
       even on the codex/agy cards, which are overflow:visible for tooltips. */
    @property --halo-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    .card[data-critical="true"]::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      pointer-events: none;
      background: conic-gradient(from var(--halo-angle),
          transparent 0deg 232deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 286deg,
          var(--danger) 334deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 352deg,
          transparent 360deg);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      animation: halo-spin 2.6s linear infinite;
    }

    @keyframes halo-spin {
      to {
        --halo-angle: 360deg;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      height: 32px;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .card[data-card="agy"] .brand-icon svg,
    .card[data-card="grok"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="agy"] .brand-icon,
    .card[data-card="grok"] .brand-icon {
      color: var(--accent);
    }

    .brand h1 {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
      /* Room for descenders (g, y) inside the ellipsis clip; the negative margin keeps the layout unchanged. */
      padding-block: 0.2em;
      margin-block: -0.2em;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    /* Codex has no live report, so an old reading is normal, not a warning. */
    [data-codex-stale] {
      color: var(--muted);
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .card[data-card="agy"] .brand h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="agy"] .codex-stale {
      margin-left: auto;
    }

    .card[data-card="codex"] .brand.usage-switch-host h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="codex"] .brand.usage-switch-host .codex-stale {
      flex: 1 1 0;
      overflow: hidden;
    }

    .card[data-card="codex"] .brand.usage-switch-host [data-codex-stale-age] {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(10, 14, 20, 0.96);
      color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .card[data-card="projects"] .brand {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      height: auto;
      row-gap: 10px;
      margin-bottom: 10px;
    }

    .card[data-card="projects"] .brand-icon {
      grid-column: 1;
    }

    .card[data-card="projects"] h1 {
      grid-column: 2;
    }

    .project-actions {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .project-actions .switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      height: 28px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    /* The range toggle leads with green text and a thin outline only, so a red quota stays the loudest thing. */
    .project-actions [data-action="toggle-project-range"] {
      border-color: rgba(48, 209, 88, 0.30);
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: #5fdc7f;
    }

    .project-actions [data-action="toggle-project-range"]:hover {
      border-color: rgba(48, 209, 88, 0.50);
      background: var(--button);
    }

    .project-actions .switch:not([data-action="toggle-project-range"]) {
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
    }

    .project-actions .switch:not([data-action="toggle-project-range"]):hover {
      background: var(--button);
      color: var(--text);
    }

    .switch {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: var(--button);
      color: var(--text);
      font: 600 12px/26px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: nowrap;
    }

    /* Settings sits in a card header, so it is header-sized and quieter than the actions. */
    .brand .switch[data-action="switch"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: color-mix(in srgb, var(--button) 65%, transparent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .brand .switch[data-action="switch"]:hover {
      background: var(--button-hover);
      border-color: var(--button-border);
      color: var(--text);
    }

    .row + .row {
      border-top: 1px solid var(--line);
      margin-top: 10px;
      padding-top: 10px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
    }

    .row-title {
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .percent {
      font-size: 14px;
      line-height: 18px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .track {
      position: relative;
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--track);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.18);
    }

    /* Tick marks the 80% danger threshold from colorFor(); drawn above the fill
       so a bar past it still shows where the line was crossed. */
    .track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 calc(80% - 1px);
      width: 1.5px;
      background: var(--tick);
      pointer-events: none;
    }

    .fill {
      width: 0%;
      height: 100%;
      min-width: 4px;
      border-radius: inherit;
      background: var(--fill-color, var(--accent));
      background-image: linear-gradient(180deg, color-mix(in srgb, var(--fill-color, var(--accent)) 100%, white 12%), var(--fill-color, var(--accent)));
      box-shadow: 0 0 12px color-mix(in srgb, var(--fill-color, var(--accent)) 30%, transparent);
      transition: width 140ms ease-out, background-color 140ms ease-out;
    }

    .reset {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 13px;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .reset[data-warning="true"] {
      color: #ff3b30;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: var(--muted);
    }

    .row[data-available="false"] .fill {
      width: 0%;
    }

    /* min-width keeps a sub-1% bar visible; a genuine 0% must stay empty. */
    .fill[style*="width: 0%"] {
      min-width: 0;
    }

    .proj-row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 5px 8px;
      padding: 7px 0 8px;
      font-size: 13.5px;
      line-height: 20px;
    }

    .proj-row + .proj-row {
      border-top: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    }

    .proj-row:first-child {
      font-weight: 600;
    }

    .proj-rank {
      width: 16px;
      height: 16px;
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--muted) 26%, transparent);
      color: var(--text);
      font-weight: 700;
      font-size: 10px;
    }

    .proj-row:first-child .proj-rank {
      background: color-mix(in srgb, var(--projects) 32%, transparent);
      color: white;
    }

    .proj-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-row:first-child .proj-name {
      color: var(--text);
    }

    .proj-tokens {
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
      min-width: 92px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-cost {
      min-width: 52px;
      color: color-mix(in srgb, var(--muted) 70%, transparent);
      font-size: 12px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-bar {
      grid-column: 1 / -1;
      height: 3px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
      align-self: end;
    }

    .proj-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 72%, transparent), var(--accent));
      opacity: 0.7;
    }

    .proj-row:first-child .proj-bar {
      height: 3.5px;
    }

    .proj-row:first-child .proj-bar-fill {
      opacity: 1;
    }

    .footer {
      min-height: 144px;
      padding: 12px 15px 11px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta > div {
      padding: 2px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--button) 40%, transparent);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(220, 80, 60, 0.16);
      border: 1px solid rgba(220, 80, 60, 0.4);
      color: #ff9b85;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .today {
      margin-top: 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }


    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      height: auto;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: normal;
      min-width: 0;
      line-height: 1.3;
      flex: 1;
    }

    .action,
    .switch {
      transition:
        filter 80ms ease-out,
        transform 80ms ease-out,
        background 160ms ease-out,
        background-color 160ms ease-out,
        border-color 160ms ease-out,
        color 160ms ease-out;
    }

    .action:focus-visible,
    .switch:focus-visible {
      outline: 2px solid var(--accent, #58d6e6);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {

      .action,
      .switch,
      .fill {
        transition: none;
      }

      .card[data-critical="true"]::after {
        animation: none;
        background: color-mix(in srgb, var(--danger) 72%, transparent);
      }
    }

    .action:active,
    .switch:active {
      filter: brightness(0.82);
      transform: scale(0.98);
    }

    .action.primary {
      border-color: rgba(88, 214, 230, 0.30);
      background: linear-gradient(180deg, rgba(88, 214, 230, 0.26), rgba(24, 172, 216, 0.18));
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .action.primary:hover {
      border-color: rgba(88, 214, 230, 0.55);
      background: linear-gradient(180deg, #34d7f2, #18acd8);
      color: white;
    }

    .action:not(.primary):hover {
      background: var(--button);
      color: var(--text);
    }

    .action[data-action="install"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }

    .switch:hover {
      background: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.28);
    }

    @media all {
      .switch:hover {
        background: rgba(12, 18, 26, 0.10);
        border-color: rgba(12, 18, 26, 0.22);
      }

      .action.primary {
        border-color: rgba(24, 172, 216, 0.45);
        background: linear-gradient(180deg, rgba(88, 214, 230, 0.30), rgba(24, 172, 216, 0.20));
      }

      .proj-row:first-child .proj-rank {
        background: color-mix(in srgb, var(--projects) 35%, transparent);
        color: #0b5120;
      }

      .project-actions [data-action="toggle-project-range"] {
        color: #13702f;
      }

      /* A white app icon needs a dark outline on a white card. */
      .brand img {
        box-shadow:
          0 0 0 1px var(--panel-border),
          0 4px 10px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      .track {
        box-shadow: inset 0 1px 1px rgba(12, 18, 26, 0.06);
      }
    }

    .attribution {
      font-size: 10px;
      color: rgba(255,255,255,0.34);
      text-align: center;
      margin-top: 6px;
    }

    .attribution a {
      color: inherit;
      text-decoration: none;
    }

    @media all {
      .attribution {
        color: rgba(12,18,26,0.30);
      }
    }




    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: 0.72; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24); transform: translateY(-2px); }
    .is-card-dragging, .is-card-dragging * { user-select: none; }

    .card[data-card="agy"] .agy-group-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      height: 20px;
      border: 1px solid color-mix(in srgb, var(--agy) 38%, transparent);
      border-radius: 999px;
      padding: 0 8px;
      background: color-mix(in srgb, var(--agy) 12%, transparent);
      color: var(--agy);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    /* display above would otherwise override the hidden attribute. */
    .card[data-card="agy"] .agy-group-toggle[hidden] {
      display: none;
    }
    .card[data-card="agy"] .brand h1 {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card[data-card="agy"] .agy-group-toggle:hover,
    .card[data-card="agy"] .agy-group-toggle:focus-visible {
      background: color-mix(in srgb, var(--agy) 25%, transparent);
    }

    .card[data-card="muse"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="muse"] .brand-icon {
      color: var(--accent);
    }

    .hide-muse [data-card="muse"] { display: none; }

    /* Compact layout keeps this theme's header geometry and decoration. */
    html.compact-cards body .card[data-card="projects"] { padding-inline: 13px; }
    html.compact-cards body .card[data-card="projects"] .brand {
      grid-template-columns: 24px minmax(0, 1fr);
      column-gap: 8px;
    }
    html.compact-cards body .card[data-card] .brand-icon svg { width: 15px; height: 15px; }
    /* The folder artwork carries its own padding inside the viewBox. */
    html.compact-cards body .card[data-card="projects"] .brand-icon svg { width: 20px; height: 20px; }
    html.compact-cards body .footer { padding-inline: 13px; }

  <style>
:root, :root:not(#x) {
  color-scheme: light;
  --bg: #efe6da; --text: #4a3a2e; --muted: #8a7563;
  --line: color-mix(in srgb, #4a3a2e 16%, transparent);
  --tick: color-mix(in srgb, #4a3a2e 45%, transparent);
  --button: #f7efe4; --button-border: color-mix(in srgb, #4a3a2e 18%, transparent);
  --button-hover: #f7efe4;
  --claude: #e8734a; --codex: #2fa7b8; --agy: #5b7fe0; --grok: #6c6470; --muse: #2f7de0;
  --projects: #5aa860; --warn: #e6a21f; --danger: #d9473a; --radius: 18px;
}
body {
  background: #efe6da url("{{ASSET:panels/felt/bg.webp}}") center top / cover no-repeat !important;
  color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Noto Sans TC", sans-serif;
}
/* Classic's alert pink is tuned for its dark look; on cream it washes out, so use a deep red. */
.service-alert {
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  border-color: color-mix(in srgb, var(--danger) 45%, transparent);
  color: #a8342a;
}
.wrap { gap: 6px; }
.card, .footer {
  position: relative; background: transparent !important; border-radius: 18px;
  /* A brown rim and stitch line make the cream card edge readable on the cream background. */
  box-shadow: 0 0 0 1.5px rgba(110, 80, 56, 0.5), 0 2px 4px rgba(90, 65, 45, 0.16) !important;
  border: 0 solid transparent !important;
  border-image: url("{{ASSET:panels/felt/card.webp}}") 57 fill / 12px / 1px stretch !important;
  overflow: visible;
}
.card::before, .footer::before, .pals-line::before {
  content: ""; position: absolute; inset: 3px; border-radius: 14px; pointer-events: none;
  border: 1.3px dashed rgba(120, 88, 62, 0.6);
}
/* The pals stand on a stitched ground line, not on a card of their own. */
.pals-line { position: relative; }
.pals-line::before {
  inset: auto 10px 12px 10px; height: 0; border: 0; border-radius: 0;
  border-top: 1.6px dashed rgba(120, 88, 62, 0.55);
}
.card { padding: 12px 15px 11px; }
.brand h1 { color: var(--text); font-weight: 800; }
.row-title, .reset { color: var(--muted); }
.percent { font-size: 15px; font-weight: 900; color: color-mix(in srgb, var(--accent) 80%, #4a3a2e); }
.row + .row { border-top: 1px dashed var(--line); }
.track {
  height: 15px; border-radius: 0; overflow: visible; background: transparent; box-shadow: none;
  border: 0 solid transparent;
  border-image: url("{{ASSET:panels/felt/track.webp}}") 0 60 fill / 0 9px / 0 stretch;
  padding: 2px 3px; box-sizing: border-box;
}
.track::after { inset: 3px auto 3px calc(80% - 1px); border-radius: 2px; }
.fill {
  position: relative; min-width: 14px; height: 100%; border-radius: 0; box-shadow: none;
  background: var(--fill-color, var(--accent)); background-image: none;
  -webkit-mask-box-image: url("{{ASSET:panels/felt/fill.webp}}") 0 46 / 0 7px stretch;
  filter: drop-shadow(0 1px 1px rgba(40, 30, 20, 0.25));
}
.fill::after {
  content: ""; position: absolute; inset: 0; border: 0 solid transparent;
  border-image: url("{{ASSET:panels/felt/fill_gray.webp}}") 0 46 fill / 0 7px / 0 stretch;
  mix-blend-mode: overlay; opacity: 0.9;
}
.switch, .action, .meta > div {
  background: #f7efe4; border: 0; color: var(--text);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.85), inset 0 -2px 2px rgba(60,40,30,.14),
    0 2px 3px rgba(60,40,30,.18);
}
.action { border-radius: 14px; }
.action.primary { background: var(--claude); color: #fff; }
.proj-bar { background: color-mix(in srgb, #4a3a2e 14%, #efe6da); border-radius: 99px;

.proj-bar-fill { border-radius: 99px; }
.attribution { color: var(--muted) !important; opacity: 0.8 !important; }
/* Depth: slabs float above the backdrop, grooves sink, ropes and buttons puff up, text is pressed in. */
.card, .footer { filter: drop-shadow(0 2px 3px rgba(70, 45, 25, 0.12)); }
.brand h1, .percent, .row-title, .reset, .proj-name, .proj-tokens { text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75); }

.fill::before { content: ""; position: absolute; inset: 1px 3px 50% 3px; border-radius: 99px; z-index: 1;
  background: linear-gradient(rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0)); }
.switch, .action, .meta > div {

.pals-line { height: 58px; padding: 0; }

  </style>

  <script>
// Felt pals. Each service card has a rider; the rest wait in line and take turns riding.
// Riders worry at 80%, doze at 100%, and celebrate when quota returns. Clicking a pal shows its name.
// A shared speech queue shows one bubble at a time and pauses while the panel is hidden.
// The line greets visitors, occasionally chats or naps, and gets a tree and snow in December.
(() => {
  const NAMES = ["redpanda", "frog", "penguin", "rabbit", "raccoon", "piglet", "elephant", "bear", "puppy", "chick", "kitten", "hedgehog", "otter", "snail", "crab", "pufferfish", "cockatoo",
    "bobo", "tuanli", "starpup", "tantan", "minto", "shandou", "nibo", "boqi", "zapi",
    "leituan", "wuqiu", "banban"];
  // Hidden pals stay out of the normal rotation and only rarely take a turn in line. One unlocks each week in this
  // order, from local midnight on HIDDEN_START; a pal that is not unlocked yet never appears.
  const HIDDEN_ORDER = ["tuanli", "zapi", "bobo", "nibo", "tantan", "starpup", "shandou", "minto", "boqi", "leituan", "wuqiu", "banban"];
  const HIDDEN = new Set(HIDDEN_ORDER);
  const unlockAt = (name) => new Date(2026, 11, 1 + HIDDEN_ORDER.indexOf(name) * 7);
  const unlocked = (name, now = new Date()) => unlockAt(name) <= now;
  const RARE = 0.1;
  // Every pal has the first five poses; the rest are optional extras, and a pal without one keeps its current pose.
  const POSES = ["stand", "jump", "worried", "sleep", "cheer", "wave", "stretch", "run", "surprised", "signature"];
  // Display height of each pose relative to standing: sitting is shorter, arms up is a little taller.
  const HEIGHT = { sleep: 0.82, cheer: 1.06 };
  const SIZE = 40;
  const QUEUE_SCALE = 0.88;
  const LINE_GROUND = 13;
  const WARN = 0.8;
  const CARD_IDS = ["claude", "codex", "agy", "grok", "muse"];
  const CONFETTI = ["#e8734a", "#5aa860", "#5b7fe0", "#e6a21f", "#ef7fa0", "#2fa7b8"];
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let still = reducedMotion.matches;
  const hidden = () => document.hidden;
  const css = document.createElement("style");
  css.textContent = `
    .pals-line{flex-shrink:0}
    .pal-img{position:absolute;bottom:0;height:${SIZE}px;width:auto;transform-origin:50% 100%}
    .pal-body.idle .pal-img{animation:pal-breathe 3.3s ease-in-out infinite,pal-sway 8.2s ease-in-out infinite;
      animation-delay:var(--ph),calc(var(--ph) * 2.5)}
    .pal-body.dozing .pal-img{animation:pal-doze 4.4s ease-in-out infinite;animation-delay:var(--ph)}
    @keyframes pal-breathe{50%{scale:0.988 1.025}}
    @keyframes pal-sway{25%{rotate:2deg}75%{rotate:-2deg}}
    @keyframes pal-doze{50%{scale:1.02 1.05}}
    .pal-sil{filter:brightness(0) blur(1.6px);opacity:.26}
    .pal-shadow{position:absolute;left:${-SIZE * 0.3}px;top:-5px;width:${SIZE * 0.6}px;height:6px;z-index:0;border-radius:50%;
      background:radial-gradient(closest-side,rgba(60,38,20,.55),rgba(60,38,20,.22) 55%,rgba(60,38,20,0))}
    .pal-badge,.pal-heart{position:absolute;left:-9px;width:18px;height:18px;border-radius:50%;color:#fff;text-align:center;
      font:900 13px/18px ui-rounded,-apple-system,sans-serif;box-shadow:inset 0 -2px 2px rgba(0,0,0,.2),
      inset 0 1px 1px rgba(255,255,255,.5),0 1px 2px rgba(80,30,20,.35)}

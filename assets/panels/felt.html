<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --muse: #0082FB;
      color-scheme: dark light;
      --bg: #080d12;
      --panel: rgba(25, 33, 42, 0.86);
      --panel-border: rgba(255, 255, 255, 0.10);
      --line: rgba(255, 255, 255, 0.13);
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.58);
      --track: rgba(255, 255, 255, 0.07);
      --tick: rgba(255, 255, 255, 0.34);
      --button: rgba(255, 255, 255, 0.08);
      --button-border: rgba(255, 255, 255, 0.18);
      --button-hover: rgba(255, 255, 255, 0.13);
      --claude: #f49164;
      --codex: #58d6e6;
      --agy: #6b9aff;
      --grok: #e9e9ee;
      --projects: #30d158;
      --warn: #ffc439;
      --danger: #ff453a;
      --radius: 8px;
      /* Numeric readouts use the system mono face; no webfont, panel stays offline. */
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    }

    @media all { /* Felt is light-only: always take classic's light rules. */
      :root {
        --muse: #0064E0;
        --bg: #eef2f7;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-border: rgba(20, 28, 38, 0.14);
        --line: rgba(20, 28, 38, 0.13);
        --text: rgba(12, 18, 26, 0.9);
        --muted: rgba(12, 18, 26, 0.55);
        --track: rgba(12, 18, 26, 0.08);
        --tick: rgba(12, 18, 26, 0.32);
        --button: rgba(12, 18, 26, 0.05);
        --button-border: rgba(12, 18, 26, 0.14);
        --button-hover: rgba(12, 18, 26, 0.10);
        --agy: #3f74e8;
        --grok: #1c1c1f;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0;
      overscroll-behavior: none;
    }

    body {
      padding: 12px;
      background:
        linear-gradient(180deg, #111b25 0%, #0b1118 44%, var(--bg) 100%);
    }

    @media all {
      body {
        background:
          linear-gradient(180deg, #f8fafc 0%, #eef3f8 48%, var(--bg) 100%);
      }
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .card {
      padding: 13px 15px 12px;
    }

    .card[data-card="codex"],
    .card[data-card="agy"] {
      overflow: visible;
      z-index: 2;
    }

    /* Chasing halo. No box-shadow anywhere: the effect is a conic gradient
       clipped to the card's own border ring, so it cannot bleed past the box
       even on the codex/agy cards, which are overflow:visible for tooltips. */
    @property --halo-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    .card[data-critical="true"]::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      pointer-events: none;
      background: conic-gradient(from var(--halo-angle),
          transparent 0deg 232deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 286deg,
          var(--danger) 334deg,
          color-mix(in srgb, var(--danger) 30%, transparent) 352deg,
          transparent 360deg);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      animation: halo-spin 2.6s linear infinite;
    }

    @keyframes halo-spin {
      to {
        --halo-angle: 360deg;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      height: 32px;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .card[data-card="agy"] .brand-icon svg,
    .card[data-card="grok"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="agy"] .brand-icon,
    .card[data-card="grok"] .brand-icon {
      color: var(--accent);
    }

    .brand h1 {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
      /* Room for descenders (g, y) inside the ellipsis clip; the negative margin keeps the layout unchanged. */
      padding-block: 0.2em;
      margin-block: -0.2em;
    }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      min-width: 0;
      color: var(--warn);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .codex-stale[hidden] {
      display: none;
    }

    /* Codex has no live report, so an old reading is normal, not a warning. */
    [data-codex-stale] {
      color: var(--muted);
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .card[data-card="agy"] .brand h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="agy"] .codex-stale {
      margin-left: auto;
    }

    .card[data-card="codex"] .brand.usage-switch-host h1 {
      flex: none;
      overflow: visible;
    }

    .card[data-card="codex"] .brand.usage-switch-host .codex-stale {
      flex: 1 1 0;
      overflow: hidden;
    }

    .card[data-card="codex"] .brand.usage-switch-host [data-codex-stale-age] {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 8px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 260px;
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(10, 14, 20, 0.96);
      color: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 500;
      white-space: normal;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .card[data-card="projects"] .brand {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      height: auto;
      row-gap: 10px;
      margin-bottom: 10px;
    }

    .card[data-card="projects"] .brand-icon {
      grid-column: 1;
    }

    .card[data-card="projects"] h1 {
      grid-column: 2;
    }

    .project-actions {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .project-actions .switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      height: 28px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    /* The range toggle leads with green text and a thin outline only, so a red quota stays the loudest thing. */
    .project-actions [data-action="toggle-project-range"] {
      border-color: rgba(48, 209, 88, 0.30);
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: #5fdc7f;
    }

    .project-actions [data-action="toggle-project-range"]:hover {
      border-color: rgba(48, 209, 88, 0.50);
      background: var(--button);
    }

    .project-actions .switch:not([data-action="toggle-project-range"]) {
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
    }

    .project-actions .switch:not([data-action="toggle-project-range"]):hover {
      background: var(--button);
      color: var(--text);
    }

    .switch {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: var(--button);
      color: var(--text);
      font: 600 12px/26px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: nowrap;
    }

    /* Settings sits in a card header, so it is header-sized and quieter than the actions. */
    .brand .switch[data-action="switch"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: color-mix(in srgb, var(--button) 65%, transparent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .brand .switch[data-action="switch"]:hover {
      background: var(--button-hover);
      border-color: var(--button-border);
      color: var(--text);
    }

    .row + .row {
      border-top: 1px solid var(--line);
      margin-top: 10px;
      padding-top: 10px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
    }

    .row-title {
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .percent {
      font-size: 14px;
      line-height: 18px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .track {
      position: relative;
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--track);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.18);
    }

    /* Tick marks the 80% danger threshold from colorFor(); drawn above the fill
       so a bar past it still shows where the line was crossed. */
    .track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 calc(80% - 1px);
      width: 1.5px;
      background: var(--tick);
      pointer-events: none;
    }

    .fill {
      width: 0%;
      height: 100%;
      min-width: 4px;
      border-radius: inherit;
      background: var(--fill-color, var(--accent));
      background-image: linear-gradient(180deg, color-mix(in srgb, var(--fill-color, var(--accent)) 100%, white 12%), var(--fill-color, var(--accent)));
      box-shadow: 0 0 12px color-mix(in srgb, var(--fill-color, var(--accent)) 30%, transparent);
      transition: width 140ms ease-out, background-color 140ms ease-out;
    }

    .reset {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 13px;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .reset[data-warning="true"] {
      color: #ff3b30;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: var(--muted);
    }

    .row[data-available="false"] .fill {
      width: 0%;
    }

    /* min-width keeps a sub-1% bar visible; a genuine 0% must stay empty. */
    .fill[style*="width: 0%"] {
      min-width: 0;
    }

    .proj-row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 5px 8px;
      padding: 7px 0 8px;
      font-size: 13.5px;
      line-height: 20px;
    }

    .proj-row + .proj-row {
      border-top: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    }

    .proj-row:first-child {
      font-weight: 600;
    }

    .proj-rank {
      width: 16px;
      height: 16px;
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--muted) 26%, transparent);
      color: var(--text);
      font-weight: 700;
      font-size: 10px;
    }

    .proj-row:first-child .proj-rank {
      background: color-mix(in srgb, var(--projects) 32%, transparent);
      color: white;
    }

    .proj-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-row:first-child .proj-name {
      color: var(--text);
    }

    .proj-tokens {
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
      min-width: 92px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-cost {
      min-width: 52px;
      color: color-mix(in srgb, var(--muted) 70%, transparent);
      font-size: 12px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .proj-bar {
      grid-column: 1 / -1;
      height: 3px;
      border-radius: 2px;
      background: var(--track);
      overflow: hidden;
      align-self: end;
    }

    .proj-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 72%, transparent), var(--accent));
      opacity: 0.7;
    }

    .proj-row:first-child .proj-bar {
      height: 3.5px;
    }

    .proj-row:first-child .proj-bar-fill {
      opacity: 1;
    }

    .footer {
      min-height: 144px;
      padding: 12px 15px 11px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta > div {
      padding: 2px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--button) 40%, transparent);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(220, 80, 60, 0.16);
      border: 1px solid rgba(220, 80, 60, 0.4);
      color: #ff9b85;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .today {
      margin-top: 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }


    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      height: auto;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--button) 70%, transparent);
      color: var(--muted);
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      white-space: normal;
      min-width: 0;
      line-height: 1.3;
      flex: 1;
    }

    .action,
    .switch {
      transition:
        filter 80ms ease-out,
        transform 80ms ease-out,
        background 160ms ease-out,
        background-color 160ms ease-out,
        border-color 160ms ease-out,
        color 160ms ease-out;
    }

    .action:focus-visible,
    .switch:focus-visible {
      outline: 2px solid var(--accent, #58d6e6);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {

      .action,
      .switch,
      .fill {
        transition: none;
      }

      .card[data-critical="true"]::after {
        animation: none;
        background: color-mix(in srgb, var(--danger) 72%, transparent);
      }
    }

    .action:active,
    .switch:active {
      filter: brightness(0.82);
      transform: scale(0.98);
    }

    .action.primary {
      border-color: rgba(88, 214, 230, 0.30);
      background: linear-gradient(180deg, rgba(88, 214, 230, 0.26), rgba(24, 172, 216, 0.18));
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .action.primary:hover {
      border-color: rgba(88, 214, 230, 0.55);
      background: linear-gradient(180deg, #34d7f2, #18acd8);
      color: white;
    }

    .action:not(.primary):hover {
      background: var(--button);
      color: var(--text);
    }

    .action[data-action="install"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }

    .switch:hover {
      background: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.28);
    }

    @media all {
      .switch:hover {
        background: rgba(12, 18, 26, 0.10);
        border-color: rgba(12, 18, 26, 0.22);
      }

      .action.primary {
        border-color: rgba(24, 172, 216, 0.45);
        background: linear-gradient(180deg, rgba(88, 214, 230, 0.30), rgba(24, 172, 216, 0.20));
      }

      .proj-row:first-child .proj-rank {
        background: color-mix(in srgb, var(--projects) 35%, transparent);
        color: #0b5120;
      }

      .project-actions [data-action="toggle-project-range"] {
        color: #13702f;
      }

      /* A white app icon needs a dark outline on a white card. */
      .brand img {
        box-shadow:
          0 0 0 1px var(--panel-border),
          0 4px 10px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      .track {
        box-shadow: inset 0 1px 1px rgba(12, 18, 26, 0.06);
      }
    }

    .attribution {
      font-size: 10px;
      color: rgba(255,255,255,0.34);
      text-align: center;
      margin-top: 6px;
    }

    .attribution a {
      color: inherit;
      text-decoration: none;
    }

    @media all {
      .attribution {
        color: rgba(12,18,26,0.30);
      }
    }




    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: 0.72; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24); transform: translateY(-2px); }
    .is-card-dragging, .is-card-dragging * { user-select: none; }

    .card[data-card="agy"] .agy-group-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      height: 20px;
      border: 1px solid color-mix(in srgb, var(--agy) 38%, transparent);
      border-radius: 999px;
      padding: 0 8px;
      background: color-mix(in srgb, var(--agy) 12%, transparent);
      color: var(--agy);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    /* display above would otherwise override the hidden attribute. */
    .card[data-card="agy"] .agy-group-toggle[hidden] {
      display: none;
    }
    .card[data-card="agy"] .brand h1 {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card[data-card="agy"] .agy-group-toggle:hover,
    .card[data-card="agy"] .agy-group-toggle:focus-visible {
      background: color-mix(in srgb, var(--agy) 25%, transparent);
    }

    .card[data-card="muse"] .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .card[data-card="muse"] .brand-icon {
      color: var(--accent);
    }

    .hide-muse [data-card="muse"] { display: none; }

    /* Compact layout keeps this theme's header geometry and decoration. */
    html.compact-cards body .card[data-card="projects"] { padding-inline: 13px; }
    html.compact-cards body .card[data-card="projects"] .brand {
      grid-template-columns: 24px minmax(0, 1fr);
      column-gap: 8px;
    }
    html.compact-cards body .card[data-card] .brand-icon svg { width: 15px; height: 15px; }
    /* The folder artwork carries its own padding inside the viewBox. */
    html.compact-cards body .card[data-card="projects"] .brand-icon svg { width: 20px; height: 20px; }
    html.compact-cards body .footer { padding-inline: 13px; }

:root, :root:not(#x) {
  color-scheme: light;

  --claude: #e8734a; --codex: #2fa7b8; --agy: #5b7fe0; --grok: #6c6470; --muse: #2f7de0;

}
body {
  background: #efe6da url("{{ASSET:panels/felt/bg.webp}}") center top / cover no-repeat !important;
  color: var(--text);

}
/* Classic's alert pink is tuned for its dark look; on cream it washes out, so use a deep red. */
.service-alert {
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  border-color: color-mix(in srgb, var(--danger) 45%, transparent);
  color: #a8342a;
}
.card, .footer, .pals-line {
  position: relative; background: transparent !important; border-radius: 18px;

  box-shadow: 0 0 0 2.5px rgba(110, 80, 56, 0.75), 0 3px 8px rgba(90, 65, 45, 0.25) !important;
  border: 0 solid transparent !important;
  border-image: url("{{ASSET:panels/felt/card.webp}}") 57 fill / 22px / 4px stretch !important;
  overflow: visible;
}
.card::before, .footer::before, .pals-line::before {
  content: ""; position: absolute; inset: 2px; border-radius: 15px; pointer-events: none;
  border: 1.6px dashed rgba(120, 88, 62, 0.8);
}
.card { padding: 15px 17px 14px; }
.brand h1 { color: var(--text); font-weight: 800; }
.row-title, .reset { color: var(--muted); }
.percent { font-size: 15px; font-weight: 900; color: color-mix(in srgb, var(--accent) 80%, #4a3a2e); }
.row + .row { border-top: 1px dashed var(--line); }
.track {

  padding: 2px 3px; box-sizing: border-box;
}
.track::after { inset: 3px auto 3px calc(80% - 1px); border-radius: 2px; }
.fill {

  background: var(--fill-color, var(--accent)); background-image: none;
  -webkit-mask-box-image: url("{{ASSET:panels/felt/fill.webp}}") 0 46 / 0 7px stretch;

}
.fill::after {

.switch, .action, .meta > div {

  <script>
// Felt pals. One pal rides the tip of each service card's first quota bar and gets less lively as usage
// rises; the rest wait in line in a felt strip at the bottom of the panel. Every so often the pal at the
// front of the line flips up and takes over a bar, the rider hops down to the back, and the line moves up.
// At the 80% warning line the rider looks worried and keeps signalling with a "!"; at 100% it dozes off;
// when the quota resets everyone cheers. Clicking a pal makes it cheer and say its name.
// Idle breathing is a CSS animation; script only runs during a move, and nothing moves while hidden.
(() => {
  const NAMES = ["redpanda", "frog", "penguin", "rabbit", "raccoon", "piglet", "elephant", "bear", "puppy", "chick", "kitten"];
  const POSES = ["stand", "jump", "worried", "sleep", "cheer"];
  // Display height of each pose relative to standing: sitting is shorter, arms up is a little taller.
  const HEIGHT = { sleep: 0.82, cheer: 1.06 };
  const SIZE = 40;
  const QUEUE_SCALE = 0.88;
  const WARN = 0.8;
  const CONFETTI = ["#e8734a", "#5aa860", "#5b7fe0", "#e6a21f", "#ef7fa0", "#2fa7b8"];
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hidden = () => document.hidden;
  const css = document.createElement("style");
  css.textContent = `
    .pal-img{position:absolute;bottom:0;height:${SIZE}px;width:auto;transform-origin:50% 100%}
    .pal-body.idle .pal-img{animation:pal-breathe 3.3s ease-in-out infinite,pal-sway 8.2s ease-in-out infinite;
      animation-delay:var(--ph),calc(var(--ph) * 2.5)}
    .pal-body.dozing .pal-img{animation:pal-doze 4.4s ease-in-out infinite;animation-delay:var(--ph)}
    @keyframes pal-breathe{50%{scale:0.988 1.025}}
    @keyframes pal-sway{25%{rotate:2deg}75%{rotate:-2deg}}
    @keyframes pal-doze{50%{scale:1.02 1.05}}
    .pal-sil{filter:brightness(0) blur(1.6px);opacity:.26}
    .pal-shadow{position:absolute;left:${-SIZE * 0.3}px;top:-5px;width:${SIZE * 0.6}px;height:6px;z-index:0;border-radius:50%;
      background:radial-gradient(closest-side,rgba(60,38,20,.55),rgba(60,38,20,.22) 55%,rgba(60,38,20,0))}
    .pal-badge,.pal-heart{position:absolute;left:-9px;width:18px;height:18px;border-radius:50%;color:#fff;text-align:center;
      font:900 13px/18px ui-rounded,-apple-system,sans-serif;box-shadow:inset 0 -2px 2px rgba(0,0,0,.2),
      inset 0 1px 1px rgba(255,255,255,.5),0 1px 2px rgba(80,30,20,.35)}
    .pal-badge{background:#d9473a;opacity:0;scale:0;transition:opacity .2s,scale .25s}
    .pal-badge.on{opacity:1;scale:1;animation:pal-pulse 1.1s ease-in-out infinite}
    @keyframes pal-pulse{50%{scale:1.18}}
    .pal-heart{background:#ef7fa0;font-size:11px;animation:pal-rise 1.1s ease-out forwards}
    @keyframes pal-rise{0%{opacity:0;scale:.3}20%{opacity:1;scale:1.1}100%{opacity:0;translate:0 -18px;scale:.9}}
    .pal-name{position:absolute;white-space:nowrap;translate:-50% 0;padding:2px 8px;border-radius:99px;
      font:700 11px/16px ui-rounded,-apple-system,"PingFang TC",sans-serif;color:var(--text,#4a3a2e);
      background:var(--button,#f7efe4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(60,40,25,.25);
      animation:pal-pop 1.8s ease-out forwards}
    @keyframes pal-pop{0%{opacity:0;scale:.3}15%{opacity:1;scale:1.08}25%{scale:1}75%{opacity:1}100%{opacity:0;translate:-50% -14px}}

    } else {
      // A dozing pal only stirs.
      await play(420, (k) => draw(p, p.x, p.y, 1, 1, Math.sin(k * Math.PI * 4) * 5 * (1 - k)), p);
    }
    idle(p);
    p.busy = false;
  }

  // A pal in line turns to its neighbour, both hop, and a heart pops up.
  async function greet(p) {
    const i = queue.indexOf(p);
    const mate = [queue[i - 1], queue[i + 1]].find((o) => o && !o.busy);
    if (!mate) return;
    mate.busy = true;
    const dir = mate.x > p.x ? 1 : -1;
    await Promise.all([turn(p, dir), turn(mate, -dir)]);
    bubble(p, "pal-heart", "♥", SIZE * p.scale + 2, dir * 12 - 9);
    await Promise.all([jump(p, p.x, p.y, 10), jump(mate, mate.x, mate.y, 10)]);
    await wait(500);
    await Promise.all([turn(p, -1), turn(mate, -1)]);
    idle(p);
    idle(mate);
    mate.busy = false;
  }

  async function act(p) {
    if (p.bar >= 0) {
      // Rider: lively when there is quota left, sluggish near the limit.
      const bar = bars()[p.bar];
      if (!bar) return;
      p.pct = bar.pct;
      if (await react(p, bar)) return;
      if (Math.random() < 0.4) await turn(p, -p.face);
      const h = lerp(16, 5, bar.pct / WARN);
      await jump(p, bar.x, bar.y, h);
      if (bar.pct < 0.4 && Math.random() < 0.5) await jump(p, bar.x, bar.y, h * 0.6);
      return;
    }
    // In line: hop on the spot, glance back, or greet a neighbour; always face the front again.
    const roll = Math.random();
    if (roll < 0.4) return jump(p, p.x, p.y, rand(7, 13));
    if (roll < 0.7) {
      await turn(p, 1);
      await wait(rand(500, 1100));
      await turn(p, -1);
      return idle(p);
    }
    return greet(p);
  }

  // Hop every pal in line that is off its slot into place, front first.
  let closing = false;
  async function closeUp() {
    if (closing) return;
    closing = true;
    const moves = queue.map((p, i) => [p, slot(i)]).filter(([p, s]) => !p.busy && Math.abs(p.x - s.x) > 1);
    await Promise.all(moves.map(([p, s], k) => {
      p.busy = true;
      return wait(k * 90)
        .then(() => jump(p, s.x, s.y, 10))
        .then(() => turn(p, -1))
        .then(() => {
          idle(p);
          p.busy = false;
        });
    }));
    closing = false;
  }

  // Shift change: the front of the line takes over a bar, the longest-serving rider goes to the back, the line moves up.
  async function swap() {
    const b = bars();
    // A rider at the warning line stays put so the signal is not lost in a shift change.
    const riders = pals.filter((p) => p.bar >= 0 && !p.busy && b[p.bar] && b[p.bar].pct < WARN);
    const fresh = queue[0];
    if (!riders.length || !fresh || fresh.busy) return;
    const rider = riders.reduce((a, c) => (c.since < a.since ? c : a));
    const i = rider.bar;
    rider.busy = fresh.busy = true;
    // Hand the bar over in one step, so settle() never sees it empty and sends another pal.
    queue.shift();
    queue.push(rider);
    fresh.y += fresh.shift;
    fresh.shift = 0;
    fresh.bar = i;
    fresh.key = b[i].key;
    fresh.pct = fresh.seen = b[i].pct;
    fresh.since = performance.now();
    rider.bar = -1;
    setMood(rider);
    setMood(fresh);
    const back = slot(queue.length - 1);
    await Promise.all([
      jump(fresh, b[i].x, b[i].y, 30, { flip: true, scale: 1 }),
      wait(250).then(() => jump(rider, back.x, back.y, 30, { scale: QUEUE_SCALE })),
    ]);
    fresh.busy = false;
    await turn(rider, -1);
    idle(rider);
    free(rider);
    await closeUp();
  }

  function settle() {
    const b = bars();
    // One rider per bar: extras rejoin the line, empty bars (bars appear once the data renders) take the front.
    b.forEach((_, i) => {
      const on = pals.filter((p) => p.bar === i);
      on.slice(1).filter((p) => !p.busy).forEach((p) => {
        p.bar = -1;
        setMood(p);
        queue.push(p);
      });
      if (on.length) return;
      const p = queue.find((o) => !o.busy);
      if (!p) return;
      queue.splice(queue.indexOf(p), 1);
      p.bar = i;
      p.key = b[i].key;
      p.pct = p.seen = b[i].pct;
      p.since = performance.now();
      if (!p.x || still) {
        p.scale = 1;
        return;
      }
      p.busy = true;
      jump(p, b[i].x, b[i].y, 30, { flip: true, scale: 1 }).then(() => free(p));
    });
    for (const p of pals) {
      if (p.bar >= 0 && !b[p.bar]) p.bar = -1;
      if (p.bar < 0 && !queue.includes(p)) queue.push(p);
    }
    for (const p of pals) {
      if (p.busy) {
        // A pal busy hopping in line finishes its action, but moves with the strip when the footer grows or shrinks.
        const i = p.bar < 0 ? queue.indexOf(p) : -1;
        const off = i >= 0 ? slot(i).y - (p.y + p.shift) : 0;
        if (Math.abs(off) > 1 && Math.abs(off) < 80) {
          p.shift += off;
          // Redraw now: during a pause in its action nothing else would.
          if (p.last) draw(p, ...p.last);
        }
        continue;
      }
      p.y += p.shift;
      p.shift = 0;
      if (p.bar >= 0) {
        const bar = b[p.bar];
        // The bar now shows another card or quota: take its reading as the new baseline, without celebrating or talking.
        if (bar.key !== p.key) {
          p.key = bar.key;
          p.seen = bar.pct;
          p.since = performance.now();
        }
        // p.seen is only written here, so an action that already read the new value cannot hide a crossing.
        const before = p.seen;
        p.pct = p.seen = bar.pct;
        // Quota came back (a reset, or relief from the limit).
        const back = (before >= 0.5 && bar.pct <= before - 0.3) || (before >= 1 && bar.pct < 1);
        if (p.x && before < 0.5 && bar.pct >= 0.5 && bar.pct < WARN) say(p, "half");
        if (!still && p.x) {
          if (back) {
            p.busy = true;
            celebrate(p, bar).then(() => free(p));
            continue;
          }
          // The tip moved (new data or a resize): hop there rather than jump-cut.
          if (Math.hypot(bar.x - p.x, bar.y - p.y) > 2) {
            p.busy = true;
            jump(p, bar.x, bar.y, 8).then(() => free(p));
            continue;
          }
          // Crossed into another mood: react now rather than at the next action.
          if (moodOf(p) !== p.mood) {
            p.busy = true;
            act(p).then(() => free(p));
            continue;
          }
        }
        p.x = bar.x;
        p.y = bar.y;
        p.scale = 1;
        if (still) {
          const changed = setMood(p);
          if (back) say(p, "reset");
          else if (changed && p.mood !== "calm") say(p, p.mood === "asleep" ? "out" : "warn");
          pose(p, rest(p));
        }
      } else {
        if (p.mood !== "calm") {
          setMood(p);
          pose(p, "stand");
        }
        p.scale = QUEUE_SCALE;
        const s = slot(queue.indexOf(p));
        // Snap only on first placement or after a layout change; normal moves hop via closeUp().
        if (!p.x || Math.abs(p.y - s.y) > 1) p.x = s.x;
        p.y = s.y;
      }
      draw(p, p.x, p.y);
    }
    if (!still && queue.some((p, i) => !p.busy && Math.abs(p.x - slot(i).x) > 1)) closeUp();
  }

  // A pal finished moving: re-check its place, since layout changes during a move are skipped.
  function free(p) {
    p.busy = false;
    schedule();
  }

  // Re-place only when the data or the layout changes; coalesce bursts into one frame.
  let pending = false;
  const schedule = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      settle();
    });
  };

  function loop(p) {
    const ms = p.mood === "alert" ? 2600 : p.bar >= 0 ? lerp(1200, 5200, Math.min(p.pct, WARN)) : rand(3000, 7000);
    setTimeout(async () => {
      if (!hidden() && !p.busy) {
        p.busy = true;
        await act(p);
        free(p);
      }
      loop(p);
    }, ms * rand(0.8, 1.2));
  }

  function shifts() {
    setTimeout(async () => {
      if (!hidden()) await swap();
      shifts();
    }, rand(20000, 40000));
  }

  let latest = null;
  let previousAlerts = null;
  let previousToday = null;

  async function startle(p) {
    p.busy = true;
    await jump(p, p.x, p.y, 14);
    free(p);
  }

  async function stretch(p) {
    p.busy = true;
    pose(p, "stand");
    await play(600, (k) => {
      const s = Math.sin(2 * Math.PI * k) * Math.sin(Math.PI * k);
      draw(p, p.x, p.y, 1 - 0.07 * s, 1 + 0.12 * s);
    }, p);
    pose(p, rest(p));
    idle(p);
    free(p);
  }

  function checkSoon() {
    if (!latest) return;
    const now = Date.now() / 1000;
    for (const p of pals) {
      if (p.bar < 0 || p.mood !== "asleep") continue;
      const card = latest[p.key.split("/")[0]];
      // The pal can only wake once all spent quotas have reset.
      const spent = [card?.session, card?.weekly]
        .filter((row) => row?.percent >= 100 && Number.isFinite(row.resetsAt));
      const resetsAt = Math.max(...spent.map((row) => row.resetsAt));
      const remaining = resetsAt - now;
      if (remaining > 0 && remaining <= 600 && p.wakeNoted !== resetsAt && say(p, "soon")) {
        p.wakeNoted = resetsAt;
        if (!still && !p.busy) stretch(p);
      }
    }
  }

  function onState(state) {
    const alerts = new Set(state.footer?.serviceAlertCards);
    if (previousAlerts !== null) {
      for (const p of pals) {
        if (p.bar < 0) continue;
        const id = p.key.split("/")[0];
        const active = alerts.has(id);
        if (active === previousAlerts.has(id)) continue;
        say(p, active ? "outage" : "fixed");
        if (active && !still && !p.busy) startle(p);
      }
    }
    previousAlerts = alerts;

    const today = Number((state.footer?.today?.tokensCount ?? "").replace(/\D/g, ""));
    const yesterday = Number((state.footer?.yesterday?.tokensCount ?? "").replace(/\D/g, ""));
    if (previousToday !== null && yesterday > 0 && previousToday <= yesterday && today > yesterday) {
      const front = queue.find((p) => !p.busy);
      if (front) say(front, "record");
      if (!still) wave();
    }
    previousToday = today;
    checkSoon();
  }

  const start = () => {
    const applyState = window.usageApplyState;
    if (typeof applyState === "function") {
      window.usageApplyState = function (state) {
        const result = applyState.apply(this, arguments);
        latest = state;
        onState(state);
        return result;
      };
    }
    setInterval(() => { if (!hidden()) checkSoon(); }, 30000);
    settle();
    if (still) {
      pals.forEach((p) => p.body.classList.remove("idle", "dozing"));
      return;
    }
    pals.forEach((p, i) => setTimeout(() => loop(p), i * 350));
    shifts();
  };
  new ResizeObserver(schedule).observe(document.body);
  const cards = document.querySelector(".card")?.parentElement;
  if (cards) {
    new MutationObserver(schedule).observe(cards, {
      subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["style", "hidden", "class"],
    });
  }
  // Service alerts grow the footer and push the line down; re-place the pals in line at once instead of leaving
  // them floating where the strip used to be.
  const footer = document.querySelector(".footer");
  if (footer) new MutationObserver(schedule).observe(footer, { subtree: true, childList: true, attributes: true, attributeFilter: ["hidden"] });
  // Catch up on anything that changed while the panel was hidden.
  document.addEventListener("visibilitychange", () => !hidden() && schedule());
  if (document.readyState === "complete") start();
  else addEventListener("load", start);
})();

  </script>

{{CORE_SCRIPT}}  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2e3;
      --card: #fffdf4;
      --ink: #26241f;
      --muted: #6a6552;
      --grid-line: #e3dcc4;
      --claude: #f49164;
      --codex: #58d6e6;
      --agy: #6b9aff;
      --grok: #9e9aa8;
      --projects: #30d158;
      --warn: #ffc439;
      --danger: #ff453a;
      font-family: "Chalkboard SE", "Marker Felt", "Hannotate TC", "HanziPen TC", "Yuanti TC", "Segoe Print", "Comic Sans MS", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      padding: 10px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: inherit;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .card, .footer { position: relative; background: var(--card); padding: 9px 11px 10px; }
    .card::before, .footer::before {
      content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      border: 2.2px solid var(--ink); filter: url(#sketch-wobble);
      border-radius: 13px 16px 12px 17px / 16px 12px 17px 11px;
    }
    .card:nth-child(even)::before { border-radius: 16px 12px 17px 11px / 11px 17px 12px 16px; }
    .card > *, .footer > * { position: relative; z-index: 1; }
    .card:not([data-card="projects"]) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 8px; }
    .brand { display: flex; align-items: center; gap: 7px; min-height: 29px; margin-bottom: 7px; }
    .card:not([data-card="projects"]) .brand { grid-column: 1 / -1; }
    .brand img, .brand-icon {
      display: flex; flex: 0 0 27px; width: 27px; height: 27px; align-items: center; justify-content: center;
      border: 2px solid var(--ink); border-radius: 9px 11px 8px 12px / 11px 8px 12px 9px;
      background: #ffe3d2; object-fit: cover; transform: rotate(-3deg);
    }
    .card[data-card="codex"] .brand img { background: #d8f6fa; }
    .card[data-card="agy"] .brand-icon { background: #dfe8ff; }
    .card[data-card="grok"] .brand-icon { background: #eae7f1; }
    .card[data-card="projects"] .brand-icon { background: #d9f5e1; }
    .brand-icon svg { width: 19px; height: 19px; }
    .brand h1 { flex: 1; min-width: 0; margin: 0; font-size: 17px; line-height: 1.15; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card[data-card="agy"] .brand h1 { flex: none; }
    .card[data-card="codex"] .brand.usage-switch-host h1 { flex: none; }
    .codex-stale { display: inline-flex; align-items: center; gap: 3px; min-width: 0; color: #806016; font-size: 10px; white-space: nowrap; }
    .codex-stale[hidden], [hidden] { display: none !important; }
    .codex-stale-info { position: relative; cursor: help; }
    .codex-stale-tooltip { display: none; position: absolute; z-index: 20; top: 17px; right: 0; width: 195px; padding: 7px; color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 7px; white-space: normal; }
    .codex-stale-info:hover .codex-stale-tooltip { display: block; }
    .codex-credits { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
    .row { display: grid; grid-template-rows: auto 80px auto auto; align-items: start; justify-items: center; min-width: 0; }
    .row-head { display: contents; }
    .row-title { grid-row: 1; font-size: 12px; line-height: 1.25; font-weight: 700; }
    .track { grid-row: 2; width: min(100%, 132px); height: 80px; position: relative; }
    .fill { width: 100%; height: 100%; }
    .fill svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .gauge-base { fill: none; stroke: #fff; stroke-width: 11; }
    .gauge-edge { fill: none; stroke: var(--ink); stroke-width: 1.8; }
    .gauge-progress { fill: none; stroke: var(--fill-color, var(--ink)); stroke-width: 11; }
    .gauge-floor { stroke: var(--ink); stroke-width: 2; }
    .gauge-threshold { stroke: var(--ink); stroke-width: 2.5; }
    .gauge-needle { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
    .gauge-hub { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
    .percent { grid-row: 3; margin-top: 2px; padding: 0 4px; color: var(--ink) !important; font-size: 20px; line-height: 1.2; font-weight: 800; text-align: center; white-space: nowrap; background: linear-gradient(transparent 55%, color-mix(in srgb, var(--fill-color, transparent) 55%, transparent) 55%); }
    .reset { grid-row: 4; margin-top: 2px; color: var(--ink); font-size: 11px; line-height: 1.3; text-align: center; }
    .reset[data-warning="true"] { color: #9b591a; }
    .row[data-available="false"] .percent, .row[data-available="false"] .reset { color: var(--muted) !important; background: none; }
    .card[data-card="grok"] .row, .card[data-card="codex"]:has(.row[data-row="session"][hidden]) .row[data-row="weekly"] { grid-column: 1 / -1; width: 50%; justify-self: center; }
    .switch, .action, .agy-group-toggle {
      position: relative; display: inline-flex; justify-content: center; align-items: center; min-height: 25px; padding: 2px 8px;
      background: #fff; color: var(--ink); border: 1.8px solid var(--ink); border-radius: 10px 12px 9px 13px / 12px 9px 13px 10px;
      font: inherit; font-size: 11px; line-height: 1.2; white-space: nowrap; cursor: pointer;
    }
    .switch:hover, .action:hover, .agy-group-toggle:hover { background: #fff0c7; }
    .switch:focus-visible, .action:focus-visible, .agy-group-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .switch[data-active="true"] { background: #d9f5e1; box-shadow: 2px 2px 0 var(--ink); }
    .agy-group-toggle { flex: none; background: #e8efff; padding: 1px 6px; }
    .project-actions { display: flex; gap: 5px; margin: 7px 0 6px; }
    .project-actions .switch { flex: 1; min-width: 0; }
    .card[data-card="projects"] .brand { flex-wrap: wrap; margin-bottom: 0; }
    .card[data-card="projects"] .project-actions { flex: 0 0 100%; }
    .proj-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; padding: 5px 0 4px; border-top: 1.5px dashed #8f8a76; font-size: 11px; }
    .proj-rank { flex: none; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 1.5px solid var(--ink); border-radius: 50%; background: #fff; }
    .proj-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .proj-tokens { font-weight: 700; white-space: nowrap; }
    .proj-cost { min-width: 38px; text-align: right; white-space: nowrap; }
    .proj-bar { flex: 0 0 100%; height: 9px; margin-top: 2px; border: 1.8px solid var(--ink); border-radius: 6px 8px 6px 9px / 8px 6px 9px 6px; background: #fff; overflow: hidden; }
    .proj-bar-fill { height: 100%; background: repeating-linear-gradient(-55deg, #30d158 0 4px, #79dc8c 4px 7px); }
    .footer { padding: 10px 11px 11px; }
    .meta { display: flex; gap: 5px; flex-wrap: wrap; font-size: 11px; }
    .meta > div { padding: 2px 7px; border: 1.5px solid var(--ink); border-radius: 11px 13px 10px 14px / 13px 10px 14px 11px; background: #fff; }
    .today { margin: 7px 0; font-size: 12px; font-weight: 700; }
    .actions { display: flex; gap: 7px; }
    .action { flex: 1; min-width: 0; min-height: 31px; font-size: 12px; }
    .action.primary { background: #e8efff; box-shadow: 2px 2px 0 var(--ink); }
    .action[data-action="install"] { display: none; }
    .action[data-action="install"][data-visible="true"] { display: inline-flex; }
    .attribution { margin: 7px 0 0; color: var(--muted); font-size: 10px; text-align: center; }
    .attribution a { color: inherit; }
    [data-footer="service-alerts"] { margin-bottom: 6px; }
    .service-alert { padding: 4px; border: 1px solid var(--ink); border-radius: 5px; font-size: 11px; }
    .hide-codex [data-card="codex"], .hide-claude [data-card="claude"], .hide-agy [data-card="agy"], .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"], .card[data-card="codex"], .card[data-card="agy"], .card[data-card="grok"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: .72; }
    .is-card-dragging, .is-card-dragging * { user-select: none; }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="sketch-wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2"/></filter></defs></svg>
  <main class="wrap">
    <section class="card" data-card="claude" style="--accent: var(--claude)">
      <header class="brand">
        <img src="{{CLAUDE_ICON}}" alt="">
        <h1 data-i18n="claude_name">Claude Code</h1>
        <button class="switch" data-action="switch" data-i18n="switch_panel">⇄ Switch Panel</button>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="codex" style="--accent: var(--codex)">
      <header class="brand">
        <img src="{{CODEX_ICON}}" alt="">
        <h1 data-i18n="codex_name">Codex</h1>
        <div class="codex-stale" data-codex-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-codex-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="agy" style="--accent: var(--agy)">
      <header class="brand">
        <div class="brand-icon"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
        <h1 data-i18n="agy_name">Antigravity</h1>
        <button type="button" class="agy-group-toggle" data-action="set_agy_quota_group" title="" aria-label=""></button>
        <div class="codex-stale" data-agy-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-agy-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-agy-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="grok" style="--accent: var(--grok)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></div>
        <h1 data-i18n="grok_name">Grok</h1>
        <div class="codex-stale" data-grok-stale hidden>
          <span aria-hidden="true">⚠</span><span data-grok-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-grok-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="projects" style="--accent: var(--projects)">
      <header class="brand">
        <div class="brand-icon"><svg width="30" height="30" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.75 8.25C4.75 7.14543 5.64543 6.25 6.75 6.25H10.5729C10.9737 6.25 11.3598 6.40073 11.6548 6.67228L12.9952 7.90522C13.2902 8.17677 13.6763 8.3275 14.0771 8.3275H19.25C20.3546 8.3275 21.25 9.22293 21.25 10.3275V17.75C21.25 18.8546 20.3546 19.75 19.25 19.75H6.75C5.64543 19.75 4.75 18.8546 4.75 17.75V8.25Z" stroke="var(--projects)" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.25 11.25H18.75" stroke="var(--projects)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/><path d="M8.75 14.15C8.75 13.4596 9.30964 12.9 10 12.9H10.3C10.9904 12.9 11.55 13.4596 11.55 14.15V16.5H8.75V14.15Z" fill="var(--projects)" opacity="0.18" stroke="var(--projects)" stroke-width="1.4"/><path d="M12.6 13.25C12.6 12.6425 13.0925 12.15 13.7 12.15H14.05C14.6575 12.15 15.15 12.6425 15.15 13.25V16.5H12.6V13.25Z" fill="var(--projects)" opacity="0.3" stroke="var(--projects)" stroke-width="1.4"/><path d="M16.2 14.85C16.2 14.1873 16.7373 13.65 17.4 13.65H17.75C18.4127 13.65 18.95 14.1873 18.95 14.85V16.5H16.2V14.85Z" fill="var(--projects)" opacity="0.48" stroke="var(--projects)" stroke-width="1.4"/></svg></div>
        <h1 data-i18n="projects_title">Project Usage</h1>
        <div class="codex-stale" data-history-error hidden>
          <span aria-hidden="true">⚠</span>
          <span data-history-error-text></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-history-error-tooltip></span>
          </span>
        </div>
        <div class="project-actions">
          <button class="switch" data-action="toggle-project-range">Today</button>
          <button class="switch" data-action="analyze" data-i18n="analyze_usage">Analyze</button>
          <button class="switch" data-action="toggle-statusline" data-i18n="cli">CLI</button>
        </div>
      </header>
      <div data-project-list></div>
    </section>

    <section class="footer">
      <div data-footer="service-alerts" hidden></div>
      <div class="meta">
        <div data-footer="rate">Rate: --</div>
        <div data-footer="status">Status: Loading</div>
      </div>
      <div class="today" data-footer="today">Today: $0.00 (0 tokens)</div>

      <div class="actions">
        <button class="action primary" data-action="refresh" data-i18n="refresh_now">↻ Refresh Now</button>
        <button class="action" data-action="quit" data-i18n="quit">⏻ Quit</button>
        <button class="action" data-action="install" data-i18n="install_hook">Install Hook</button>
      </div>
      <p class="attribution">based on <a href="https://github.com/aqua5230/usage" target="_blank">usage</a> by lollapalooza</p>
    </section>
  </main>

  <script>
    window.PanelHooks = {
      applyFillVisual(fillEl, { available, percent, color }) {
        const value = available && Number.isFinite(percent) ? Math.max(0, Math.min(100, percent)) : 0;
        fillEl.style.setProperty("--pct", value);
        (fillEl.closest(".row") || fillEl).style.setProperty("--fill-color", color);
        const ns = "http://www.w3.org/2000/svg";
        if (!fillEl.firstElementChild) {
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", "0 0 120 75");
          svg.setAttribute("aria-hidden", "true");
          const add = (tag, className, attributes) => {
            const element = document.createElementNS(ns, tag);
            element.setAttribute("class", className);
            for (const [name, attribute] of Object.entries(attributes)) element.setAttribute(name, attribute);
            svg.append(element);
          };
          const arc = "M 12 62 A 48 48 0 0 1 108 62";
          add("path", "gauge-base", { d: arc });
          add("path", "gauge-progress", { d: arc });
          add("path", "gauge-edge", { d: "M 6.5 62 A 53.5 53.5 0 0 1 113.5 62" });
          add("path", "gauge-edge", { d: "M 17.5 62 A 42.5 42.5 0 0 1 102.5 62" });
          add("line", "gauge-floor", { x1: 8, y1: 62, x2: 112, y2: 62 });
          const tickAngle = Math.PI * 0.2;
          add("line", "gauge-threshold", {
            x1: 60 + 45 * Math.cos(tickAngle), y1: 62 - 45 * Math.sin(tickAngle),
            x2: 60 + 55 * Math.cos(tickAngle), y2: 62 - 55 * Math.sin(tickAngle)
          });
          add("line", "gauge-needle", { x1: 60, y1: 62, x2: 23, y2: 62 });
          add("circle", "gauge-hub", { cx: 60, cy: 62, r: 5.5 });
          fillEl.append(svg);
        }
        const arcLength = Math.PI * 48;
        fillEl.querySelector(".gauge-progress").setAttribute("stroke-dasharray", `${arcLength * value / 100} ${arcLength}`);
        const angle = Math.PI * (1 - value / 100);
        const needle = fillEl.querySelector(".gauge-needle");
        needle.setAttribute("x2", 60 + 37 * Math.cos(angle));
        needle.setAttribute("y2", 62 - 37 * Math.sin(angle));
      }
    };
  </script>
  <script>
{{CORE_SCRIPT}}  </script>
</body>
</html>

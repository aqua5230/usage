<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --muse: #0082FB;
      --bg: #008080;
      --panel: #c0c0c0;
      --panel-light: #ffffff;
      --panel-mid: #dfdfdf;
      --panel-shadow: #808080;
      --panel-dark: #404040;
      --line: #9a9a9a;
      --text: #000000;
      --muted: #404040;
      --title-start: #000080;
      --title-end: #1084d0;
      --claude: #f49164;
      --codex: #1084d0;
      --agy: #3f74e8;
      --grok: #000000;
      --projects: #008000;
      --warn: #d97c00;
      --danger: #c00000;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Tahoma", "Geneva", "MS Sans Serif", sans-serif;
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: 0;
      overscroll-behavior: none;
    }

    body {
      padding: 10px;
      background: #008080;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .card,
    .footer {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
      border-radius: 0;
      overflow: hidden;
      flex: none;
    }

    .card {
      padding: 2px;
    }

    .card[data-card="projects"] {
      flex: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      min-height: 24px;
      gap: 6px;
      margin: 0 0 8px;
      padding: 3px 4px;
      background: linear-gradient(to right, #000080 0%, #1084d0 100%);
      color: #ffffff;
      font-weight: 700;
    }

    .brand img {
      width: 20px;
      height: 20px;
      object-fit: cover;
      flex: none;
    }

    .brand-icon {
      width: 20px;
      height: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      color: #ffffff;
      line-height: 1;
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
    }

    .brand h1 {
      margin: 0;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ffffff;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;
    }

    .card[data-card="projects"] .brand {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      align-items: center;
      height: auto;
      min-height: 0;
      column-gap: 6px;
      row-gap: 8px;
      margin-bottom: 8px;
    }

    .card[data-card="projects"] .brand-icon {
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
    }

    .card[data-card="projects"] h1 {
      grid-column: 2;
      grid-row: 1;
      flex: none;
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .card[data-card="projects"] .switch {
      grid-column: 1 / 3;
      grid-row: 2;
      width: calc((100% - 8px) / 2);
    }

    .card[data-card="projects"] .switch:nth-of-type(1) {
      justify-self: start;
    }

    .card[data-card="projects"] .switch:nth-of-type(2) {
      justify-self: end;
    }


    .switch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 18px;
      padding: 2px 8px;
      background: #c0c0c0;
      color: #000000;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.1;
      font-weight: 700;
      border: 2px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
      border-radius: 0;
      white-space: nowrap;
    }

    .row,
    [data-project-list] {
      padding: 0 8px 8px;
    }

    .row + .row {
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 8px;
    }

    .card[data-card="claude"] .row:last-child,
    .card[data-card="codex"] .row:last-child {
      padding-bottom: 16px;
    }

    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
    }

    .row-title {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
    }

    .percent {
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .track {
      position: relative;
      height: 14px;
      overflow: hidden;
      background: #ffffff;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      box-shadow: inset 1px 1px 0 #404040;
      border-radius: 0;
      padding: 1px;
    }

    .track::before {
      content: "";
      position: absolute;
      inset: 1px;
      background: repeating-linear-gradient(
        to right,
        transparent 0 10px,
        rgba(192, 192, 192, 0.95) 10px 12px
      );
      pointer-events: none;
      z-index: 2;
    }

    .fill {
      width: 0%;
      height: 100%;
      min-width: 0;
      position: relative;
      z-index: 1;
      background: var(--accent);
      transition: width 140ms ease-out, background-color 140ms ease-out;
    }

    .reset {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      font-weight: 400;
      text-align: right;
      white-space: nowrap;
    }

    .reset[data-warning="true"] {
      color: #c00000;
      font-weight: 700;
    }

    .row[data-available="false"] .percent,
    .row[data-available="false"] .reset {
      color: var(--muted);
    }

    .row[data-available="false"] .fill {
      width: 0%;
    }

    .proj-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      padding: 8px 4px;
      font-size: 14px;
      line-height: 1.3;
    }

    .proj-rank {
      width: 18px;
      color: var(--muted);
      font-weight: 700;
      flex: none;
    }

    .proj-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-tokens {
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
    }

    .proj-cost {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .proj-bar {
      flex: 0 0 100%;
      width: 100%;
      height: 3px;
      margin-top: 6px;
      align-self: end;
      overflow: hidden;
      border-radius: 2px;
      background: #9a9a9a;
      border: 1px solid var(--panel-shadow);
      box-shadow: inset 1px 1px 0 var(--panel-dark), inset -1px -1px 0 var(--panel-light);
    }

    .proj-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--projects);
      opacity: 0.7;
    }

    .proj-row:first-child .proj-bar {
      height: 3.5px;
    }

    .proj-row:first-child .proj-bar-fill {
      opacity: 1;
    }

    .proj-row:last-child .proj-bar {
      margin-bottom: 10px;
    }

    .footer {
      min-height: 144px;
      padding: 10px 12px 12px;
    }

    .service-alert {
      padding: 3px 8px;
      border-radius: 0;
      background: #ffc0c0;
      border: 1px solid var(--danger);
      color: #800000;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    [data-footer="service-alerts"] {
      display: grid;
      gap: 4px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: #000000;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 400;
    }

    .today {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      background: #c0c0c0;
      color: #000000;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 700;
      border: 2px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
      border-radius: 0;
      padding: 4px 10px;
      white-space: normal;
      min-width: 0;
      flex: 1;
    }

    .action,
    .switch {
      transition: none;
    }

    .action:active,
    .switch:active {
      border-color: #404040 #ffffff #ffffff #404040;
      box-shadow: inset 1px 1px 0 #808080;
      transform: translate(1px, 1px);
    }

    .action.primary {
      color: #000080;
    }

    .action.primary:hover {
      background: #dfdfdf;
      color: #000080;
      box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080;
    }

    .action:not(.primary):hover {
      background: #dfdfdf;
      color: #000000;
    }

    .switch:hover {
      background: #dfdfdf;
      border-color: #ffffff #202020 #202020 #ffffff;
    }


    .attribution {
      font-size: 10px;
      color: #404040;
      text-align: center;
      margin-top: 6px;
    }

    .attribution a {
      color: inherit;
      text-decoration: none;
    }

    .action[data-action="install"] {
      display: none;
    }

    .action[data-action="install"][data-visible="true"] {
      display: inline-block;
      flex: 1;
    }



    .hide-codex [data-card="codex"] { display: none; }
    .hide-claude [data-card="claude"] { display: none; }
    .hide-agy [data-card="agy"] { display: none; }
    .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"],
    .card[data-card="codex"],
    .card[data-card="agy"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: 0.78; box-shadow: 4px 4px 0 #404040, inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080; transform: translate(-2px, -2px); }
    .is-card-dragging, .is-card-dragging * { user-select: none; }

    .codex-stale {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none;
      min-width: 0;
      color: var(--danger);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
      margin-left: auto;
      padding-right: 4px;
    }

    .codex-stale[hidden] {
      display: none;
    }

    .codex-credits {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .codex-stale-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: #000000;
      font-size: 11px;
      line-height: 1;
      cursor: help;
    }

    .codex-stale-tooltip {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      right: 0;
      display: none;
      width: max-content;
      max-width: 200px;
      padding: 3px 6px;
      background: #ffffe1;
      color: #000000;
      border: 1px solid #000000;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
      font-size: 11px;
      line-height: 1.3;
      font-weight: 400;
      white-space: normal;
      text-align: left;
    }

    .codex-stale-info:hover .codex-stale-tooltip {
      display: block;
    }

    .card[data-card="agy"] .agy-group-toggle {
      flex: 0 0 auto;
      padding: 1px 6px;
      background: #c0c0c0;
      color: #000000;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      border: 2px solid;
      border-color: #ffffff #404040 #404040 #ffffff;
      box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
      border-radius: 0;
      white-space: nowrap;
      cursor: pointer;
    }
    .card[data-card="agy"] .brand h1 {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card[data-card="agy"] .agy-group-toggle:active {
      border-color: #404040 #ffffff #ffffff #404040;
      box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
    }

    .hide-muse [data-card="muse"] { display: none; }

    .card[data-card="muse"] .brand-icon { color: #ffffff; }

    /* Compact cards keep the Win95 window chrome: a full-width title bar and the 8px inner margin. */
    html.compact-cards .card[data-card]:is([data-card="claude"], [data-card="codex"], [data-card="agy"], [data-card="grok"], [data-card="muse"]) {
      padding: 2px;
    }
    html.compact-cards .card[data-card]:is([data-card="claude"], [data-card="codex"], [data-card="agy"], [data-card="grok"], [data-card="muse"]) > .row {
      padding-bottom: 8px;
    }
    /* Compact layout keeps this theme's header geometry and decoration. */
    html.compact-cards body .card[data-card]:not([data-card="projects"]) > .brand {
      height: 26px;
      gap: 6px;
      padding: 3px 4px;
    }
    html.compact-cards body .card[data-card] .brand :is(img, .brand-icon) {
      width: 20px; height: 20px; flex-basis: 20px; border-radius: 0;
    }
    html.compact-cards body .card[data-card] .brand h1 { font-size: 13px; }
    html.compact-cards body .card[data-card="projects"] .brand h1 { font-size: 13px; }
    /* Stale warnings need their own light surface on the blue title bar (all sizes). */
    .codex-stale {
      background: var(--panel-light);
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" data-card="claude" style="--accent: var(--claude)">
      <header class="brand">
        <img src="{{CLAUDE_ICON}}" alt="">
        <h1 data-i18n="claude_name">Claude Code</h1>
        <button class="switch" data-action="switch" data-i18n="settings_button">⚙ Settings</button>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="codex" style="--accent: var(--codex)">
      <header class="brand">
        <img src="{{CODEX_ICON}}" alt="">
        <h1 data-i18n="codex_name">Codex</h1>
        <div class="codex-stale" data-codex-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-codex-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="agy" style="--accent: var(--agy)">
      <header class="brand">
        <div class="brand-icon"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
        <h1 data-i18n="agy_name">Antigravity</h1>
        <button type="button" class="agy-group-toggle" data-action="set_agy_quota_group" title="" aria-label=""></button>
        <div class="codex-stale" data-agy-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-agy-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-agy-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="grok" style="--accent: var(--grok)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></div>
        <h1 data-i18n="grok_name">Grok</h1>
        <div class="codex-stale" data-grok-stale hidden>
          <span aria-hidden="true">⚠</span><span data-grok-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-grok-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="muse" style="--accent: var(--muse)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M24.6257 16.1214C28.2365 16.1214 30.8187 18.9408 30.8187 23.3643C30.8185 27.7868 30.1055 31.7765 28.9225 40.2466C28.0743 46.1813 26.62 55.2418 26.0132 59.0088C27.1782 56.7815 29.9074 51.5757 30.3914 50.5982C36.1081 39.061 42.0657 28.7544 43.7826 26.0254C46.0594 22.382 48.062 20.9229 51.1597 20.9229C52.7685 20.923 54.6826 21.7357 55.6315 22.819C56.9178 24.2895 57.1859 26.6602 57.1411 29.244C57.0738 33.2073 56.5599 39.5264 55.8553 46.5698C55.5416 49.7057 54.9365 56.1066 54.5288 60.4004C58.1883 53.8532 64.9609 41.8109 67.6921 37.6058C70.0727 33.9402 72.466 31.5797 75.6836 31.5796C78.4595 31.5796 81.8809 33.5416 81.6772 38.7573C81.3774 46.4556 80.2673 63.2232 79.7607 70.7479C83.1662 65.7913 87.6377 58.4543 89.3148 55.6966C91.0104 52.908 92.75 50.6542 95.3898 50.5778C98.0987 50.4995 99.913 52.341 99.9959 55.1839C100.078 58.0277 98.3835 61.2256 96.1344 64.856C93.6937 68.7957 90.9621 73.0123 87.6383 76.9491C84.3148 80.8856 81.2604 83.8782 76.5991 83.8786C72.4243 83.8786 69.4869 81.1043 69.283 76.0254C69.1768 73.364 69.6804 67.6405 70.0602 63.1673C70.5 57.9875 71.0315 52.9861 71.403 49.6786C67.7337 56.3979 60.0101 70.4676 56.5348 75.9603C53.1343 81.3339 51.4774 83.2269 47.8882 83.2275C44.2977 83.2275 42.7226 80.6416 42.6717 76.7497C42.6142 72.5285 45.7852 47.1821 46.8587 38.737C45.1183 42.4616 40.839 51.6056 38.1551 57.0435C35.5587 62.3055 31.204 71.3978 28.0436 76.6357C25.7668 80.4094 23.2092 83.2273 19.4173 83.2275C15.6252 83.2275 13.4847 80.6784 13.4847 76.5788C13.4847 72.4794 14.6716 65.6492 15.9465 57.1777C16.5839 53.0781 17.3108 48.6133 18.1315 43.8761C18.7324 40.448 19.7764 34.4169 20.4183 30.7129C17.502 35.2539 12.2536 43.4278 10.6567 45.8903C8.88113 48.6291 7.28747 50.626 4.64681 50.6266C1.7329 50.6266 0.000532901 48.3522 0 45.7113C0 43.0703 1.34323 41.0344 3.52376 37.4512C6.32403 32.8465 11.3578 26.57 14.1154 23.2747C17.3656 19.3912 20.6139 16.1219 24.6257 16.1214Z"/></svg></div>
        <h1 data-i18n="muse_name">Muse</h1>
        <div class="codex-stale" data-muse-stale hidden>
          <span aria-hidden="true">⚠</span><span data-muse-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-muse-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="projects" style="--accent: var(--projects)">
      <header class="brand">
        <div class="brand-icon"><svg width="30" height="30" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.75 8.25C4.75 7.14543 5.64543 6.25 6.75 6.25H10.5729C10.9737 6.25 11.3598 6.40073 11.6548 6.67228L12.9952 7.90522C13.2902 8.17677 13.6763 8.3275 14.0771 8.3275H19.25C20.3546 8.3275 21.25 9.22293 21.25 10.3275V17.75C21.25 18.8546 20.3546 19.75 19.25 19.75H6.75C5.64543 19.75 4.75 18.8546 4.75 17.75V8.25Z" stroke="var(--projects)" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.25 11.25H18.75" stroke="var(--projects)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/><path d="M8.75 14.15C8.75 13.4596 9.30964 12.9 10 12.9H10.3C10.9904 12.9 11.55 13.4596 11.55 14.15V16.5H8.75V14.15Z" fill="var(--projects)" opacity="0.18" stroke="var(--projects)" stroke-width="1.4"/><path d="M12.6 13.25C12.6 12.6425 13.0925 12.15 13.7 12.15H14.05C14.6575 12.15 15.15 12.6425 15.15 13.25V16.5H12.6V13.25Z" fill="var(--projects)" opacity="0.3" stroke="var(--projects)" stroke-width="1.4"/><path d="M16.2 14.85C16.2 14.1873 16.7373 13.65 17.4 13.65H17.75C18.4127 13.65 18.95 14.1873 18.95 14.85V16.5H16.2V14.85Z" fill="var(--projects)" opacity="0.48" stroke="var(--projects)" stroke-width="1.4"/></svg></div>
        <h1 data-i18n="projects_title">Project Usage</h1>
        <div class="codex-stale" data-history-error hidden>
          <span aria-hidden="true">⚠</span>
          <span data-history-error-text></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-history-error-tooltip></span>
          </span>
        </div>
        <button class="switch" data-action="toggle-project-range">Today</button>
        <button class="switch" data-action="analyze" data-i18n="analyze_usage">Analyze</button>
      </header>
      <div data-project-list></div>
    </section>

    <section class="footer">
      <div data-footer="service-alerts" hidden></div>
      <div class="meta">
        <div data-footer="rate">Rate: --</div>
        <div data-footer="status">Status: Loading</div>
      </div>
      <div class="today" data-footer="today">Today: $0.00 (0 tokens)</div>

      <div class="actions">
        <button class="action primary" data-action="refresh" data-i18n="refresh_now">↻ Refresh Now</button>
        <button class="action" data-action="quit" data-i18n="quit">⏻ Quit</button>
        <button class="action" data-action="install" data-i18n="install_hook">Install Hook</button>
      </div>
      <p class="attribution">based on <a href="https://github.com/aqua5230/usage" target="_blank">usage</a> by lollapalooza</p>
    </section>
  </main>

  <script>
    window.PanelHooks = {
      applyFillVisual(fillEl, { available, percent, color }) {
        fillEl.style.width = available ? `${Math.max(0, Math.min(100, percent))}%` : "0%";
        fillEl.style.background = color;
      },
      projectRankLabels: ["①", "②", "③"],
    };
  </script>
  <script>
{{CORE_SCRIPT}}  </script>
</body>
</html>

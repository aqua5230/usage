<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark; --bg: #000; --panel: #020c08; --line: rgba(64,255,170,.18);
      --text: #eafff3; --muted: #8abda0; --track: #0b1d14;
      --claude: #f49164; --codex: #58d6e6; --agy: #6b9aff;
      --grok: #e9e9ee; --projects: #30d158; --warn: #ffc439; --danger: #ff453a;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      padding: 10px; color: var(--text); background-color: var(--bg);
      background-image: repeating-linear-gradient(0deg, rgba(0,120,70,.13) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(0,120,70,.13) 0 1px, transparent 1px 28px);
      font-family: inherit; -webkit-font-smoothing: antialiased;
    }
    .wrap { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .card, .footer {
      position: relative; padding: 9px 11px 10px; border: 1px solid var(--line);
      border-radius: 10px; background: rgba(2,12,8,.96); overflow: hidden;
    }
    .card[data-card="codex"], .card[data-card="agy"], .card[data-card="grok"] { overflow: visible; }
    .brand { display: flex; align-items: center; gap: 7px; min-height: 28px; margin-bottom: 7px; }
    .brand::before {
      content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      animation: monitor-blink 2.8s ease-in-out infinite;
    }
    .brand img, .brand-icon {
      display: flex; flex: none; width: 25px; height: 25px; align-items: center;
      justify-content: center; object-fit: cover; border: 1px solid var(--accent);
      border-radius: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .brand-icon { color: var(--accent); }
    .brand-icon svg { width: 19px; height: 19px; }
    .brand h1 {
      flex: 1; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 17px; line-height: 1.15; font-weight: 700;
    }
    .card[data-card="agy"] .brand h1, .card[data-card="codex"] .brand.usage-switch-host h1 { flex: 0 1 auto; }
    .codex-stale { display: inline-flex; align-items: center; gap: 3px; min-width: 0; color: var(--warn); font-size: 10px; white-space: nowrap; }
    .codex-stale-info { position: relative; cursor: help; }
    .codex-stale-tooltip {
      display: none; position: absolute; z-index: 20; top: 18px; right: 0;
      width: 210px; padding: 7px; white-space: normal; color: var(--text);
      background: #06180f; border: 1px solid var(--line); border-radius: 6px;
    }
    .codex-stale-info:hover .codex-stale-tooltip { display: block; }
    .codex-credits { color: var(--muted); font-size: 11px; }
    [hidden] { display: none !important; }
    .row {
      --pct: 0; display: grid; grid-template-columns: minmax(0,1fr) auto;
      grid-template-rows: auto 34px auto 5px; align-items: center;
      column-gap: 8px; row-gap: 2px; min-width: 0; margin-top: 7px;
    }
    .row + .row { padding-top: 8px; border-top: 1px solid var(--line); }
    .row-head { display: contents; }
    .row-title { grid-column: 1 / -1; grid-row: 1; color: var(--muted); font-size: 12px; letter-spacing: .11em; }
    .percent {
      grid-column: 2; grid-row: 2; justify-self: end; color: var(--trace-color, var(--accent));
      font: 700 23px/1 var(--mono); white-space: nowrap; text-align: right;
      font-variant-numeric: tabular-nums; text-shadow: 0 0 10px var(--trace-color, var(--accent));
    }
    .reset {
      grid-column: 2; grid-row: 3; justify-self: end; color: var(--muted);
      font-size: 11px; line-height: 1.2; white-space: nowrap; text-align: right;
    }
    .reset[data-warning="true"] { color: var(--warn); }
    .ecg-wave {
      grid-column: 1; grid-row: 2 / 4; align-self: stretch; position: relative;
      min-width: 0; overflow: hidden; border: 1px solid var(--line);
      border-radius: 5px; background: rgba(0,8,5,.9);
    }
    .ecg-trace {
      display: flex; width: 340px; height: 100%; color: var(--trace-color, var(--accent));
      animation: ecg-scroll calc(11s - var(--pct) * 80ms) linear infinite;
    }
    .ecg-trace svg { display: block; flex: 0 0 170px; width: 170px; height: 100%; overflow: visible; }
    .ecg-heartbeat {
      fill: none; stroke: currentColor; stroke-width: 1.6;
      filter: drop-shadow(0 0 3px currentColor);
      transform-origin: center; transform: scaleY(calc(.3 + var(--pct) * .007));
    }
    .ecg-flat { opacity: 0; fill: none; stroke: var(--muted); stroke-width: 1; }
    .ecg-dot {
      position: absolute; right: 6px; top: calc(50% - 3px); width: 6px; height: 6px;
      border-radius: 50%; background: var(--trace-color, var(--accent));
      box-shadow: 0 0 7px var(--trace-color, var(--accent));
      animation: monitor-blink 1.7s ease-in-out infinite;
    }
    .track {
      grid-column: 1 / -1; grid-row: 4; position: relative; height: 5px;
      border-radius: 3px; background: var(--track); overflow: visible;
    }
    .track::after {
      content: ""; position: absolute; z-index: 1; top: -2px; bottom: -2px;
      left: calc(80% - 1px); width: 2px; border-radius: 1px; background: #d7efe2;
    }
    .fill { width: 0; height: 100%; border-radius: inherit; background: var(--trace-color, var(--accent)); }
    .row[data-available="false"] .percent, .row[data-available="false"] .reset { color: var(--muted) !important; text-shadow: none; }
    .row[data-available="false"] .ecg-trace, .row[data-available="false"] .ecg-dot { animation: none; }
    .row[data-available="false"] .ecg-heartbeat, .row[data-available="false"] .ecg-dot { opacity: 0; }
    .row[data-available="false"] .ecg-flat { opacity: 1; }
    .switch, .action, .agy-group-toggle {
      display: inline-flex; align-items: center; justify-content: center; min-height: 26px;
      padding: 3px 8px; border: 1px solid rgba(64,255,170,.35);
      border-radius: 6px; background: rgba(0,60,35,.4); color: #b9f4d6;
      font: inherit; font-size: 11px; line-height: 1.2; white-space: nowrap; cursor: pointer;
    }
    .switch:hover, .action:hover, .agy-group-toggle:hover { background: rgba(0,90,52,.6); }
    .switch:focus-visible, .action:focus-visible, .agy-group-toggle:focus-visible { outline: 2px solid var(--accent, var(--projects)); outline-offset: 2px; }
    .switch[data-active="true"] { border-color: var(--projects); color: var(--projects); }
    .agy-group-toggle { flex: none; color: #9dc3f5; border-color: rgba(107,154,255,.55); background: rgba(30,60,140,.25); }
    .card[data-card="projects"] .brand { flex-wrap: wrap; margin-bottom: 0; }
    .project-actions { display: flex; flex: 0 0 100%; gap: 6px; margin: 7px 0 5px; }
    .project-actions .switch { flex: 1; min-width: 0; }
    .proj-row {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px;
      padding: 5px 0 4px; border-top: 1px solid var(--line); font-size: 11px;
    }
    .proj-rank {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 4px; background: var(--projects); color: #021108; font-weight: 700;
    }
    .proj-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .proj-tokens { color: var(--projects); font: 700 12px var(--mono); white-space: nowrap; text-shadow: 0 0 7px rgba(48,209,88,.5); }
    .proj-cost { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
    .proj-bar { flex: 0 0 100%; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .proj-bar-fill { height: 100%; border-radius: inherit; background: var(--projects); box-shadow: 0 0 8px rgba(48,209,88,.5); }
    .footer { padding: 10px 11px; }
    .meta { display: flex; gap: 5px; flex-wrap: wrap; font-size: 11px; }
    .meta > div { padding: 3px 7px; border: 1px solid rgba(64,255,170,.3); border-radius: 6px; color: #9fd8bb; background: rgba(0,50,30,.5); }
    .today { margin: 8px 0; color: var(--text); font: 700 13px var(--mono); }
    .actions { display: flex; gap: 7px; }
    .action { flex: 1; min-width: 0; min-height: 31px; font-size: 12px; }
    .action.primary { color: #9dc3f5; border-color: rgba(107,154,255,.55); background: rgba(30,60,140,.3); }
    .action[data-action="quit"] { color: #ffb3ab; border-color: rgba(255,120,110,.5); background: rgba(120,25,20,.3); }
    .action[data-action="install"] { display: none; }
    .action[data-action="install"][data-visible="true"] { display: inline-flex; }
    .attribution { margin: 7px 0 0; color: #648c76; font-size: 10px; text-align: center; }
    .attribution a { color: inherit; }
    [data-footer="service-alerts"] { margin-bottom: 6px; }
    .service-alert { padding: 4px; border: 1px solid var(--danger); border-radius: 5px; font-size: 11px; }
    .hide-codex [data-card="codex"], .hide-claude [data-card="claude"], .hide-agy [data-card="agy"], .hide-grok [data-card="grok"] { display: none; }
    .card[data-card="claude"], .card[data-card="codex"], .card[data-card="agy"], .card[data-card="grok"] { cursor: grab; }
    .card.is-dragging { cursor: grabbing; opacity: .72; }
    .is-card-dragging, .is-card-dragging * { user-select: none; }
    @keyframes ecg-scroll { to { transform: translateX(-170px); } }
    @keyframes monitor-blink { 50% { opacity: .22; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" data-card="claude" style="--accent: var(--claude)">
      <header class="brand">
        <img src="{{CLAUDE_ICON}}" alt="">
        <h1 data-i18n="claude_name">Claude Code</h1>
        <button class="switch" data-action="switch" data-i18n="switch_panel">⇄ Switch Panel</button>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="codex" style="--accent: var(--codex)">
      <header class="brand">
        <img src="{{CODEX_ICON}}" alt="">
        <h1 data-i18n="codex_name">Codex</h1>
        <div class="codex-stale" data-codex-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-codex-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-codex-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="agy" style="--accent: var(--agy)">
      <header class="brand">
        <div class="brand-icon"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"></path></svg></div>
        <h1 data-i18n="agy_name">Antigravity</h1>
        <button type="button" class="agy-group-toggle" data-action="set_agy_quota_group" title="" aria-label=""></button>
        <div class="codex-stale" data-agy-stale hidden>
          <span aria-hidden="true">⚠</span>
          <span data-agy-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-agy-stale-tooltip></span>
          </span>
        </div>
      </header>
      <div class="row" data-row="session"></div>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="grok" style="--accent: var(--grok)">
      <header class="brand">
        <div class="brand-icon" aria-hidden="true"><svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></div>
        <h1 data-i18n="grok_name">Grok</h1>
        <div class="codex-stale" data-grok-stale hidden>
          <span aria-hidden="true">⚠</span><span data-grok-stale-age></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ<span class="codex-stale-tooltip" data-grok-stale-tooltip></span></span>
        </div>
      </header>
      <div class="row" data-row="weekly"></div>
    </section>

    <section class="card" data-card="projects" style="--accent: var(--projects)">
      <header class="brand">
        <div class="brand-icon"><svg width="30" height="30" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.75 8.25C4.75 7.14543 5.64543 6.25 6.75 6.25H10.5729C10.9737 6.25 11.3598 6.40073 11.6548 6.67228L12.9952 7.90522C13.2902 8.17677 13.6763 8.3275 14.0771 8.3275H19.25C20.3546 8.3275 21.25 9.22293 21.25 10.3275V17.75C21.25 18.8546 20.3546 19.75 19.25 19.75H6.75C5.64543 19.75 4.75 18.8546 4.75 17.75V8.25Z" stroke="var(--projects)" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.25 11.25H18.75" stroke="var(--projects)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/><path d="M8.75 14.15C8.75 13.4596 9.30964 12.9 10 12.9H10.3C10.9904 12.9 11.55 13.4596 11.55 14.15V16.5H8.75V14.15Z" fill="var(--projects)" opacity="0.18" stroke="var(--projects)" stroke-width="1.4"/><path d="M12.6 13.25C12.6 12.6425 13.0925 12.15 13.7 12.15H14.05C14.6575 12.15 15.15 12.6425 15.15 13.25V16.5H12.6V13.25Z" fill="var(--projects)" opacity="0.3" stroke="var(--projects)" stroke-width="1.4"/><path d="M16.2 14.85C16.2 14.1873 16.7373 13.65 17.4 13.65H17.75C18.4127 13.65 18.95 14.1873 18.95 14.85V16.5H16.2V14.85Z" fill="var(--projects)" opacity="0.48" stroke="var(--projects)" stroke-width="1.4"/></svg></div>
        <h1 data-i18n="projects_title">Project Usage</h1>
        <div class="codex-stale" data-history-error hidden>
          <span aria-hidden="true">⚠</span>
          <span data-history-error-text></span>
          <span class="codex-stale-info" aria-hidden="true">ⓘ
            <span class="codex-stale-tooltip" data-history-error-tooltip></span>
          </span>
        </div>
        <div class="project-actions">
          <button class="switch" data-action="toggle-project-range">Today</button>
          <button class="switch" data-action="analyze" data-i18n="analyze_usage">Analyze</button>
          <button class="switch" data-action="toggle-statusline" data-i18n="cli">CLI</button>
        </div>
      </header>
      <div data-project-list></div>
    </section>

    <section class="footer">
      <div data-footer="service-alerts" hidden></div>
      <div class="meta">
        <div data-footer="rate">Rate: --</div>
        <div data-footer="status">Status: Loading</div>
      </div>
      <div class="today" data-footer="today">Today: $0.00 (0 tokens)</div>

      <div class="actions">
        <button class="action primary" data-action="refresh" data-i18n="refresh_now">↻ Refresh Now</button>
        <button class="action" data-action="quit" data-i18n="quit">⏻ Quit</button>
        <button class="action" data-action="install" data-i18n="install_hook">Install Hook</button>
      </div>
      <p class="attribution">based on <a href="https://github.com/aqua5230/usage" target="_blank">usage</a> by lollapalooza</p>
    </section>
  </main>

  <script>
    window.PanelHooks = {
      applyFillVisual(fillEl, { available, percent, color }) {
        const row = fillEl.closest(".row");
        const value = available && Number.isFinite(percent) ? Math.max(0, Math.min(100, percent)) : 0;
        row.style.setProperty("--pct", value);
        row.style.setProperty("--trace-color", color);
        fillEl.style.width = available ? `${value}%` : "0%";
        if (!available) row.querySelector(".percent").textContent = "--";
        if (row.querySelector(".ecg-wave")) return;

        const ns = "http://www.w3.org/2000/svg";
        const wave = document.createElement("div");
        wave.className = "ecg-wave";
        wave.setAttribute("aria-hidden", "true");
        const trace = document.createElement("div");
        trace.className = "ecg-trace";
        const waveform = "M0 16 H48 L53 13 L58 20 L63 16 H73 L76 5 L80 28 L84 16 H99 L105 14 L111 19 L117 16 H170";
        for (let i = 0; i < 2; i += 1) {
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", "0 0 170 32");
          svg.setAttribute("preserveAspectRatio", "none");
          const pulse = document.createElementNS(ns, "path");
          pulse.setAttribute("class", "ecg-heartbeat");
          pulse.setAttribute("d", waveform);
          const flat = document.createElementNS(ns, "path");
          flat.setAttribute("class", "ecg-flat");
          flat.setAttribute("d", "M0 16 H170");
          svg.append(pulse, flat);
          trace.append(svg);
        }
        const dot = document.createElement("span");
        dot.className = "ecg-dot";
        wave.append(trace, dot);
        row.insertBefore(wave, fillEl.parentElement);
      }
    };
  </script>
  <script>
{{CORE_SCRIPT}}  </script>
</body>
</html>

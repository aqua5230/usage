    function parseSummary(text) {
      const sections = new Map(SUMMARY_HEADINGS.map((heading) => [heading, []]));
      let active = null;
      `${text || ""}`.split(/\r?\n/).forEach((line) => {
        const normalized = line.trim().replace(/^#+\s*/, "").replace(/[：:]$/, "");
        if (sections.has(normalized)) {
          active = normalized;
        } else if (active) {
          sections.get(active).push(line);
        }
      });
      if (![...sections.values()].some((lines) => lines.length) && text) {
        sections.set("共識", [`${text}`]);
      }
      return sections;
    }

    function renderSummary() {
      summaryEl.replaceChildren();
      const turns = Array.isArray(state.turns) ? state.turns : [];
      const totalRounds = Number(state.total_rounds) || Number(totalRoundsEl.value);
      const summaryTurn = [...turns].reverse().find(
        (turn) => Number(turn.round_index) > totalRounds,
      );
      summaryText = summaryTurn && summaryTurn.status === "DONE"
        ? `${summaryTurn.text || ""}`
        : "";
      copyEl.disabled = !summaryText;

      const consensusRound = Number(state.consensus_reached_round);
      if (Number.isInteger(consensusRound) && consensusRound >= 2) {
        const reason = document.createElement("div");
        reason.className = "consensus-early-exit";
        reason.textContent = t("discussion_consensus_early_exit", {
          round: consensusRound,
        });
        summaryEl.append(reason);
      }

      const consensus = state.consensus_count;
      if (consensus && typeof consensus === "object") {
        const count = document.createElement("div");
        count.className = "consensus-count";
        const countSummary = document.createElement("div");
        countSummary.textContent = t("discussion_consensus_count_summary", {
          total: ["agree", "disagree", "alternative", "unparsed"]
            .reduce((total, key) => total + (Number(consensus[key]) || 0), 0),
          agree: Number(consensus.agree) || 0,
          disagree: Number(consensus.disagree) || 0,
          alternative: Number(consensus.alternative) || 0,
          unparsed: Number(consensus.unparsed) || 0,
        });
        const stances = consensus.stances && typeof consensus.stances === "object"
          ? consensus.stances
          : {};
        const stanceRows = Object.entries(stances).map(([participantId, stance]) => {
          const row = document.createElement("div");
          row.className = `turn-head consensus-stance-${stance}`;
          const name = document.createElement("span");
          name.className = "turn-name";
          name.textContent = participantNameFromState(participantId);
          const label = document.createElement("span");
          label.className = "turn-status";
          label.textContent = t(`discussion_consensus_stance_${stance}`);
          row.append(name, label);
          return row;
        });
        count.replaceChildren(countSummary, ...stanceRows);
        summaryEl.append(count);
      }

      const appendUsageTotal = () => {
        const usage = document.createElement("div");
        usage.className = "summary-usage";
        usage.textContent = t("discussion_usage_total", {
          tokens: usageText(usageTotals().total_tokens),
        });
        summaryEl.append(usage);
      };

      if (
        !summaryTurn
        || !["DONE", "FAILED"].includes(summaryTurn.status)
        || (!summaryText && summaryTurn.status !== "FAILED")
      ) {
        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = t(
          isRunning() ? "discussion_summary_waiting" : "discussion_summary_empty",
        );
        summaryEl.append(placeholder);
        appendUsageTotal();
        return;
      }
      if (summaryTurn.status === "FAILED") {
        const failure = document.createElement("div");
        failure.className = "error-banner";
        failure.textContent = `${summaryTurn.error || t("discussion_turn_failed")}`;
        summaryEl.append(failure);
        appendUsageTotal();
        return;
      }

      const parsed = parseSummary(summaryText);
      const keys = {
        "共識": "discussion_consensus",
        "主要分歧": "discussion_disagreement",
        "建議方案": "discussion_recommendation",
        "風險與未知": "discussion_risks",
      };
      SUMMARY_HEADINGS.forEach((heading) => {
        const section = document.createElement("section");
        section.className = "summary-section";
        const title = document.createElement("h3");
        title.textContent = t(keys[heading]);
        const text = document.createElement("div");
        text.className = "summary-text";
        text.textContent = parsed.get(heading).join("\n").trim();
        section.append(title, text);
        summaryEl.append(section);
      });
      appendUsageTotal();
    }

    function summaryForClipboard() {
      const parsed = parseSummary(summaryText);
      const keys = {
        "共識": "discussion_consensus",
        "主要分歧": "discussion_disagreement",
        "建議方案": "discussion_recommendation",
        "風險與未知": "discussion_risks",
      };
      return SUMMARY_HEADINGS.map((heading) => {
        const body = parsed.get(heading).join("\n").trim();
        return `${t(keys[heading])}\n${body}`;
      }).join("\n\n");
    }

    function render() {
      closePersonaMenu();
      initializeSelection();
      renderModerator();
      renderParticipants();
      renderEstimate();
      renderWorkingDirectory();
      renderAttachments();
      renderControls();
      renderProgress();
      renderHistory();
      renderSummary();
    }

    function ensureTurn(event) {
      if (!Array.isArray(state.turns)) state.turns = [];
      let turn = state.turns.find((item) => item.id === event.turn_id);
      if (!turn) {
        turn = {
          id: event.turn_id,
          participant_id: event.participant_id,
          round_index: event.payload.round_index,
          text: "",
          status: "PENDING",
          error: null,
          supports_token_stream: Boolean(event.payload.supports_token_stream),
          usage: null,
        };
        state.turns.push(turn);
      }
      if (typeof event.payload.supports_token_stream === "boolean") {
        turn.supports_token_stream = event.payload.supports_token_stream;
      }
      return turn;
    }

    function refreshUsageTotals() {
      const turns = Array.isArray(state.turns) ? state.turns : [];
      state.usage_totals = turns.reduce((totals, turn) => {
        const usage = turn.usage && typeof turn.usage === "object" ? turn.usage : {};
        totals.input_tokens += Number(usage.input_tokens) || 0;
        totals.output_tokens += Number(usage.output_tokens) || 0;
        totals.total_tokens += Number(usage.total_tokens) || 0;
        return totals;
      }, { input_tokens: 0, output_tokens: 0, total_tokens: 0 });
    }

    function applyEvent(event) {
      if (!event || event.session_id !== currentSessionId) return false;
      const sequence = Number(event.event_seq);
      if (!Number.isFinite(sequence) || sequence <= latestEventSeq) return false;
      latestEventSeq = sequence;
      const payload = event.payload && typeof event.payload === "object" ? event.payload : {};
      event.payload = payload;

      if (event.kind === "turn_started") {
        ensureTurn(event).status = "RUNNING";
      } else if (event.kind === "text_delta") {
        const turn = ensureTurn(event);
        turn.text = `${turn.text || ""}${payload.text || ""}`;
      } else if (event.kind === "text_replace") {
        const turn = ensureTurn(event);
        turn.text = `${payload.text || ""}`;
      } else if (event.kind === "turn_usage") {
        ensureTurn(event).usage = {
          input_tokens: Number(payload.input_tokens) || 0,
          output_tokens: Number(payload.output_tokens) || 0,
          total_tokens: Number(payload.total_tokens) || 0,
        };
        refreshUsageTotals();
      } else if (event.kind === "turn_done") {
        ensureTurn(event).status = "DONE";
      } else if (event.kind === "turn_failed") {
        const turn = ensureTurn(event);
        turn.status = "FAILED";
        turn.error = `${payload.error || ""}`;
      } else if (event.kind === "turn_cancelled") {
        ensureTurn(event).status = "CANCELLED";
      } else if (event.kind === "round_started") {
        state.current_round = Number(payload.round_index);
        state.status = Number(payload.round_index) === 1 ? "ROUND1_RUNNING" : "ROUND2_RUNNING";
      } else if (event.kind === "guidance_requested") {
        state.current_round = Number(payload.round_index);
        state.status = "AWAITING_GUIDANCE";
      } else if (event.kind === "consensus_counted") {
        state.consensus_count = {
          agree: Number(payload.agree) || 0,
          disagree: Number(payload.disagree) || 0,
          alternative: Number(payload.alternative) || 0,
          unparsed: Number(payload.unparsed) || 0,
          stances: payload.stances && typeof payload.stances === "object"
            ? { ...payload.stances }
            : {},
        };
      } else if (event.kind === "consensus_reached") {
        state.consensus_reached_round = Number(payload.round_index) || null;
      } else if (event.kind === "session_done") {
        state.status = `${payload.status || "COMPLETED"}`;
      } else if (event.kind === "session_failed") {
        state.status = "FAILED";
        window.discussionApplyError(`${payload.error || ""}`);
      }
      return event.kind === "turn_started" || event.kind === "text_delta" || event.kind === "text_replace";
    }

    window.discussionApplySnapshot = (snapshot) => {
      const next = snapshot && typeof snapshot === "object" ? snapshot : {};
      const sessionId = typeof next.session_id === "string" ? next.session_id : null;
      if (sessionId !== currentSessionId) {
        currentSessionId = sessionId;
        latestEventSeq = Number.isFinite(Number(next.event_seq)) ? Number(next.event_seq) : -1;
      } else {
        latestEventSeq = Math.max(latestEventSeq, Number(next.event_seq) || -1);
      }
      state = next;
      if (Object.prototype.hasOwnProperty.call(next, "working_directory")) {
        workingDirectory = typeof next.working_directory === "string"
          ? next.working_directory
          : null;
      }
      if (typeof next.topic === "string" && next.topic && topicEl.value !== next.topic) {
        topicEl.value = next.topic;
      }
      render();
    };

    window.discussionApplyEvents = (events) => {
      if (!Array.isArray(events)) return;
      const wasNearBottom = isHistoryNearBottom();
      const previousScrollTop = historyEl.scrollTop;
      let shouldFollow = false;
      events.forEach((event) => {
        shouldFollow = applyEvent(event) || shouldFollow;
      });
      render();
      if (wasNearBottom && shouldFollow) {
        scrollHistoryToBottom();
      } else {
        historyEl.scrollTop = previousScrollTop;
      }
    };

    window.discussionApplyDetection = (results) => {
      detection = Array.isArray(results) ? results : [];
      detecting = false;
      render();
    };

    window.discussionApplyPersonas = (items) => {
      personas = Array.isArray(items) ? items : [];
      const validIds = new Set(personas.map((item) => item.id));
      PARTICIPANT_IDS.forEach((id) => {
        if (!validIds.has(selectedPersonas[id])) selectedPersonas[id] = null;
      });
      render();
    };

    window.discussionApplyWorkingDir = (path) => {
      workingDirectory = typeof path === "string" && path.length > 0 ? path : null;
      renderWorkingDirectory();
    };

    function flashAttachmentHint(hint) {
      if (attachmentHintTimer !== null) {
        window.clearTimeout(attachmentHintTimer);
        attachmentHintTimer = null;
      }
      attachmentHintEl.textContent = hint || "";
      if (hint) {
        attachmentHintTimer = window.setTimeout(() => {
          attachmentHintEl.textContent = "";
          attachmentHintTimer = null;
        }, 1800);
      }
    }

    window.discussionApplyAttachments = (payload) => {
      const data = payload && typeof payload === "object" ? payload : {};
      attachments = Array.isArray(data.attachments) ? data.attachments : [];
      renderAttachments();
      const hint = typeof data.hint === "string" && data.hint ? data.hint : null;
      flashAttachmentHint(hint);
    };

    window.discussionApplyError = (message) => {
      errorEl.textContent = `${message || ""}`;
    };

    const DROP_MAX_BYTES = 20 * 1024 * 1024;
    const DROP_IMAGE_EXT = /\.(png|jpe?g|gif|webp)$/i;

    function readDroppedImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = typeof reader.result === "string" ? reader.result : "";
          const comma = result.indexOf(",");
          resolve(comma >= 0 ? result.slice(comma + 1) : result);
        };
        reader.onerror = () => resolve("");
        reader.readAsDataURL(file);
      });
    }

    async function handleDrop(event) {
      const transfer = event.dataTransfer;
      const files = transfer ? Array.from(transfer.files || []) : [];
      if (!files.length) return;
      for (const file of files) {
        const isImage = /^image\//i.test(file.type) || DROP_IMAGE_EXT.test(file.name);
        if (!isImage) {
          flashAttachmentHint(t("discussion_drop_not_image", { name: file.name }));
          continue;
        }
        if (file.size > DROP_MAX_BYTES) {
          flashAttachmentHint(t("discussion_drop_too_large", { name: file.name }));
          continue;
        }
        const base64 = await readDroppedImage(file);
        if (!base64) {
          flashAttachmentHint(t("discussion_drop_failed"));
          continue;
        }
        send("discussion_drop_image", { data: base64, name: file.name });
      }
    }

    topicEl.addEventListener("input", renderControls);
    totalRoundsEl.addEventListener("change", () => {
      renderEstimate();
      renderControls();
    });
    roundsSegmentedEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-round]");
      if (!button || isRunning()) return;
      totalRoundsEl.value = button.dataset.round;
      renderEstimate();
      renderControls();
    });
    includeSummaryEl.addEventListener("change", () => {
      renderEstimate();
      renderControls();
    });
    endOnConsensusEl.addEventListener("change", renderControls);
    guidanceBetweenRoundsEl.addEventListener("change", renderControls);
    debateStyleEl.addEventListener("change", renderControls);
    topicEl.addEventListener("paste", (event) => {
      const clipboard = event.clipboardData;
      const types = clipboard ? Array.from(clipboard.types || []) : [];
      const looksTextOnly = types.includes("text/plain")
        && !types.includes("Files")
        && !types.some((type) => /^image\//i.test(`${type}`));
      if (looksTextOnly) return;
      event.preventDefault();
      send("discussion_paste_image");
    });
    const topicFieldEl = topicEl.closest(".field") || topicEl;
    topicFieldEl.addEventListener("dragover", (event) => {
      event.preventDefault();
    });
    topicFieldEl.addEventListener("drop", (event) => {
      event.preventDefault();
      handleDrop(event);
    });
    detectEl.addEventListener("click", () => {
      errorEl.textContent = "";
      detecting = true;
      renderControls();
      send("discussion_detect");
    });
    pickFolderEl.addEventListener("click", () => send("discussion_pick_folder"));
    clearFolderEl.addEventListener("click", () => send("discussion_clear_folder"));
    attachImageEl.addEventListener("click", () => send("discussion_pick_image"));
    startEl.addEventListener("click", () => {
      errorEl.textContent = "";
      send("discussion_start", {
        topic: topicEl.value,
        participants: [...selected],
        moderatorId: moderatorId || null,
        workingDir: workingDirectory,
        attachments: attachments.map((item) => item.path).filter(Boolean),
        totalRounds: Number(totalRoundsEl.value),
        includeSummary: includeSummaryEl.checked,
        endOnConsensus: endOnConsensusEl.checked,
        guidanceBetweenRounds: guidanceBetweenRoundsEl.checked
          && Number(totalRoundsEl.value) > 1,
        models: { ...selectedModels },
        personas: { ...selectedPersonas },
        debateStyle: debateStyleEl.value,
      });
    });
    stopEl.addEventListener("click", () => send("discussion_stop"));
    sessionBarStopEl.addEventListener("click", () => stopEl.click());
    sessionBarToggleEl.addEventListener("click", () => {
      settingsCollapsed = !settingsCollapsed;
      render();
    });
    setupCollapseToggleEl.addEventListener("click", () => {
      settingsCollapsed = !settingsCollapsed;
      render();
    });
    function resetClearConfirmation() {
      clearConfirming = false;
      if (clearConfirmTimer !== null) window.clearTimeout(clearConfirmTimer);
      clearConfirmTimer = null;
      clearEl.textContent = t("discussion_clear");
    }
    clearEl.addEventListener("click", () => {
      if (!clearConfirming) {
        clearConfirming = true;
        clearEl.textContent = t("discussion_clear_confirm");
        clearConfirmTimer = window.setTimeout(resetClearConfirmation, 5000);
        return;
      }
      resetClearConfirmation();
      send("discussion_clear");
    });
    clearEl.addEventListener("mouseleave", resetClearConfirmation);
    copyEl.addEventListener("click", async () => {
      if (!summaryText) return;
      const clipboardText = summaryForClipboard();
      let copied = false;
      try {
        await navigator.clipboard.writeText(clipboardText);
        copied = true;
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = clipboardText;
        document.body.append(textarea);
        try {
          textarea.select();
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        } finally {
          textarea.remove();
        }
      }
      if (!copied) {
        window.discussionApplyError(t("discussion_copy_failed"));
        return;
      }
      if (copyFeedbackTimer !== null) window.clearTimeout(copyFeedbackTimer);
      copyEl.textContent = t("discussion_copied");
      copyFeedbackTimer = window.setTimeout(() => {
        copyEl.textContent = t("discussion_copy");
        copyFeedbackTimer = null;
      }, 1200);
    });

    document.addEventListener("pointerdown", (event) => {
      if (!activePersonaMenu) return;
      const { menu, trigger } = activePersonaMenu;
      if (menu.contains(event.target) || trigger.contains(event.target)) return;
      closePersonaMenu();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && activePersonaMenu) {
        event.preventDefault();
        closePersonaMenu(true);
      }
    });
    document.addEventListener(
      "scroll",
      (event) => {
        if (!activePersonaMenu || event.target === activePersonaMenu.menu) return;
        positionPersonaMenu(activePersonaMenu.trigger, activePersonaMenu.menu);
      },
      true,
    );
    window.addEventListener("resize", () => {
      if (!activePersonaMenu) return;
      positionPersonaMenu(activePersonaMenu.trigger, activePersonaMenu.menu);
    });

    document.addEventListener("DOMContentLoaded", () => {
      const preferred = I18N[INITIAL_LANGUAGE] ? INITIAL_LANGUAGE : navigator.language;
      currentLanguage = I18N[preferred] ? preferred : "en";
      applyStaticText();
      render();
      send("discussion_attach");
    });
  </script>
</body>
</html>

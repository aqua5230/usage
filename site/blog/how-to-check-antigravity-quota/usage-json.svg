<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 512" role="img" aria-label="Antigravity 的 JSON 輸出用 groups 列出三個額度池，並用 window、remaining_fraction 和 reset_time 表示額度週期、剩餘比例和補滿時間。" font-family="Noto Sans TC, -apple-system, sans-serif">
<title>Antigravity 的 JSON 輸出用 groups 列出三個額度池，並用 window、remaining_fraction 和 reset_time 表示額度週期、剩餘比例和補滿時間。</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9CFC0"/><stop offset=".55" stop-color="#6E9E8E"/><stop offset="1" stop-color="#3F6E61"/></linearGradient>
<radialGradient id="g1" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#E8D9B5" stop-opacity=".55"/><stop offset="1" stop-color="#E8D9B5" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2A22" flood-opacity=".38"/></filter>
</defs>
<rect width="600" height="512" rx="16" fill="url(#bg)"/><rect width="600" height="512" rx="16" fill="url(#g1)"/>
<g filter="url(#sh)"><rect x="20" y="20" width="560" height="472" rx="12" fill="#1E2228" stroke="#FFFFFF1A"/></g>
<circle cx="40" cy="38" r="6" fill="#FF5F57"/><circle cx="58" cy="38" r="6" fill="#FEBC2E"/><circle cx="76" cy="38" r="6" fill="#28C840"/>
<text x="300" y="43" font-size="13" fill="#9AA0A6" text-anchor="middle">~ — zsh</text>
<line x1="20" y1="56" x2="580" y2="56" stroke="#FFFFFF14"/>
<g font-family="Menlo, Consolas, monospace" font-size="14" fill="#F2F2F2">
<text x="36" y="84"><tspan fill="#8A939E">you@MacBook ~ % </tspan><tspan>agy -p /usage --output-format json</tspan></text>
<text x="36" y="115">"command": {</text>
<text x="52.8" y="136">"data": {</text>
<text x="69.6" y="157">"<tspan fill="#9FD3BD">groups</tspan>": [</text>
<text x="86.4" y="183">{ "name": "Gemini Models",</text>
<text x="103.2" y="204">"buckets": [</text>
<text x="120" y="225">{ "<tspan fill="#8AB4F8">window</tspan>": "weekly", "<tspan fill="#F2C46D">remaining_fraction</tspan>": 0.77,</text>
<text x="136.8" y="251">"<tspan fill="#F6A9A2">reset_time</tspan>": "2026-11-28T10:00:11Z" },</text>
<text x="120" y="277">{ "<tspan fill="#8AB4F8">window</tspan>": "5h",</text>
<text x="136.8" y="298">"<tspan fill="#F2C46D">remaining_fraction</tspan>": 0.95, … } ] },</text>
<text x="86.4" y="319">{ "name": "Claude and GPT models", … },</text>
<text x="86.4" y="340">{ "name": "Gemini 4 Argon", … } ] } }</text>
</g>
<g fill="none" stroke-width="1.6" stroke-linecap="round">
<path d="M78 162V167H129V162" stroke="#7FB59F"/>
<path d="M146 230V235H196V230" stroke="#8AB4F8"/>
<path d="M314 230V235H466V230" stroke="#F2C46D"/>
<path d="M146 256V261H230V256" stroke="#F28B82"/>
</g>
<path d="M36 359H564" stroke="#FFFFFF1A"/>
<g font-size="15">
<text x="36" y="388" fill="#9FD3BD" font-family="Menlo, Consolas, monospace">groups</text>
<text x="36" y="410" fill="#F2F2F2">三個額度池</text>
<text x="302" y="388" fill="#8AB4F8" font-family="Menlo, Consolas, monospace">window</text>
<text x="302" y="410" fill="#F2F2F2">weekly＝每週、5h＝5 小時</text>
<text x="36" y="451" fill="#F2C46D" font-family="Menlo, Consolas, monospace">remaining_fraction</text>
<text x="36" y="473" fill="#F2F2F2">剩下的比例：0.77＝剩 77%</text>
<text x="302" y="451" fill="#F6A9A2" font-family="Menlo, Consolas, monospace">reset_time</text>
<text x="302" y="473" fill="#F2F2F2">補滿時間（UTC）</text>
</g>
</svg>

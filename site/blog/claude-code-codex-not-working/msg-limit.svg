<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 252" role="img" aria-label="Claude Code 的 5 小時額度和每週額度用完訊息" font-family="Noto Sans TC, -apple-system, sans-serif">
<title>Claude Code 的 5 小時額度和每週額度用完訊息</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DDE6E1"/>
    <stop offset="1" stop-color="#CEDBD4"/>
  </linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141414" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="790" height="252" rx="16" fill="url(#bg)"/>
<g filter="url(#sh)">
  <rect x="26" y="26" width="632" height="172" rx="10" fill="#161616" stroke="#2C2C2C" stroke-width="1"/>
</g>
<circle cx="43" cy="42" r="5" fill="#FF5F57"/>
<circle cx="59" cy="42" r="5" fill="#FEBC2E"/>
<circle cx="75" cy="42" r="5" fill="#28C840"/>
<rect x="260.39" y="34" width="163.22" height="16" fill="#161616" data-role="watermark-mask"/>
<text x="342" y="46" font-size="12" font-family="-apple-system, Noto Sans TC, sans-serif" fill="#8A8A8A" text-anchor="middle" data-role="watermark">aqua5230.github.io/usage</text>
<rect x="36" y="64" width="612" height="22" rx="4" fill="#262626"/>
<text x="44" y="80" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#8A939E">❯ </tspan><tspan fill="#E0E0E0">幫我把首頁標題改短一點</tspan></text>
<text x="44" y="104" font-size="14" font-family="Menlo, Consolas, monospace" fill="#F2777A" xml:space="preserve" data-role="terminal">  ⎿  You&#x27;ve hit your 5-hour limit · resets 2pm (Asia/Taipei)</text>
<rect x="36" y="128" width="612" height="22" rx="4" fill="#262626"/>
<text x="44" y="144" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve" data-role="terminal"><tspan fill="#8A939E">❯ </tspan><tspan fill="#E0E0E0">幫我把首頁標題改短一點</tspan></text>
<text x="44" y="168" font-size="14" font-family="Menlo, Consolas, monospace" fill="#F2777A" xml:space="preserve" data-role="terminal">  ⎿  You&#x27;ve hit your weekly limit · resets Nov 27 at 5am (Asia/Taipei)</text>
<line x1="649.59" y1="164" x2="658" y2="164" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="658" y1="164" x2="676" y2="164" stroke="#666666" stroke-width="1.25"/>
<text x="684" y="168" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="start" data-role="label">括號裡是時區</text>
<path d="M 412.00 175 V 180 H 521.59 V 175" fill="none" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="466.80" y1="180" x2="466.80" y2="198" stroke="#8C8C8C" stroke-width="1.25"/>
<line x1="466.80" y1="198" x2="466.80" y2="216" stroke="#666666" stroke-width="1.25"/>
<text x="466.80" y="232" font-size="13" font-weight="500" fill="#1F2A26" text-anchor="middle" data-role="label">resets 後面是重置時間</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 377" role="img" aria-label="Claude Code’s 5-hour limit refills five hours after your first message, and its weekly limit resets at a fixed day and time for your account." font-family="Noto Sans TC, -apple-system, sans-serif">
<title>Claude Code’s 5-hour limit refills five hours after your first message, and its weekly limit resets at a fixed day and time for your account.</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9CFC0"/><stop offset=".55" stop-color="#6E9E8E"/><stop offset="1" stop-color="#3F6E61"/></linearGradient><radialGradient id="g1" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#E8D9B5" stop-opacity=".55"/><stop offset="1" stop-color="#E8D9B5" stop-opacity="0"/></radialGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2A22" flood-opacity=".38"/></filter></defs>
<rect width="600" height="377" rx="16" fill="url(#bg)"/><rect width="600" height="377" rx="16" fill="url(#g1)"/>
<g filter="url(#sh)"><rect x="20" y="20" width="560" height="150" rx="14" fill="#1E2228" stroke="#FFFFFF1A"/></g>
<text x="38" y="51" font-size="21" fill="#F2F2F2" font-weight="700">5-hour limit</text>
<g fill="#9FD3BD" font-weight="600">
<text x="48" y="83" font-size="16">09:00</text>
<text x="552" y="83" font-size="16" text-anchor="end">14:00</text>
</g>
<g fill="#F2F2F2" font-size="15">
<text x="48" y="104">Send your first message</text>
<text x="552" y="104" text-anchor="end">Refills</text>
</g>
<rect x="48" y="115" width="504" height="25" rx="12.5" fill="#9FD3BD"/>
<text x="300" y="133" font-size="15" fill="#1E2228" text-anchor="middle" font-weight="700">5 hours</text>
<text x="300" y="157" font-size="15" fill="#9FD3BD" text-anchor="middle">Starts when you send your first message</text>
<g filter="url(#sh)"><rect x="20" y="186" width="560" height="171" rx="14" fill="#1E2228" stroke="#FFFFFF1A"/></g>
<text x="38" y="217" font-size="21" fill="#F2F2F2" font-weight="700">Weekly limit</text>
<path d="M48 271H342" stroke="#8A939E" stroke-width="2" stroke-linecap="round"/>
<path d="M342 271H548" stroke="#8A939E" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5"/>
<path d="M48 266V276M342 266V276M548 267L552 271L548 275" fill="none" stroke="#8A939E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#F2C46D">
<circle cx="216" cy="271" r="5"/>
<circle cx="510" cy="271" r="5"/>
</g>
<g fill="none" stroke="#F2C46D" stroke-width="1.6" stroke-linecap="round">
<path d="M216 259V253H510V259"/>
</g>
<g fill="#F2C46D" font-size="15" font-weight="600">
<text x="216" y="243" text-anchor="middle">Friday 05:00</text>
<text x="560" y="243" text-anchor="end">Next Friday 05:00</text>
</g>
<g font-size="14" fill="#8A939E">
<text x="48" y="297">Monday</text>
<text x="342" y="297" text-anchor="middle">Next Monday</text>
<text x="552" y="342" text-anchor="end">Times are examples</text>
</g>
<text x="48" y="324" font-size="15" fill="#F2C46D">Your account’s reset day and time stay fixed</text>
</svg>

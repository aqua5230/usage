<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 412" role="img" aria-label="Claude Code 的 5 小時額度在第一則訊息後 5 小時補滿，每週額度則在帳號固定的星期和時間重置。" font-family="Noto Sans TC, -apple-system, sans-serif">
<title>Claude Code 的 5 小時額度在第一則訊息後 5 小時補滿，每週額度則在帳號固定的星期和時間重置。</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#DDE6E1"/>
    <stop offset="1" stop-color="#CEDBD4"/>
  </linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141414" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="600" height="412" rx="16" fill="url(#bg)"/>
<g filter="url(#sh)">
  <rect x="26" y="42" width="548" height="344" rx="10" fill="#161616" stroke="#2C2C2C" stroke-width="1"/>
</g>
<line x1="46" y1="208" x2="554" y2="208" stroke="#2C2C2C" stroke-width="1"/>
<text x="48" y="76" font-size="16" font-weight="700" fill="#E0E0E0" data-role="label">5 小時額度</text>
<text x="56" y="106" font-size="14" font-weight="600" fill="#E0E0E0" data-role="label">09:00</text>
<text x="544" y="106" font-size="14" font-weight="600" fill="#E0E0E0" text-anchor="end" data-role="label">14:00</text>
<text x="56" y="125" font-size="13" font-weight="400" fill="#8A939E" data-role="label">送出第一則訊息</text>
<text x="544" y="125" font-size="13" font-weight="400" fill="#8A939E" text-anchor="end" data-role="label">補滿</text>
<line x1="56" y1="146" x2="544" y2="146" stroke="#F2C46D" stroke-width="2"/>
<circle cx="56" cy="146" r="4" fill="#F2C46D"/>
<circle cx="544" cy="146" r="4" fill="#F2C46D"/>
<rect x="272.0" y="138" width="56" height="16" fill="#161616"/>
<text x="300" y="150" font-size="13" font-weight="600" fill="#E0E0E0" text-anchor="middle" data-role="label">5 小時</text>
<text x="300" y="182" font-size="13" font-weight="400" fill="#8A939E" text-anchor="middle" data-role="label">從你的第一則訊息開始算</text>

<text x="48" y="242" font-size="16" font-weight="700" fill="#E0E0E0" data-role="label">每週額度</text>
<text x="212" y="274" font-size="13.5" font-weight="600" fill="#E0E0E0" text-anchor="middle" data-role="label">週五 05:00</text>
<text x="478" y="274" font-size="13.5" font-weight="600" fill="#E0E0E0" text-anchor="middle" data-role="label">下週五 05:00</text>
<path d="M 212 289 V 283 H 478 V 289" fill="none" stroke="#F2C46D" stroke-width="1.25"/>
<line x1="60" y1="300" x2="326" y2="300" stroke="#8A939E" stroke-width="1.5"/>
<line x1="326" y1="300" x2="540" y2="300" stroke="#8A939E" stroke-width="1.5" stroke-dasharray="3 4"/>
<path d="M 60 295 V 305 M 326 295 V 305 M 538 296 L 544 300 L 538 304" fill="none" stroke="#8A939E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="212" cy="300" r="4.5" fill="#F2C46D"/>
<circle cx="478" cy="300" r="4.5" fill="#F2C46D"/>
<text x="60" y="324" font-size="13" font-weight="400" fill="#8A939E" data-role="label">週一</text>
<text x="326" y="324" font-size="13" font-weight="400" fill="#8A939E" text-anchor="middle" data-role="label">下週一</text>
<text x="48" y="362" font-size="13.5" font-weight="500" fill="#E0E0E0" data-role="label">帳號固定的星期和時間，不會變</text>
<text x="552" y="362" font-size="12.5" font-weight="400" fill="#8A939E" text-anchor="end" data-role="label">時間為舉例</text>
<rect x="218.39" y="16" width="163.22" height="16" fill="#DCE5E0" data-role="watermark-mask"/>
<text x="300" y="28" font-size="12" font-family="-apple-system, Noto Sans TC, sans-serif" fill="#8A8A8A" text-anchor="middle" data-role="watermark">aqua5230.github.io/usage</text>
</svg>

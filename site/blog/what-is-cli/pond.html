<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜池</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03080b; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 7vh; margin: 0; text-align: center;
    font: 15px/1 "Songti TC", "Noto Serif CJK TC", "Source Han Serif TC", serif;
    letter-spacing: .6em; padding-left: .6em;
    color: #b9c8e6; opacity: .5; pointer-events: none; transition: opacity 2.5s ease;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="pond"></canvas>
<p id="hint">點一下水面</p>
<script>
'use strict';

const CELL = 4;       // 水面模擬的一格 = 4 CSS px
const WAVE = 0.45;    // 波傳多快（超過約 0.75 會爆掉）
const DAMP = 0.99;    // 每一步波剩下多少
const N = 10;         // 魚脊椎的節點數

const canvas = document.getElementById('pond');
const hint = document.getElementById('hint');
// 出錯時把訊息直接印在畫面上，不必開 devtools
addEventListener('error', e => { hint.textContent = e.message; hint.className = ''; hint.style.letterSpacing = '0'; });
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
if (!gl) throw new Error('這個瀏覽器不支援 WebGL2');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 著色器：每個像素看水面斜率，決定看到的是水底、魚、還是倒影 ----------
const VS = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D uH, uFish;
uniform vec2 uView, uGrid, uShadow;
uniform float uDpr, uTime, uCell, uShimmer;
uniform vec3 uMoon;
uniform vec4 uBox;
uniform vec4 uPads[4];
out vec4 outColor;

const float REFL = 150.0;  // 倒影對斜率很敏感：一點小波就能把月亮打散
const float REFR = 22.0;   // 看水底時的折射偏移

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; }
  return s;
}

// 水面映出的夜空：星星、月暈、月亮
vec3 sky(vec2 q) {
  vec3 c = vec3(0.010, 0.022, 0.045);
  vec2 m = q - uMoon.xy;
  float d = length(m), R = uMoon.z;

  vec2 g = q / 26.0, id = floor(g), f = fract(g);
  vec2 sp = vec2(hash(id + 3.1), hash(id + 7.7)) * 0.7 + 0.15;
  float sd = length(f - sp) * 26.0;
  float star = step(0.86, hash(id)) * pow(hash(id + 1.9), 2.5) * exp(-sd * sd * 1.6);
  star *= 0.6 + 0.4 * sin(uTime * (0.8 + 2.0 * hash(id + 5.3)) + hash(id) * 40.0);
  c += vec3(0.75, 0.82, 1.0) * star * smoothstep(R * 1.2, R * 3.0, d);

  c += vec3(0.42, 0.52, 0.68) * (0.07 * exp(-d / (R * 4.0)) + 0.28 * exp(-max(d - R, 0.0) / (R * 0.28)));

  if (d < R + 2.0) {
    vec2 mq = m / R;
    float mare = fbm(mq * 2.2 + 3.7);
    vec3 mc = vec3(1.0, 0.96, 0.86) * mix(1.0, 0.8, smoothstep(0.48, 0.66, mare)) * (1.0 - 0.16 * dot(mq, mq));
    c = mix(c, mc, 1.0 - smoothstep(R - 1.0, R + 1.0, d));
  }
  return c;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uView.y * uDpr - gl_FragCoord.y) / uDpr;   // CSS px，y 向下

  // 水面斜率：高度圖左右相減、上下相減
  vec2 uv = p / (uGrid * uCell), t = 1.0 / uGrid;
  vec2 s = vec2(texture(uH, uv + vec2(t.x, 0)).r - texture(uH, uv - vec2(t.x, 0)).r,
                texture(uH, uv + vec2(0, t.y)).r - texture(uH, uv - vec2(0, t.y)).r) / (2.0 * uCell);
  s += uShimmer * (vec2(noise(p * 0.018 + uTime * vec2(0.21, 0.13)),
                        noise(p * 0.018 - uTime * vec2(0.17, 0.19) + 9.0)) - 0.5);

  // 水下：池底、影子、魚，全部跟著波折射
  vec2 rp = p + s * REFR;
  vec3 under = mix(vec3(0.008, 0.026, 0.030), vec3(0.030, 0.070, 0.066), fbm(rp * 0.004)) * (0.85 + 0.3 * noise(rp * 0.05));
  under *= 1.0 - 0.6 * textureLod(uFish, (rp - uShadow - uBox.xy) / uBox.zw, log2(6.0 * uDpr)).a;
  for (int i = 0; i < 4; i++) {
    float pd = length(rp - uPads[i].xy - uShadow * 1.6);
    under *= 1.0 - 0.5 * (1.0 - smoothstep(uPads[i].z * 0.7, uPads[i].z * 1.15, pd));
  }
  vec4 fish = textureLod(uFish, (rp - uBox.xy) / uBox.zw, 0.0);
  under = under * (1.0 - fish.a) + fish.rgb * vec3(0.62, 0.70, 0.78);

  // 水面：倒影 + 迎著月光的波面亮一點，整片水的漣漪才看得見
  vec2 toMoon = uMoon.xy - p;
  float lit = exp(-length(toMoon) / (length(uView) * 0.45));
  float sheen = dot(s, normalize(toMoon + 0.001)) * 2.0;
  vec3 col = (under + sky(p + s * REFL) * 0.9 * (1.0 - 0.5 * fish.a)) * max(1.0 + 0.6 * min(sheen, 0.0), 0.2)
           + vec3(0.30, 0.40, 0.55) * max(sheen, 0.0) * (0.35 + 1.2 * lit);

  // 睡蓮葉浮在最上層
  for (int i = 0; i < 4; i++) {
    vec4 pad = uPads[i];
    vec2 q = p - pad.xy;
    float d = length(q), fi = float(i);
    float a = mod(atan(q.y, q.x) - pad.w + 3.14159, 6.28318) - 3.14159;
    // 葉緣微微起伏，不是正圓；倍頻都是整數，繞一圈剛好接回來
    float rr = pad.z * (1.0 + 0.025 * sin(a * 3.0 + fi * 1.7) + 0.012 * sin(a * 7.0 + fi * 4.1));
    float m = (1.0 - smoothstep(rr - 0.8, rr + 0.8, d)) * smoothstep(-0.6, 0.6, (abs(a) - 0.11) * d);
    col *= 1.0 - 0.3 * (1.0 - smoothstep(rr, rr + 7.0, d));   // 葉子貼著水面的一圈暗影
    vec2 tm = normalize(uMoon.xy - pad.xy);
    float t = d / rr, ml = dot(q / max(d, 0.001), tm);
    vec3 pc = mix(vec3(0.07, 0.14, 0.06), vec3(0.10, 0.18, 0.07), fbm(q * 0.03 + fi * 13.0));
    pc = mix(pc, vec3(0.12, 0.07, 0.05), 0.25 * mod(fi, 2.0) * smoothstep(0.66, 0.82, fbm(q * 0.09 + fi * 7.0)));   // 零星的紅褐斑
    // 葉脈很淡：從中心直直放射，外圈再分岔一次，靠邊淡掉
    float va = a + 0.012 * sin(d * 0.2 + fi);
    float vein = pow(abs(cos(va * 9.0)), 50.0) * smoothstep(0.06, 0.25, t)
               + 0.6 * pow(abs(cos(va * 18.0)), 60.0) * smoothstep(0.45, 0.65, t);
    pc += vec3(0.018, 0.025, 0.01) * vein * (1.0 - smoothstep(0.75, 0.98, t));
    pc *= 0.85 + 0.15 * smoothstep(0.0, 0.08, t);                        // 葉柄那一點微凹
    // 葉面有蠟，迎著月亮那側有一塊柔和的反光，也淡淡映出夜空
    pc += vec3(0.035, 0.045, 0.04) * exp(-length(q - tm * rr * 0.45) / (rr * 0.3));
    pc += sky(p) * 0.1;
    float rim = smoothstep(rr - 3.0, rr - 0.6, d);                       // 葉緣微翹
    pc += vec3(0.12, 0.15, 0.10) * rim * max(ml, 0.0);
    pc = mix(pc, vec3(0.15, 0.06, 0.05), 0.35 * rim * max(-ml, 0.0));    // 背光那側翹起來，露出紅色葉背
    col = mix(col, pc, m);
  }

  vec2 v = (p - 0.5 * uView) / (0.5 * uView);
  col *= mix(1.0, 0.35, smoothstep(0.45, 1.45, length(v)));
  col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0;   // 抖色，避免暗部色帶
  outColor = vec4(max(col, 0.0), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U = {};
for (const n of ['uH', 'uFish', 'uView', 'uGrid', 'uShadow', 'uDpr', 'uTime', 'uCell', 'uShimmer', 'uMoon', 'uBox', 'uPads'])
  U[n] = gl.getUniformLocation(prog, n);

// 一個蓋滿畫面的三角形
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function makeTexture(unit, minFilter) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minFilter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
makeTexture(0, gl.LINEAR);                // 水面高度圖
makeTexture(1, gl.LINEAR_MIPMAP_LINEAR);  // 魚圖層（mipmap 順便拿來當模糊影子）
gl.uniform1i(U.uH, 0);
gl.uniform1i(U.uFish, 1);

const fc = document.createElement('canvas');   // 只畫魚的小畫布，每幀上傳給著色器
const fx = fc.getContext('2d');

// ---------- 水面：波動方程式 ----------
let W, H, dpr, gw, gh, cur, prev, moon, pads, L, BOX;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);

  gw = Math.ceil(W / CELL) + 2; gh = Math.ceil(H / CELL) + 2;
  cur = new Float32Array(gw * gh);
  prev = new Float32Array(gw * gh);
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, gw, gh, 0, gl.RED, gl.FLOAT, cur);

  const m = Math.min(W, H);
  moon = { x: W * 0.62, y: H * 0.38, r: m * 0.075 };
  L = Math.max(48, Math.min(100, m * 0.11));
  BOX = Math.ceil(L * 2.4);
  fc.width = fc.height = Math.ceil(BOX * dpr);
  pads = [[0.17, 0.74, 0.085, 2.4], [0.25, 0.86, 0.05, -0.8], [0.86, 0.2, 0.065, 0.9], [0.9, 0.33, 0.035, 3.6]]
    .map(([x, y, r, a]) => ({ x: x * W, y: y * H, r: r * m, a, ox: 0, oy: 0 }));
}

function step() {
  const g = gw;
  for (let y = 1; y < gh - 1; y++) {
    let i = y * g + 1;
    for (let x = 1; x < g - 1; x++, i++) {
      const c = cur[i];
      const lap = (4 * (cur[i - 1] + cur[i + 1] + cur[i - g] + cur[i + g])
                 + cur[i - g - 1] + cur[i - g + 1] + cur[i + g - 1] + cur[i + g + 1] - 20 * c) / 6;
      prev[i] = (2 * c - prev[i] + WAVE * lap) * DAMP;
    }
  }
  [cur, prev] = [prev, cur];
}

// 在 (px, py) 壓一個半徑 r 的圓滑水包
function drop(px, py, r, amp) {
  const cx = px / CELL - 0.5, cy = py / CELL - 0.5, rc = r / CELL;
  const x0 = Math.max(1, Math.floor(cx - rc)), x1 = Math.min(gw - 2, Math.ceil(cx + rc));
  const y0 = Math.max(1, Math.floor(cy - rc)), y1 = Math.min(gh - 2, Math.ceil(cy + rc));
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d < rc) cur[y * gw + x] += amp * 0.5 * (1 + Math.cos(Math.PI * d / rc));
    }
}

function updatePads() {
  for (const p of pads) {
    const gx = Math.min(gw - 2, Math.max(1, Math.floor(p.x / CELL)));
    const gy = Math.min(gh - 2, Math.max(1, Math.floor(p.y / CELL)));
    const i = gy * gw + gx;
    p.ox += (-(cur[i + 1] - cur[i - 1]) * 1.5 - p.ox) * 0.08;
    p.oy += (-(cur[i + gw] - cur[i - gw]) * 1.5 - p.oy) * 0.08;
  }
}

// ---------- 魚 ----------
const fish = { x: 0, y: 0, a: 0, v: 60, phase: 0, burst: 0, leg: 0, route: [], joints: [] };
const rand = (a, b) => a + Math.random() * (b - a);
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

function inside(x, y) {
  const m = Math.min(90, W * 0.12, H * 0.12);
  return { x: Math.min(W - m, Math.max(m, x)), y: Math.min(H - m, Math.max(m, y)) };
}

// 一半機率刻意穿過月亮倒影，另一半隨便逛
function planRoute(viaMoon) {
  if (viaMoon) {
    const a = Math.atan2(moon.y - fish.y, moon.x - fish.x) + rand(-0.5, 0.5);
    const far = rand(moon.r * 2.5, moon.r * 5);
    fish.route = [
      { x: moon.x + rand(-0.4, 0.4) * moon.r, y: moon.y + rand(-0.4, 0.4) * moon.r },
      inside(moon.x + Math.cos(a) * far, moon.y + Math.sin(a) * far),
    ];
  } else {
    fish.route = [inside(rand(0, W), rand(0, H))];
  }
  fish.leg = 0;
}

function placeFish() {
  fish.x = moon.x - W * 0.22;
  fish.y = moon.y + H * 0.2;
  fish.a = Math.atan2(moon.y - fish.y, moon.x - fish.x);
  fish.joints = Array.from({ length: N }, (_, i) => ({
    x: fish.x - Math.cos(fish.a) * i * L / (N - 1),
    y: fish.y - Math.sin(fish.a) * i * L / (N - 1),
  }));
  planRoute(true);
}

function updateFish(dt, time) {
  if (!fish.route.length || (fish.leg += dt) > 12) planRoute(Math.random() < 0.5);
  const goal = fish.route[0];
  const dx = goal.x - fish.x, dy = goal.y - fish.y, dist = Math.hypot(dx, dy);
  if (dist < 45) { fish.route.shift(); fish.leg = 0; }

  const want = Math.atan2(dy, dx) + 0.3 * Math.sin(time * 0.7) * Math.min(1, dist / 200);
  const diff = wrap(want - fish.a);
  const turn = (1.6 + fish.burst * 4) * dt;
  fish.a += Math.max(-turn, Math.min(turn, diff));
  fish.burst = Math.max(0, fish.burst - dt * 0.9);

  const cruise = (60 + 20 * Math.sin(time * 0.23)) * (1 - 0.45 * Math.abs(diff) / Math.PI);
  fish.v += ((cruise + fish.burst * 240) * (calm ? 0.5 : 1) - fish.v) * Math.min(1, dt * 3);
  fish.x += Math.cos(fish.a) * fish.v * dt;
  fish.y += Math.sin(fish.a) * fish.v * dt;
  fish.phase += dt * (4 + fish.v * 0.085);

  // 身體每一節被前一節拖著走
  const J = fish.joints, seg = L / (N - 1);
  J[0].x = fish.x; J[0].y = fish.y;
  for (let i = 1; i < N; i++) {
    const ex = J[i].x - J[i - 1].x, ey = J[i].y - J[i - 1].y, d = Math.hypot(ex, ey) || 1;
    J[i].x = J[i - 1].x + ex / d * seg;
    J[i].y = J[i - 1].y + ey / d * seg;
  }
}

// 魚把水推開：頭持續推，尾巴左右甩
function wake() {
  const k = fish.v / 70, h = fish.joints[0], t = fish.joints[N - 1];
  drop(h.x, h.y, L * 0.2, 0.1 * k);
  drop(t.x, t.y, L * 0.15, 0.13 * k * Math.sin(fish.phase));
}

function startle(x, y) {
  const dx = fish.x - x, dy = fish.y - y, d = Math.hypot(dx, dy) || 1;
  if (d > L * 2.5) return;
  fish.burst = 1;
  fish.route = [inside(fish.x + dx / d * L * 4, fish.y + dy / d * L * 4)];
  fish.leg = 0;
}

const bodyWidth = u => L * 0.135 * Math.sin(Math.PI * Math.pow(u * 0.92 + 0.04, 0.62)) * (1 - 0.5 * u);

// 把一串點連成圓滑的封閉曲線
function smooth(pts) {
  const path = new Path2D(), n = pts.length;
  path.moveTo((pts[n - 1].x + pts[0].x) / 2, (pts[n - 1].y + pts[0].y) / 2);
  for (let k = 0; k < n; k++) {
    const a = pts[k], b = pts[(k + 1) % n];
    path.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
  }
  return path;
}

function drawFish(ox, oy) {
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.clearRect(0, 0, fc.width, fc.height);
  fx.setTransform(dpr, 0, 0, dpr, -ox * dpr, -oy * dpr);

  // 脊椎加上一道從頭傳到尾的擺動波
  const J = fish.joints, P = [];
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1), a = J[Math.max(i - 1, 0)], b = J[Math.max(i, 1)];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const sway = L * 0.07 * u ** 1.5 * Math.sin(fish.phase - u * 5);
    P.push({ x: J[i].x - (a.y - b.y) / d * sway, y: J[i].y + (a.x - b.x) / d * sway, u });
  }
  for (let i = 0; i < N; i++) {
    const a = P[Math.max(i - 1, 0)], b = P[Math.min(i + 1, N - 1)];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    P[i].tx = (a.x - b.x) / d;   // 朝頭的方向
    P[i].ty = (a.y - b.y) / d;
    P[i].w = bodyWidth(P[i].u);
  }
  const side = (p, s, k = 1) => ({ x: p.x - p.ty * p.w * s * k, y: p.y + p.tx * p.w * s * k });

  // 沿脊椎取任意位置（可以是小數節點）
  const at = v => {
    const k = Math.min(Math.floor(v), N - 2), w = v - k, a = P[k], b = P[k + 1];
    return { x: a.x + (b.x - a.x) * w, y: a.y + (b.y - a.y) * w, tx: a.tx, ty: a.ty, w: a.w + (b.w - a.w) * w };
  };

  // 半透明的鰭：根部濃、外緣淡，上面有幾條鰭條
  const fin = (x, y, ang, len, wid) => {
    fx.save();
    fx.translate(x, y);
    fx.rotate(ang);
    const g = fx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, 'rgba(255, 236, 222, 0.75)');
    g.addColorStop(1, 'rgba(255, 236, 222, 0.15)');
    fx.fillStyle = g;
    fx.beginPath();
    fx.moveTo(0, -wid * 0.2);
    fx.bezierCurveTo(len * 0.5, -wid * 0.9, len * 1.05, -wid * 0.6, len, 0);
    fx.bezierCurveTo(len * 1.05, wid * 0.6, len * 0.5, wid * 0.9, 0, wid * 0.2);
    fx.fill();
    fx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    fx.lineWidth = L * 0.005;
    fx.beginPath();
    for (let k = -2; k <= 2; k++) { fx.moveTo(0, 0); fx.lineTo(len * 0.95, k * wid * 0.22); }
    fx.stroke();
    fx.restore();
  };

  // 胸鰭大、腹鰭小，都往後斜張開
  for (const [i, len, wid, spread] of [[2, 0.24, 0.13, 0.9], [5, 0.13, 0.07, 0.6]]) {
    const p = P[i], back = Math.atan2(-p.ty, -p.tx);
    for (const s of [1, -1]) {
      const base = side(p, s, 0.8);
      fin(base.x, base.y, back - s * (spread + 0.18 * Math.sin(fish.phase * 0.5 + s)), L * len, L * wid);
    }
  }

  // 尾鰭：兩片尾葉、中間分岔，根部帶紅、越往外越透明
  const tail = P[N - 1], tl = L * 0.36, tw = L * 0.2, f = Math.sin(fish.phase - 5.6);
  fx.save();
  fx.translate(tail.x, tail.y);
  fx.rotate(Math.atan2(-tail.ty, -tail.tx) + 0.3 * f);
  const tg = fx.createLinearGradient(0, 0, tl, 0);
  tg.addColorStop(0, 'rgba(236, 104, 60, 0.85)');
  tg.addColorStop(0.35, 'rgba(255, 214, 192, 0.55)');
  tg.addColorStop(1, 'rgba(255, 240, 230, 0.18)');
  fx.fillStyle = tg;
  const t1 = -tw * (1 - 0.15 * f), t2 = tw * (1 + 0.15 * f);   // 兩片尾葉隨擺動一前一後
  fx.beginPath();
  fx.moveTo(-L * 0.03, -L * 0.02);
  fx.bezierCurveTo(tl * 0.35, -tw * 0.35, tl * 0.8, t1 * 0.9, tl, t1);
  fx.quadraticCurveTo(tl * 0.72, -tw * 0.2, tl * 0.66, 0);
  fx.quadraticCurveTo(tl * 0.72, tw * 0.2, tl, t2);
  fx.bezierCurveTo(tl * 0.8, t2 * 0.9, tl * 0.35, tw * 0.35, -L * 0.03, L * 0.02);
  fx.fill();
  fx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  fx.lineWidth = L * 0.005;
  fx.beginPath();
  for (let k = -3; k <= 3; k++) { fx.moveTo(0, 0); fx.lineTo(tl * (0.7 + 0.26 * Math.abs(k) / 3), k / 3 * tw * 0.9); }
  fx.stroke();
  fx.restore();

  // 身體：白底紅斑（紅白錦鯉），頭頂一塊紅、鼻頭留白
  const head = P[0];
  const body = smooth([
    { x: head.x + head.tx * L * 0.04, y: head.y + head.ty * L * 0.04 },
    ...P.map(p => side(p, 1)),
    ...P.map(p => side(p, -1)).reverse(),
  ]);
  fx.fillStyle = '#f4ede4';
  fx.fill(body);
  fx.save();
  fx.clip(body);
  fx.fillStyle = '#e2502a';
  // 每塊紅斑用幾個橢圓疊出來，邊緣才不會太圓
  for (const [v, s, rx, ry] of [
    [1.0, 0, 0.065, 0.06], [1.5, 0.15, 0.05, 0.06], [1.4, -0.2, 0.04, 0.05],
    [2.5, 0.2, 0.11, 0.075], [3.1, -0.25, 0.09, 0.07], [3.5, 0.35, 0.06, 0.05], [2.8, -0.5, 0.05, 0.04],
    [5.0, 0.15, 0.1, 0.06], [5.5, -0.3, 0.07, 0.05], [4.6, 0.45, 0.05, 0.04],
    [6.7, -0.3, 0.06, 0.045], [7.2, 0.25, 0.05, 0.04]]) {
    const c = side(at(v), s);
    fx.beginPath();
    fx.ellipse(c.x, c.y, L * rx, L * ry, Math.atan2(c.y - at(v + 0.5).y, c.x - at(v + 0.5).x), 0, Math.PI * 2);
    fx.fill();
  }
  fx.strokeStyle = 'rgba(120, 50, 30, 0.14)';   // 鱗片：往尾巴那側開口的小弧
  fx.lineWidth = L * 0.005;
  for (let v = 1.6; v < 8; v += 0.55)
    for (const s of [-0.55, -0.18, 0.18, 0.55]) {
      const c = side(at(v + (Math.abs(s) > 0.3 ? 0.27 : 0)), s), back = Math.atan2(-c.ty, -c.tx);
      fx.beginPath();
      fx.arc(c.x, c.y, L * 0.03, back - 1.1, back + 1.1);
      fx.stroke();
    }
  fx.lineCap = fx.lineJoin = 'round';
  fx.strokeStyle = 'rgba(255, 255, 255, 0.15)';  // 背脊反光
  fx.lineWidth = L * 0.06;
  fx.beginPath();
  fx.moveTo(P[1].x, P[1].y);
  for (let i = 2; i < 8; i++) fx.lineTo(P[i].x, P[i].y);
  fx.stroke();
  fx.strokeStyle = 'rgba(30, 30, 50, 0.35)';      // 邊緣壓暗，身體看起來圓
  fx.lineWidth = L * 0.07;
  fx.stroke(body);
  fx.restore();

  // 背鰭：沿背脊一條窄鰭，跟著身體左右倒
  for (const [color, width] of [['rgba(60, 40, 40, 0.25)', 0.035], ['rgba(255, 245, 240, 0.6)', 0.018]]) {
    fx.strokeStyle = color;
    fx.lineWidth = L * width;
    fx.beginPath();
    for (let v = 2.5; v <= 6; v += 0.5) {
      const c = side(at(v), 0.18 * Math.sin(fish.phase - v * 0.6));
      v === 2.5 ? fx.moveTo(c.x, c.y) : fx.lineTo(c.x, c.y);
    }
    fx.stroke();
  }

  // 眼睛長在頭的兩側，嘴邊一對短鬚
  const e = at(0.45), nose = at(0.1);
  for (const s of [1, -1]) {
    const c = side(e, s, 0.82);
    fx.fillStyle = '#1a0d08';
    fx.beginPath();
    fx.arc(c.x, c.y, L * 0.02, 0, Math.PI * 2);
    fx.fill();
    fx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    fx.beginPath();
    fx.arc(c.x + head.tx * L * 0.006, c.y + head.ty * L * 0.006, L * 0.006, 0, Math.PI * 2);
    fx.fill();
    const b = side(nose, s, 0.8);
    fx.strokeStyle = 'rgba(245, 225, 210, 0.55)';
    fx.lineWidth = L * 0.006;
    fx.beginPath();
    fx.moveTo(b.x, b.y);
    fx.quadraticCurveTo(b.x + head.tx * L * 0.025, b.y + head.ty * L * 0.025,
      b.x + head.tx * L * 0.03 - head.ty * s * L * 0.025, b.y + head.ty * L * 0.03 + head.tx * s * L * 0.025);
    fx.stroke();
  }
}

// ---------- 互動與主迴圈 ----------
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  drop(x, y, 16, -5);
  startle(x, y);
  hint.classList.add('gone');
});
addEventListener('resize', () => { resize(); placeFish(); });

resize();
placeFish();

const padData = new Float32Array(16);
let time = 0, last = performance.now(), acc = 0;
let paused = false, raf = 0;   // raf：已排好的下一格，避免暫停後馬上播放疊出兩條迴圈
const schedule = () => { if (!raf) raf = requestAnimationFrame(frame); };

// 外層頁面用 postMessage 叫它暫停／繼續（捲出畫面、或讀者按了暫停）
addEventListener('message', e => {
  if (e.source !== parent) return;
  if (e.data === 'pond:pause') paused = true;
  else if (e.data === 'pond:play' && paused) { paused = false; last = performance.now(); schedule(); }
});

function frame(now) {
  raf = 0;
  if (paused) return;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  time += dt;
  updateFish(dt, time);
  for (acc += dt; acc >= 1 / 60; acc -= 1 / 60) { wake(); step(); }   // 固定 60 步/秒，高刷螢幕也一樣快
  updatePads();

  const mid = fish.joints[N >> 1];
  const bx = Math.round((mid.x - BOX / 2) * dpr) / dpr;
  const by = Math.round((mid.y - BOX / 2) * dpr) / dpr;
  drawFish(bx, by);

  gl.activeTexture(gl.TEXTURE0);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gw, gh, gl.RED, gl.FLOAT, cur);
  gl.activeTexture(gl.TEXTURE1);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fc);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);

  pads.forEach((p, i) => padData.set([p.x + p.ox, p.y + p.oy, p.r, p.a], i * 4));
  gl.uniform2f(U.uView, W, H);
  gl.uniform2f(U.uGrid, gw, gh);
  gl.uniform2f(U.uShadow, L * 0.25, L * 0.35);
  gl.uniform1f(U.uDpr, dpr);
  gl.uniform1f(U.uTime, time);
  gl.uniform1f(U.uCell, CELL);
  gl.uniform1f(U.uShimmer, calm ? 0.01 : 0.035);
  gl.uniform3f(U.uMoon, moon.x, moon.y, moon.r);
  gl.uniform4f(U.uBox, bx, by, fc.width / dpr, fc.height / dpr);
  gl.uniform4fv(U.uPads, padData);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  schedule();
}
schedule();
</script>

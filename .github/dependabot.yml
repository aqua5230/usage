version: 2
updates:
  # Hijacked releases are usually pulled within days, so version updates wait a
  # week before they are offered. Security updates ignore the cooldown.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init, analyze and upload-sarif must run the exact same version — a
      # split bump fails with "Loaded a configuration file for version X, but
      # running version Y". Grouping them keeps the three in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"

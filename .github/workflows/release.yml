name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Resolve ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GIT_REF" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - run: uv python install 3.13

      - run: uv sync --frozen --group dev

      - name: Guard against non-monotonic version tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_release_version.py "${{ github.repository }}" "${{ github.ref_name }}"

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run pytest
        run: uv run pytest -v

  build:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.ref.outputs.tag }}

    steps:
      - name: Resolve ref and tag
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GIT_REF" >> "$GITHUB_OUTPUT"
            echo "tag=$GIT_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build .app
        env:
          # py2app needs a Python build where extension modules like zlib are
          # real .so files with a __file__ (so it can copy them into the
          # bundle). uv's own downloaded interpreter builds some stdlib
          # extensions as built-ins with no __file__, which crashes py2app.
          # Force uv to use the actions/setup-python interpreter instead of
          # downloading its own.
          INSTATE_CLI_TOKEN: ${{ secrets.INSTATE_CLI_TOKEN }}
          UV_PYTHON_PREFERENCE: only-system
        run: ./scripts/build_app.sh

      - name: Verify .app bundle contents
        run: |
          set -e
          if [[ -d dist/main.app && ! -d dist/usage.app ]]; then
            mv dist/main.app dist/usage.app
          fi

          dump_resources() {
            echo "Contents/Resources listing:"
            ls -lR dist/usage.app/Contents/Resources | head -50 || true
          }

          verify_file() {
            if [[ ! -f "$1" ]]; then
              echo "Missing required bundle file: $1"
              dump_resources
              exit 1
            fi
          }

          if [[ ! -d dist/usage.app ]]; then
            echo "Missing app bundle: dist/usage.app"
            ls -l dist || true
            exit 1
          fi

          verify_file dist/usage.app/Contents/Resources/usage_statusline.py
          verify_file dist/usage.app/Contents/Resources/claude.webp
          verify_file dist/usage.app/Contents/Resources/codex.webp
          verify_file dist/usage.app/Contents/Info.plist

      - name: Zip .app
        run: |
          cd dist && zip -r usage.app.zip usage.app

      - name: Generate SHA256
        run: |
          cd dist && shasum -a 256 usage.app.zip | tee usage.app.zip.sha256

      - name: Generate CycloneDX SBOM
        run: uvx --from cyclonedx-bom cyclonedx-py environment --output-format JSON --output-file dist/usage-sbom.cdx.json .venv/bin/python

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "CHANGELOG.md has no section for [$VERSION]; using empty notes."
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create \
              "$TAG" \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file "$NOTES_PATH"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: gh release upload "$TAG" dist/usage.app.zip dist/usage.app.zip.sha256 dist/usage-sbom.cdx.json --clobber

      # Attest last: provenance is an add-on, and a failure here must not strand
      # a release with no artifacts attached.
      - name: Attest macOS build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/usage.app.zip

  build-windows:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read

    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GIT_REF" >> "$GITHUB_OUTPUT"
            echo "tag=$GIT_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - run: uv python install 3.13

      - name: Install Windows build dependencies
        run: |
          uv sync --frozen --group dev --extra windows
          uv pip install pyinstaller

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(uv run --no-sync python -c \
            'import tomllib,pathlib; print(tomllib.load(pathlib.Path("pyproject.toml").open("rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      # SignPath is opt-in: the credentials are configured per repository, and a
      # fork or a not-yet-onboarded main repo must still be able to ship a
      # Windows build rather than fail the whole release on a missing secret.
      - name: Resolve signing availability
        id: signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [[ -n "$SIGNPATH_API_TOKEN" && -n "$SIGNPATH_ORGANIZATION_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath credentials are not configured; shipping an unsigned Windows bundle."
          fi

      - name: Upload unsigned bundle for signing
        id: upload-unsigned-artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage-windows-unsigned
          path: dist

      - name: Submit signing request
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: usage
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Zip Windows bundle
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          $source = if ($env:SIGNED -eq 'true') { 'dist/signed/usage-windows' } else { 'dist/usage-windows' }
          Compress-Archive -Path $source -DestinationPath dist/usage-windows.zip
          $hash = (Get-FileHash dist/usage-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  usage-windows.zip" | Out-File -FilePath dist/usage-windows.zip.sha256 -Encoding ascii -NoNewline

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: gh release upload "$TAG" dist/usage-windows.zip dist/usage-windows.zip.sha256 --clobber

      # Attest last, for the same reason as the macOS job.
      - name: Attest Windows build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/usage-windows.zip

  bump-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ensure tap token present
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set; cannot update Homebrew tap." >&2
            exit 1
          fi

      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aqua5230/homebrew-usage
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download release checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release download "$TAG" \
            --repo aqua5230/usage \
            --pattern usage.app.zip.sha256 \
            --output checksum.txt

      - name: Update cask
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          SHA="$(awk '{print $1}' checksum.txt)"
          if [[ -z "$SHA" ]]; then
            echo "::error::Could not read sha256 from release checksum." >&2
            exit 1
          fi
          # url is derived from version via v#{version} interpolation, so only
          # version + sha256 need bumping (don't sed the url, it would break it).
          sed -i \
            -e "s|sha256 \"[0-9a-f]*\"|sha256 \"${SHA}\"|" \
            -e "s|version \"[^\"]*\"|version \"${VERSION}\"|" \
            Casks/usage.rb

      - name: Commit and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/usage.rb; then
            echo "Cask already up to date; nothing to commit."
            exit 0
          fi
          git add Casks/usage.rb
          git commit -m "usage $TAG"
          git push
